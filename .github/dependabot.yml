# Dependabot config — keeps Dockerfile base image digests current.
#
# Why this exists: docker/Dockerfile pins postgres + rust base images
# by SHA digest (`@sha256:...`) for supply-chain integrity. Without an
# automated bumper, those pins go stale and we'd ship known-CVE bases
# forever. Dependabot watches the FROM lines and opens a PR each week
# when upstream rebuilds.
#
# Cargo / GitHub Actions ecosystems are intentionally NOT watched here
# — adding them would change the project's overall update cadence
# (separate decision, separate PR).

version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - docker
