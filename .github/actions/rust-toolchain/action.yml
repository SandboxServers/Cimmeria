name: Rust toolchain (pinned)
description: >-
  Installs the Rust version pinned in rust-toolchain.toml, so CI, agents and local builds
  all compile with the same rustc. Drop-in replacement for dtolnay/rust-toolchain@stable:
  it takes the same `components` and `targets` inputs.
inputs:
  components:
    description: Comma-separated extra components (e.g. clippy, llvm-tools-preview)
    required: false
    default: ''
  targets:
    description: Comma-separated extra targets (e.g. i686-pc-windows-msvc)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then echo "::error::no channel in rust-toolchain.toml"; exit 1; fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    # Same commit the release workflow already pinned (the dtolnay `stable` branch);
    # the `toolchain` input overrides its default channel.
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
