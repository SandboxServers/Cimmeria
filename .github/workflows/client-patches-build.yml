name: client-patches

# Path-filtered: only runs when the cimmeria-client-patches crate, the
# codec crate it links, or this workflow changes. The crate is a Windows
# cdylib (i686, MSVC) injected into SGW.exe; its hooks only compile for that
# target, so a host or Linux build never checks them. The main `ci` workflow
# excludes it. Same shape as client-telemetry-build.yml.

on:
  push:
    branches: [main]
    paths:
      - 'crates/client-patches/**'
      - 'crates/patch-wire/**'
      - '.github/workflows/client-patches-*.yml'
  pull_request:
    paths:
      - 'crates/client-patches/**'
      - 'crates/patch-wire/**'
      - '.github/workflows/client-patches-*.yml'

concurrency:
  group: client-patches-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt --check (client-patches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if ! cargo fmt -p cimmeria-client-patches -- --check; then
            echo "::error::Formatting differs from rustfmt. Run 'cargo fmt -p cimmeria-client-patches' locally and commit the result."
            exit 1
          fi

  clippy:
    name: cargo clippy -D warnings (i686-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-patches-windows-i686
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy -p cimmeria-client-patches --target i686-pc-windows-msvc --all-targets -- -D warnings

  build:
    name: cargo build (i686-pc-windows-msvc)
    runs-on: windows-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-patches-windows-i686
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build (cdylib)
        run: cargo build -p cimmeria-client-patches --target i686-pc-windows-msvc --all-targets
      - name: verify DLL was produced
        shell: pwsh
        run: |
          $dll = "target/i686-pc-windows-msvc/debug/cimmeria_client_patches.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Expected $dll to be produced by cdylib build, but it was not."
            exit 1
          }
          Write-Host "DLL produced: $dll ($((Get-Item $dll).Length) bytes)"

  test:
    name: cargo nextest (i686-pc-windows-msvc)
    runs-on: windows-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-patches-windows-i686
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install nextest
        uses: taiki-e/install-action@nextest
      # patch-wire too: it is the DLL's decoder, so its tests also run on the
      # DLL's target.
      - name: cargo nextest run
        run: cargo nextest run --profile=ci -p cimmeria-client-patches -p cimmeria-patch-wire --target i686-pc-windows-msvc
