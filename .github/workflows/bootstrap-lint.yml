name: bootstrap-lint

# Validates the artifacts that the RE-toolchain bootstrap depends on so a
# malformed template or a syntactically broken PowerShell script doesn't
# silently ship and waste a contributor's setup time. Gated to paths that
# could affect either artifact.
#
# Checks today:
#   - .mcp.json.example parses as valid JSON (with the four expected
#     mcpServers entries present so a rename or accidental delete trips CI).
#   - Every PowerShell file under bootstrap/CimmeriaBootstrap/ parses via the
#     PowerShell AST, and the module exports the expected functions.
#   - Install-CimmeriaLauncher's tests (bootstrap/tests/), on Windows.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".mcp.json.example"
      - "bootstrap/**"
      - "setup.ps1"
      - "db/persistent/**"
      - ".github/workflows/bootstrap-lint.yml"

permissions: {}

concurrency:
  group: bootstrap-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: bootstrap artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: validate .mcp.json.example as JSON
        # Heredoc keeps the embedded Python visually unambiguous — column-0
        # statements vs. 4-space bodies — regardless of YAML's indent stripping.
        run: |
          set -e
          python3 - <<'PY'
          import json, sys
          with open('.mcp.json.example') as f:
              doc = json.load(f)
          servers = doc.get('mcpServers', {})
          expected = {'ghidra', 'x64dbg', 'cimmeria-lab', 'lab-server'}
          missing = expected - set(servers.keys())
          if missing:
              print(f'.mcp.json.example missing required mcpServers entries: {sorted(missing)}', file=sys.stderr)
              sys.exit(1)
          print(f'.mcp.json.example OK — servers: {sorted(servers.keys())}')
          PY

      - name: parse all bootstrap PowerShell files
        shell: pwsh
        run: |
          $files = @(
            'setup.ps1'
          ) + (Get-ChildItem -Recurse -Path 'bootstrap/CimmeriaBootstrap' -Include *.ps1, *.psm1, *.psd1 | ForEach-Object { $_.FullName })
          $fail = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors)
            if ($errors) {
              Write-Host "FAIL $f"
              $errors | ForEach-Object { Write-Host "  $_" }
              $fail = $true
            } else {
              Write-Host "OK   $f"
            }
          }
          if ($fail) { exit 1 }

      - name: verify bootstrap module exports expected functions
        shell: pwsh
        run: |
          Import-Module ./bootstrap/CimmeriaBootstrap -Force
          $expected = @(
            'Install-CimmeriaDependencies',
            'Install-CimmeriaReToolchain',
            'Build-CimmeriaServer',
            'Build-CimmeriaApp',
            'Install-CimmeriaLauncher',
            'Initialize-CimmeriaDatabase',
            'Start-CimmeriaServer',
            'Stop-CimmeriaServer',
            'Update-CimmeriaClient',
            'Invoke-CimmeriaBootstrap'
          )
          $actual = (Get-Command -Module CimmeriaBootstrap).Name
          $missing = $expected | Where-Object { $_ -notin $actual }
          if ($missing) {
            Write-Host "Missing exports: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All expected exports present: $($expected -join ', ')"

  # setup.ps1 -WithLauncher downloads the released launcher zip; the function is
  # Windows only, so its tests run on Windows against a local HTTP server.
  install-launcher:
    name: Install-CimmeriaLauncher tests (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: bootstrap/tests/test-install-launcher.ps1
        shell: pwsh
        run: pwsh -NoProfile -File bootstrap/tests/test-install-launcher.ps1

  # Resources-only refresh, -WipeDatabase routing and the -ForceDatabase case run against
  # a real PostgreSQL 17 service. Ubuntu, not Windows: a Windows PostgreSQL service is
  # unverified. CI_REQUIRE_PG=1 makes the test fail, not skip, when PostgreSQL is missing.
  database-refresh:
    name: database refresh tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      CI_REQUIRE_PG: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Local test only: lets psql connect as postgres and w-testing without PGPASSWORD.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install PostgreSQL 17 client tools (psql, pg_dump) from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          psql --version
          pg_dump --version
      - name: ensure pwsh is installed
        run: |
          command -v pwsh >/dev/null || sudo snap install powershell --classic
          pwsh --version
      - name: create role w-testing (superuser, as the local setup does)
        run: |
          psql -h localhost -p 5433 -U postgres -c "CREATE ROLE \"w-testing\" WITH LOGIN SUPERUSER CREATEDB PASSWORD 'w-testing'"
      - name: bootstrap/tests/test-database-refresh.ps1
        shell: pwsh
        run: pwsh -NoProfile -File bootstrap/tests/test-database-refresh.ps1
