name: regen-docs

# Regenerates the generated doc blocks (test counts, RE findings count, gap-analysis
# totals, crate graph; see tools/docs-gen/README.md) after every merge to main and
# commits the result. PRs never bump those numbers, so they never conflict on them.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, and never cancel a run that may be mid-push. A queued run checks
# out main's head, so it picks up everything merged while it waited.
concurrency:
  group: regen-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regen:
    name: regenerate generated doc blocks
    runs-on: ubuntu-latest
    # Pushes made with GITHUB_TOKEN don't trigger workflows, so the bot's commit can't
    # start another run. This guard also covers a push made with any other bot token.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # crate_graph.py reads `cargo metadata --no-deps`.
      - uses: ./.github/actions/rust-toolchain
      - name: regen.py unit tests
        run: python3 -m unittest discover -s tools/docs-gen -p "test_*.py"
      - name: regenerate
        run: python3 tools/docs-gen/regen.py
      - name: commit and push
        run: |
          if git diff --quiet; then
            echo "generated doc blocks are current; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -q -m "chore(docs): regenerate generated doc blocks" \
            -m "Generated by tools/docs-gen/regen.py from $(git rev-parse --short HEAD)."
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); main moved, rebasing"
            if ! git pull --rebase origin main; then
              # A merge touched a generated block: start again from the new main.
              git rebase --abort || true
              git reset --hard origin/main
              python3 tools/docs-gen/regen.py
              if git diff --quiet; then
                echo "new main is already current; nothing to commit"
                exit 0
              fi
              git commit -a -q -m "chore(docs): regenerate generated doc blocks"
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push the regenerated doc blocks after 5 attempts"
          exit 1
