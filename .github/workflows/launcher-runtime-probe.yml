name: launcher runtime probe

on:
  pull_request:
    paths:
      - 'crates/launcher/desktop/runtime-probe/**'
      - 'crates/client-launch/**'
      - 'crates/lab/**'
      - 'crates/client-telemetry/**'
      - 'crates/client-patches/**'
      - 'crates/client-hookgate/**'
      - 'crates/patch-wire/**'
      - 'crates/launcher/desktop/Cargo.toml'
      - 'crates/launcher/desktop/Cargo.lock'
      - '.github/workflows/launcher-runtime-probe.yml'
      - '.github/actions/rust-toolchain/**'
      - 'rust-toolchain.toml'
      - 'tools/build-lane/**'
  push:
    branches: [main]
    paths:
      - 'crates/launcher/desktop/runtime-probe/**'
      - 'crates/client-launch/**'
      - 'crates/lab/**'
      - 'crates/client-telemetry/**'
      - 'crates/client-patches/**'
      - 'crates/client-hookgate/**'
      - 'crates/patch-wire/**'
      - 'crates/launcher/desktop/Cargo.toml'
      - 'crates/launcher/desktop/Cargo.lock'
      - '.github/workflows/launcher-runtime-probe.yml'
      - '.github/actions/rust-toolchain/**'
      - 'rust-toolchain.toml'
      - 'tools/build-lane/**'

permissions:
  contents: read

# The small native x86 helper should not wait for unrelated desktop builds.
concurrency:
  group: launcher-runtime-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: i686-pc-windows-msvc
      - name: Check and test native 32-bit runtime probe
        run: |
          bash tools/build-lane/lane.sh cargo clippy --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-runtime-probe --target i686-pc-windows-msvc --all-targets -- -D warnings
          bash tools/build-lane/lane.sh cargo test --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-runtime-probe --target i686-pc-windows-msvc
          bash tools/build-lane/lane.sh cargo build --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-runtime-probe --target i686-pc-windows-msvc --target-dir target/runtime-probe
          target/runtime-probe/i686-pc-windows-msvc/debug/cimmeria-runtime-probe.exe --self-test
      - name: Record launch helper identity from the native build
        run: sha256sum target/runtime-probe/i686-pc-windows-msvc/debug/cimmeria-launch-worker.exe
      - name: Build the game patch resource natively
        run: |
          bash tools/build-lane/lane.sh cargo build --locked -p cimmeria-client-patches --target i686-pc-windows-msvc --target-dir target/client-patches
          sha256sum target/client-patches/i686-pc-windows-msvc/debug/cimmeria_client_patches.dll
      - name: Retain x86 probe for managed Wine validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-runtime-probe
          path: |
            target/runtime-probe/i686-pc-windows-msvc/debug/cimmeria-runtime-probe.exe
            target/runtime-probe/i686-pc-windows-msvc/debug/cimmeria-prerequisite-worker.exe
            target/runtime-probe/i686-pc-windows-msvc/debug/cimmeria-launch-worker.exe
            target/client-patches/i686-pc-windows-msvc/debug/cimmeria_client_patches.dll
          retention-days: 7

  local-lab-tools:
    # Development UAT only: these never enter the player launcher bundle.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - name: Build native lab supervisor and injection tools
        run: |
          bash tools/build-lane/lane.sh cargo build --locked -p cimmeria-lab --target-dir target/local-lab
          bash tools/build-lane/lane.sh cargo build --locked -p cimmeria-client-launch --bin sgw-start32 --target i686-pc-windows-msvc --target-dir target/local-lab
          bash tools/build-lane/lane.sh cargo build --locked -p cimmeria-client-telemetry --features lab-bridge --target i686-pc-windows-msvc --target-dir target/local-lab
          sha256sum target/local-lab/debug/cimmeria-lab.exe target/local-lab/i686-pc-windows-msvc/debug/sgw-start32.exe target/local-lab/i686-pc-windows-msvc/debug/cimmeria_client_telemetry.dll
      - name: Retain local-only UAT tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-local-lab-tools
          path: |
            target/local-lab/debug/cimmeria-lab.exe
            target/local-lab/i686-pc-windows-msvc/debug/sgw-start32.exe
            target/local-lab/i686-pc-windows-msvc/debug/cimmeria_client_telemetry.dll
          retention-days: 7
