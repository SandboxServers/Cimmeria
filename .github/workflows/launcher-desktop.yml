name: desktop launcher

on:
  pull_request:
    paths:
      - 'crates/launcher/desktop/**'
      - 'crates/launcher-core/**'
      - 'crates/client-launch/**'
      - 'crates/patchset/**'
      - 'crates/upk/**'
      - 'crates/workspace-hack/**'
      - 'Cargo.toml'
      - '.github/workflows/launcher-desktop.yml'
      - '.github/workflows/launcher-release.yml'
      - '.github/workflows/launcher-desktop-macos.yml'
      - '.github/workflows/launcher-desktop-linux.yml'
      - '.github/workflows/launcher-desktop-windows-arm64.yml'
      - 'tools/launcher-release/build-desktop.sh'
      - 'tools/launcher-release/build-desktop-macos.sh'
      - 'tools/launcher-release/build-desktop-linux.sh'
      - 'tools/launcher-release/publish.sh'
      - 'tools/launcher-release/stamp.sh'
      - 'tools/launcher-release/*.py'
      - 'tools/launcher-release/test-release-scripts.sh'
      - 'crates/client-patches/**'
      - 'crates/client-telemetry/**'
      - '.github/actions/rust-toolchain/**'
      - 'rust-toolchain.toml'
      - 'tools/build-lane/**'
  push:
    branches: [main]
    paths:
      - 'crates/launcher/desktop/**'
      - 'crates/launcher-core/**'
      - 'crates/client-launch/**'
      - 'crates/patchset/**'
      - 'crates/upk/**'
      - 'crates/workspace-hack/**'
      - 'Cargo.toml'
      - '.github/workflows/launcher-desktop.yml'
      - '.github/workflows/launcher-release.yml'
      - '.github/workflows/launcher-desktop-macos.yml'
      - '.github/workflows/launcher-desktop-linux.yml'
      - '.github/workflows/launcher-desktop-windows-arm64.yml'
      - 'tools/launcher-release/build-desktop.sh'
      - 'tools/launcher-release/build-desktop-macos.sh'
      - 'tools/launcher-release/build-desktop-linux.sh'
      - 'tools/launcher-release/publish.sh'
      - 'tools/launcher-release/stamp.sh'
      - 'tools/launcher-release/*.py'
      - 'tools/launcher-release/test-release-scripts.sh'
      - 'crates/client-patches/**'
      - 'crates/client-telemetry/**'
      - '.github/actions/rust-toolchain/**'
      - 'rust-toolchain.toml'
      - 'tools/build-lane/**'
  # A manual run on any branch adds release-dry-run-linux-real-key below: the
  # Linux AppImage with the release manifest public key, as an artifact only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-launcher-${{ github.ref }}
  # Validate the latest PR commit instead of queueing it behind obsolete
  # packaging. Main finishes to populate the caches PRs restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Windows jobs run on the self-hosted `cimmeria-windows` pool (node3,
# tools/ci-runners/README.md "Windows pool"). Fork and Dependabot PRs, and every run
# while the repository variable CI_WINDOWS_RUNNER is `hosted`, use windows-latest.
jobs:
  native-engine:
    # The check names stay `native-engine (windows-latest)` / `(macos-latest)` /
    # `(ubuntu-latest)` (tools/build-lane/ship.py waits on them), so matrix.os keeps
    # the hosted label and runs-on maps the Windows leg to the pool. The Linux leg
    # is the only build of the shell on Linux, where Install runs in-process.
    name: native-engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os != 'windows-latest' && matrix.os || ((github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_WINDOWS_RUNNER == 'hosted') && 'windows-latest' || 'cimmeria-windows') }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Tauri's WebKitGTK prerequisites, plus clang and mold, which
      # .cargo/config.toml names as the Linux linker.
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: launcher-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            crates/launcher/desktop -> ../../../target/desktop
      - name: Format standalone workspace
        run: cargo fmt --all --manifest-path crates/launcher/desktop/Cargo.toml -- --check
      - name: Check native engine
        run: bash tools/build-lane/lane.sh cargo clippy --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-engine --target-dir target/desktop --all-targets -- -D warnings
      - name: Test native storage and operation contracts
        run: bash tools/build-lane/lane.sh cargo test --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-engine --target-dir target/desktop
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check Effect workflow
        run: |
          npm ci --ignore-scripts --prefix crates/launcher/desktop/frontend
          npm run check --prefix crates/launcher/desktop/frontend
          npm test --prefix crates/launcher/desktop/frontend
          npm run uat:install --prefix crates/launcher/desktop/frontend
      - name: Build native state harness
        run: bash tools/build-lane/lane.sh cargo build --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-engine --target-dir target/desktop --example state_bridge
      - name: JS logic UAT against native persistence
        run: |
          bridge=target/desktop/debug/examples/state_bridge
          if [ "$RUNNER_OS" = Windows ]; then bridge="$bridge.exe"; fi
          npm run uat --prefix crates/launcher/desktop/frontend -- "$PWD/$bridge"
      - name: Check Mac helper staging guards
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s crates/launcher/desktop/tools -p 'test_*.py'
      - name: Build UI assets
        run: npm run build --prefix crates/launcher/desktop/frontend
      - name: Test native shell adapter without opening a window
        run: bash tools/build-lane/lane.sh cargo test --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-desktop --target-dir target/desktop
      - name: Check shell adapter
        run: bash tools/build-lane/lane.sh cargo clippy --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-desktop --target-dir target/desktop --all-targets -- -D warnings
      - name: Build native desktop executable
        run: bash tools/build-lane/lane.sh cargo build --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-desktop --target-dir target/desktop
      - name: Build Windows archive worker
        if: runner.os == 'Windows'
        run: bash tools/build-lane/lane.sh cargo build --locked --manifest-path crates/launcher/desktop/Cargo.toml -p cimmeria-launcher-engine --bin cimmeria-archive-worker --target-dir target/desktop
      - name: Retain Windows helper for supervised Wine validation
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-archive-worker
          path: target/desktop/debug/cimmeria-archive-worker.exe
          retention-days: 7

  # launcher-release.yml's desktop job must not be first tested at release
  # time. This runs the same tools/launcher-release/build-desktop.sh stages,
  # in release profile, minus publishing: the i686 launch worker and game
  # DLLs, staging them as bundled resources, the 64-bit launcher pinned to
  # them, the artifact checks, the zip, and the client-patches overlay pack.
  # The updater feed over both Windows zips is signed by release-dry-run-feed,
  # which needs this job and release-dry-run-arm64. No manifest key, no tag
  # and no updater key: it is a development build, as every PR build is. Like
  # the release's desktop-windows, it hands its three staged Play pieces on,
  # with their list's digest, to release-dry-run-mac-pieces.
  release-dry-run:
    name: desktop release build dry run (Windows)
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_WINDOWS_RUNNER == 'hosted') && 'windows-latest' || 'cimmeria-windows' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      play_pieces_sha256: ${{ steps.playpieces.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      # Self-hosted runners use the shared sccache instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: launcher-release-desktop-dry-run
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/launcher/desktop -> ../../../target/desktop
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: build the i686 launch worker and game DLLs
        run: tools/launcher-release/build-desktop.sh helpers
      - name: stage them as the launcher's bundled resources
        run: tools/launcher-release/build-desktop.sh stage
      - name: build the 64-bit desktop launcher, pinned to them
        run: tools/launcher-release/build-desktop.sh launcher
      - name: verify the artifacts
        run: tools/launcher-release/build-desktop.sh verify
      - name: package
        run: tools/launcher-release/build-desktop.sh package
      - name: pack the client-patches overlay
        run: tools/launcher-release/build-desktop.sh overlay https://example.invalid/dry-run
      - name: Retain the package for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-launcher-windows-dry-run
          path: |
            artifacts/StargateWorlds-Launcher-windows-x64.zip*
          if-no-files-found: error
          retention-days: 7
      - name: collect the staged Play pieces for the macOS build
        id: playpieces
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh play-pieces
          echo "sha256=$(sha256sum artifacts/play-pieces/play-pieces.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-play-pieces-dry-run
          path: artifacts/play-pieces/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The Windows on Arm build: the reusable release build, minus release
  # inputs. It takes the same Play pieces and their digest as the x64 build.
  release-dry-run-arm64:
    name: desktop release build dry run (Windows arm64)
    needs: release-dry-run
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-windows-arm64.yml
    with:
      pieces_artifact: desktop-play-pieces-dry-run
      pieces_sha256: ${{ needs.release-dry-run.outputs.play_pieces_sha256 }}
      artifact_name: desktop-launcher-windows-arm64-dry-run
      retention_days: 7
      cache_key: launcher-release-desktop-arm64-dry-run
      save_cache: ${{ github.ref == 'refs/heads/main' }}

  # The updater feed over both Windows zips, signed with a throwaway key made
  # in the job: sign each zip with the `version:` trusted comment, write
  # latest.json, then run the launcher engine's own feed, signature and
  # zip-swap checks on them (engine/examples/release_feed.rs). A format the
  # launcher would refuse fails here, not at release time.
  release-dry-run-feed:
    name: desktop release build dry run (updater feed)
    needs: [release-dry-run, release-dry-run-arm64]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_WINDOWS_RUNNER == 'hosted') && 'windows-latest' || 'cimmeria-windows' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: launcher-release-desktop-dry-run
          save-if: false
          workspaces: |
            crates/launcher/desktop -> ../../../target/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-launcher-windows-dry-run
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-launcher-windows-arm64-dry-run
          path: artifacts
      # The release's sign and feed steps, over both Windows zips, with a
      # throwaway Minisign key made in the job.
      - name: sign and check the two-zip updater feed with a throwaway key
        run: |
          set -euo pipefail
          VERSION="$(date -u +%Y).$(date -u +%-m).$(( $(date -u +%-d) * 100 + 2 ))"
          tools/launcher-release/build-desktop.sh feed-dry-run "${VERSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-launcher-feed-dry-run
          path: |
            artifacts/*.zip.sig
            artifacts/latest.json
          if-no-files-found: error
          retention-days: 7

  # launcher-release.yml's mac-pieces job: the Play pieces checked against the
  # Windows dry run's digest, the archive and prerequisite workers built, and
  # all five handed to the macOS and Linux dry runs with their list's digest. It also
  # stamps the macOS dry run as a same-day release of this commit.
  release-dry-run-mac-pieces:
    name: desktop release build dry run (Windows pieces for macOS)
    needs: release-dry-run
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_WINDOWS_RUNNER == 'hosted') && 'windows-latest' || 'cimmeria-windows' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    outputs:
      mac_pieces_sha256: ${{ steps.macpieces.outputs.sha256 }}
      dry_run_tag: ${{ steps.drystamp.outputs.tag }}
      dry_run_version: ${{ steps.drystamp.outputs.version }}
      dry_run_epoch: ${{ steps.drystamp.outputs.epoch }}
    env:
      PLAY_SHA256: ${{ needs.release-dry-run.outputs.play_pieces_sha256 }}
    steps:
      - name: stamp the macOS dry run as a same-day release
        id: drystamp
        run: |
          set -euo pipefail
          EPOCH="$(date -u +%s)"
          {
            echo "tag=launcher-$(date -u -d "@${EPOCH}" +%Y%m%d)-${GITHUB_SHA:0:7}"
            echo "version=$(date -u -d "@${EPOCH}" +%Y).$(date -u -d "@${EPOCH}" +%-m).$(( $(date -u -d "@${EPOCH}" +%-d) * 100 + 2 ))"
            echo "epoch=${EPOCH}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: launcher-release-desktop-dry-run
          save-if: false
          workspaces: |
            crates/launcher/desktop -> ../../../target/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-play-pieces-dry-run
          path: play-pieces
      - name: take in the Play pieces, checked against the Windows dry run's digest
        run: tools/launcher-release/build-desktop.sh play-pieces-in play-pieces "${PLAY_SHA256}"
      - name: build the Windows pieces only the macOS app carries
        run: tools/launcher-release/build-desktop.sh mac-helpers
      - name: collect the macOS app's Windows pieces
        id: macpieces
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh mac-pieces
          echo "sha256=$(sha256sum artifacts/mac-pieces/mac-pieces.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-mac-pieces-dry-run
          path: artifacts/mac-pieces/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # launcher-release.yml's desktop-macos job itself (the same reusable
  # workflow), minus publishing: the five pieces checked and staged, the pinned
  # D9VK, the release-profile .app, the ad-hoc signature, every check and the
  # zip. Stamped as a same-day release (a tag and a `YYYY.M.(D*100+2)` version) with
  # the development manifest key, so the tag check and the same-day Info.plist
  # rule run here and not first at a release. No release secret, no upload to
  # a release.
  release-dry-run-macos:
    name: desktop release build dry run (macOS)
    needs: release-dry-run-mac-pieces
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-macos.yml
    with:
      pieces_artifact: desktop-mac-pieces-dry-run
      pieces_sha256: ${{ needs.release-dry-run-mac-pieces.outputs.mac_pieces_sha256 }}
      artifact_name: desktop-launcher-macos-dry-run
      retention_days: 7
      tag: ${{ needs.release-dry-run-mac-pieces.outputs.dry_run_tag }}
      version: ${{ needs.release-dry-run-mac-pieces.outputs.dry_run_version }}
      epoch: ${{ needs.release-dry-run-mac-pieces.outputs.dry_run_epoch }}
      dev_manifest_key: true
      cache_key: launcher-release-desktop-macos-dry-run
      save_cache: ${{ github.ref == 'refs/heads/main' }}

  # launcher-release.yml's desktop-linux job, before release time: the same
  # reusable workflow builds, verifies and packages the AppImage. A fixed
  # dry-run identity is stamped in so verify checks the embedded tag and
  # version; no manifest secret (the development key), nothing published.
  release-dry-run-linux:
    name: desktop release build dry run (Linux)
    needs: release-dry-run-mac-pieces
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-linux.yml
    with:
      artifact_name: desktop-launcher-linux-dry-run
      retention_days: 7
      tag: launcher-19700101-0000000
      version: 1970.1.101
      epoch: '0'
      dev_manifest_key: true
      pieces_artifact: desktop-mac-pieces-dry-run
      pieces_sha256: ${{ needs.release-dry-run-mac-pieces.outputs.mac_pieces_sha256 }}
      cache_key: launcher-release-desktop-linux-dry-run
      save_cache: ${{ github.ref == 'refs/heads/main' }}

  # The same Linux dry run with the release manifest public key compiled in,
  # on a manual dispatch only (never on a PR or a push), so a branch build can
  # verify the live release in a device UAT. The key is public; it is a
  # repository secret only so the release jobs read it from one place. Same
  # dry-run identity, its own artifact name; nothing is published.
  release-dry-run-linux-real-key:
    name: desktop release build dry run (Linux, release manifest key)
    needs: release-dry-run-mac-pieces
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-linux.yml
    with:
      artifact_name: desktop-launcher-linux-real-key-dry-run
      retention_days: 7
      tag: launcher-19700101-0000000
      version: 1970.1.101
      epoch: '0'
      dev_manifest_key: false
      pieces_artifact: desktop-mac-pieces-dry-run
      pieces_sha256: ${{ needs.release-dry-run-mac-pieces.outputs.mac_pieces_sha256 }}
      cache_key: launcher-release-desktop-linux-dry-run
      save_cache: false
    secrets:
      LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}

  # The release's shell scripts, which the jobs above do not all run:
  # shellcheck on every one, then stamp.sh and publish.sh against a stub `gh`
  # (tools/launcher-release/test-release-scripts.sh): the day's version rules,
  # the digest checks, release notes that converge in any re-run order, and
  # launcher-current notes that link the macOS zip and the Linux AppImage only
# while they are there.
  release-scripts:
    name: release scripts (shellcheck and stubbed tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck tools/launcher-release/*.sh
      - name: stamp.sh and publish.sh against a stub gh
        run: bash tools/launcher-release/test-release-scripts.sh
      - name: Workflow performance and signing-boundary guards
        run: |
          python3 -m venv .workflow-tests
          .workflow-tests/bin/python -m pip install --disable-pip-version-check PyYAML==6.0.3
          .workflow-tests/bin/python -m unittest discover -s tools/launcher-release -p 'test_*.py'
