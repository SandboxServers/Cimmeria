name: launcher-release

# Builds and publishes the desktop launcher (crates/launcher/desktop, the Tauri
# one) as a GitHub Release. Triggered either manually via the Actions UI
# (`workflow_dispatch`) or via the `/release-launcher` ChatOps command on a
# merged PR, which dispatches this workflow through
# `launcher-release-on-comment.yml`.
#
# Releases are built from `main` only. `workflow_dispatch` accepts any branch,
# so the build job fails at its first step on any other ref, and the signing
# and publishing jobs do not run; the signing job's environment,
# `launcher-release`, is also restricted to `main` in the repository settings.
# The commit built is the one dispatched (`github.sha`), main's HEAD at that
# moment; the triggering PR is just the cut-point marker, mirroring the policy
# of `release-container.yml`.
#
# Seven jobs (crates/launcher/desktop/docs/release.md, "Jobs"). The updater
# signing key never shares a job with the build's third-party code, and no job
# that runs build code can write to the repository: the only write-token jobs,
# `publish` and `publish-macos`, run tools/launcher-release/publish.sh from a
# checkout of the released commit and nothing else.
#   - `desktop-windows` stamps the tag and version (stamp.sh), builds, checks
#     and zips the launcher, and hands its three Play pieces to the other
#     Windows builds.
#   - `desktop-windows-arm64` builds the Windows on Arm launcher natively on
#     `windows-11-arm` from desktop-windows' Play pieces, through the reusable
#     `launcher-desktop-windows-arm64.yml` the PR dry run also calls.
#   - `sign`, in the `launcher-release` environment (the Minisign key and
#     password), checks both Windows zips against their build jobs' digests,
#     builds the release_feed tool before the key is in any step, signs both
#     zips into one feed, writes latest.json, and checks it as a launcher would.
#   - `publish` creates or updates the dated release `launcher-YYYYMMDD-<sha7>`
#     with both Windows zips, and refreshes the rolling `launcher-current`
#     (D-LX7).
#   - `mac-pieces` builds the two other Windows pieces the macOS app carries,
#     off the Windows release's critical path.
#   - `desktop-macos` (LX-28, D-LX14) builds the arm64 app, signs it ad hoc and
#     zips it, through the reusable `launcher-desktop-macos.yml` the PR dry run
#     also calls.
#   - `publish-macos` attaches the macOS zip. A failed macOS build leaves the
#     Windows release as it is.
#
# Windows executables lack Authenticode signing (D-LX10): the launch worker injects DLLs,
# which Defender and SmartScreen react to. The macOS app is signed ad hoc only;
# a Developer ID signature, notarization and the hardened runtime are out of
# scope by D-LX14, so a player opens it once with Privacy & Security > Open
# Anyway. macOS updates are manual: the feed offers `windows-x86_64` and
# `windows-aarch64` (docs/analysis/launcher-consolidation/worknotes/lx-28-redistribution.md).
#
# Every third-party action is pinned to a full commit SHA, with its version in
# a comment, per GitHub's secure-use guide.

on:
  workflow_dispatch:
    inputs:
      triggering_pr:
        description: 'PR # that triggered this release (informational, optional)'
        required: false

permissions: {}

concurrency:
  group: launcher-release
  cancel-in-progress: false

env:
  ZIP_NAME: StargateWorlds-Launcher-windows-x64.zip
  ARM_ZIP_NAME: StargateWorlds-Launcher-windows-arm64.zip
  MAC_ZIP_NAME: StargateWorlds-Launcher-macos-arm64.zip

jobs:
  # The zip holds one root EXE embedding the 32-bit worker and two game DLLs.
  # They are built, staged, independently pinned and embedded in this one job.
  # Startup verifies/extracts them into the launcher's private versioned cache.
  # Its build runs in stages from tools/launcher-release/build-desktop.sh, the
  # same stages launcher-desktop.yml dry-runs on every desktop-launcher PR.
  desktop-windows:
    name: desktop launcher (Windows) -> zip
    runs-on: windows-latest
    permissions:
      # Reads releases and this run's reserved identity artifact.
      contents: read
      actions: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
      epoch: ${{ steps.stamp.outputs.epoch }}
      version: ${{ steps.stamp.outputs.version }}
      zip_sha256: ${{ steps.digest.outputs.sha256 }}
      has_overlay: ${{ steps.overlay.outputs.has_overlay }}
      # SHA-256 of play-pieces.sha256, which lists the three staged Play
      # pieces.
      play_pieces_sha256: ${{ steps.playpieces.outputs.sha256 }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      # The Minisign public key, base64 of the `.pub` file. A repository
      # variable, not a secret: it is public, and a variable shows in logs
      # and settings, so a mismatch with the private key is easy to see.
      LAUNCHER_UPDATER_PUBKEY: ${{ vars.LAUNCHER_UPDATER_PUBKEY }}
    steps:
      # Before anything is checked out or built: a dispatch from any branch
      # but main would otherwise build that branch, and the signing job would
      # offer it to every player.
      - name: refuse any ref but main
        run: |
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::launcher releases are built from main only; this run was dispatched on ${GITHUB_REF}"
            exit 1
          fi

      # No GITHUB_TOKEN left in the git config for later steps.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # The dispatched commit; every later job builds or tags the same one.
          ref: ${{ github.sha }}
          persist-credentials: false

      # tools/launcher-release/stamp.sh explains the tag, the D-LX15 version
      # and the same-day and re-run rules.
      - name: recover this run's reserved identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="launcher-identity-${GITHUB_RUN_ID}"
          FOUND="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${NAME}\") | .name")"
          if [ -n "$FOUND" ]; then
            gh run download "$GITHUB_RUN_ID" --name "$NAME" --dir stamp-reservation
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "::error::No reserved identity for this rerun; dispatch a new run"
            exit 1
          fi
      - name: stamp tag and version
        id: stamp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: tools/launcher-release/stamp.sh
      - name: reserve identity before building
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-identity-${{ github.run_id }}
          path: stamp-reservation/identity.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true


      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: launcher-release-desktop
          workspaces: |
            . -> target
            crates/launcher/desktop -> ../../../target/desktop

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: build the i686 launch worker and game DLLs
        run: tools/launcher-release/build-desktop.sh helpers

      - name: stage them as the launcher's bundled resources
        run: tools/launcher-release/build-desktop.sh stage

      # The release stamps are on this step only. The test suites use the
      # development manifest key and fail with the production one set.
      - name: build the 64-bit desktop launcher, pinned to them
        env:
          # Ed25519, 64 hex chars (docs/client/launcher-distribution-setup.md).
          LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}
          CIMMERIA_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
          CIMMERIA_LAUNCHER_TAG: ${{ steps.stamp.outputs.tag }}
          CIMMERIA_LAUNCHER_BUILD_EPOCH: ${{ steps.stamp.outputs.epoch }}
          CIMMERIA_BUILD_BRANCH: main
          CIMMERIA_BUILD_GIT_SHA: ${{ github.sha }}
          # LAUNCHER_UPDATER_PUBKEY comes from the job env. Unset, the build's
          # updater is Disabled.
        run: tools/launcher-release/build-desktop.sh launcher

      - name: verify the artifacts
        env:
          CIMMERIA_LAUNCHER_TAG: ${{ steps.stamp.outputs.tag }}
          CIMMERIA_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
        run: tools/launcher-release/build-desktop.sh verify

      # The zip and its .sha256 (`<hex>  <file name>`).
      - name: package
        run: tools/launcher-release/build-desktop.sh package

      # The digest travels to the signing and publishing jobs as a job output,
      # a channel separate from the artifact store: each checks the zip it
      # downloads against it.
      - name: record the zip digest
        id: digest
        run: |
          set -euo pipefail
          SHA="$(sha256sum "${ZIP}" | cut -d' ' -f1)"
          [ "${SHA}" = "$(cut -d' ' -f1 "${ZIP}.sha256")" ] || { echo "::error::${ZIP}.sha256 does not match the zip"; exit 1; }
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      # The overlay zip is served from this release's own immutable tag, so
      # the entry's blob URL points here. With no overlay committed the tool
      # prints "nothing to pack" and the release carries the launcher alone.
      - name: pack client-patches overlay
        id: overlay
        env:
          TAG: ${{ steps.stamp.outputs.tag }}
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh overlay "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          shopt -s nullglob
          packed=(overlay-out/*.zip overlay-out/*.entry.json)
          if [ ${#packed[@]} -gt 0 ]; then HAS=true; else HAS=false; fi
          echo "has_overlay=${HAS}" >> "$GITHUB_OUTPUT"

      # The signing job downloads this artifact and nothing else.
      - name: upload the zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-zip-${{ steps.stamp.outputs.tag }}
          path: |
            artifacts/StargateWorlds-Launcher-windows-x64.zip
            artifacts/StargateWorlds-Launcher-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: upload the overlay patch
        if: steps.overlay.outputs.has_overlay == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-overlay-${{ steps.stamp.outputs.tag }}
          path: overlay-out/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: job summary
        if: always()
        env:
          TAG: ${{ steps.stamp.outputs.tag }}
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          {
            echo "## Launcher ${TAG}"
            echo
            echo "Compiled version: \`${VERSION}\`"
            if [ -z "${LAUNCHER_UPDATER_PUBKEY}" ]; then
              echo
              echo "The build's updater is Disabled (no \`LAUNCHER_UPDATER_PUBKEY\` variable)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, and quick: the three staged Play pieces, for the arm64 and
      # mac-pieces jobs, which both take them up. Both jobs need these pieces,
      # so a failure here fails the release; "Re-run failed jobs" recovers it
      # (D-WA5). play-pieces.sha256's own digest travels as a job output,
      # separate from the artifact store.
      - name: collect the staged Play pieces for the macOS build
        id: playpieces
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh play-pieces
          echo "sha256=$(sha256sum artifacts/play-pieces/play-pieces.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: upload them
        if: steps.playpieces.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-play-pieces-${{ steps.stamp.outputs.tag }}
          path: artifacts/play-pieces/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The Windows on Arm launcher, built natively on windows-11-arm from the Play
  # pieces above, through the reusable workflow the PR dry run also calls.
  # Read-only: sign and publish take its zip from the artifact store.
  desktop-windows-arm64:
    name: desktop launcher (Windows arm64)
    needs: desktop-windows
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-windows-arm64.yml
    with:
      pieces_artifact: launcher-play-pieces-${{ needs.desktop-windows.outputs.tag }}
      pieces_sha256: ${{ needs.desktop-windows.outputs.play_pieces_sha256 }}
      artifact_name: launcher-zip-arm64-${{ needs.desktop-windows.outputs.tag }}
      tag: ${{ needs.desktop-windows.outputs.tag }}
      version: ${{ needs.desktop-windows.outputs.version }}
      epoch: ${{ needs.desktop-windows.outputs.epoch }}
      build_branch: main
      updater_pubkey: ${{ vars.LAUNCHER_UPDATER_PUBKEY }}
      cache_key: launcher-release-desktop-arm64
    secrets:
      LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}

  # The only job that sees LAUNCHER_UPDATER_MINISIGN_KEY and _PASSWORD: they are
  # secrets of the `launcher-release` environment, which only main may use.
  # It runs no third-party action and no node: the checkout and artifact
  # actions are GitHub's own, the toolchain action is this repository's
  # (dtolnay/rust-toolchain by SHA inside), and there is no cache to restore
  # from. The release_feed tool is compiled in a step with no secret, so the
  # build scripts and proc macros of its dependencies never see the key; the
  # sign step runs the built executable directly.
  sign:
    name: sign the zip and write the updater feed
    needs: [desktop-windows, desktop-windows-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: launcher-release
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      signed: ${{ steps.keys.outputs.sign }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      ARM_ZIP: artifacts/StargateWorlds-Launcher-windows-arm64.zip
      TAG: ${{ needs.desktop-windows.outputs.tag }}
      VERSION: ${{ needs.desktop-windows.outputs.version }}
      ZIP_SHA256: ${{ needs.desktop-windows.outputs.zip_sha256 }}
      ARM_ZIP_SHA256: ${{ needs.desktop-windows-arm64.outputs.zip_sha256 }}
      LAUNCHER_UPDATER_PUBKEY: ${{ vars.LAUNCHER_UPDATER_PUBKEY }}
    steps:
      # Required signing: the key itself reaches the sign step alone.
      # The key and the public-key variable go together (D-LX9); the key
      # without the variable is a misconfiguration, since the build could not
      # verify what it is offered.
      - name: require the signing configuration
        id: keys
        env:
          HAS_UPDATER_KEY: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_UPDATER_KEY}" != true ] || [ -z "${LAUNCHER_UPDATER_PUBKEY}" ]; then
            echo "::error::Every launcher release requires the updater key and public-key variable (D-LX15)"
            exit 1
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        if: steps.keys.outputs.sign == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        if: steps.keys.outputs.sign == 'true'

      - name: build the release_feed tool (no secrets in this step)
        if: steps.keys.outputs.sign == 'true'
        run: tools/launcher-release/build-desktop.sh feed-tool

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: steps.keys.outputs.sign == 'true'
        with:
          name: launcher-zip-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: steps.keys.outputs.sign == 'true'
        with:
          name: launcher-zip-arm64-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts

      - name: check the zips are the ones the build jobs made
        if: steps.keys.outputs.sign == 'true'
        run: |
          set -euo pipefail
          GOT="$(sha256sum "${ZIP}" | cut -d' ' -f1)"
          [ -n "${ZIP_SHA256}" ] && [ "${GOT}" = "${ZIP_SHA256}" ] \
            || { echo "::error::the downloaded zip is ${GOT}, the build job made ${ZIP_SHA256}"; exit 1; }
          [ "$(cut -d' ' -f1 "${ZIP}.sha256")" = "${ZIP_SHA256}" ] \
            || { echo "::error::${ZIP}.sha256 does not name the build job's digest"; exit 1; }
          GOT="$(sha256sum "${ARM_ZIP}" | cut -d' ' -f1)"
          [ -n "${ARM_ZIP_SHA256}" ] && [ "${GOT}" = "${ARM_ZIP_SHA256}" ] \
            || { echo "::error::the downloaded arm64 zip is ${GOT}, the arm64 build job made ${ARM_ZIP_SHA256}"; exit 1; }
          [ "$(cut -d' ' -f1 "${ARM_ZIP}.sha256")" = "${ARM_ZIP_SHA256}" ] \
            || { echo "::error::${ARM_ZIP}.sha256 does not name the arm64 build job's digest"; exit 1; }

      # The feed offers each zip from this release's own immutable tag, not
      # from launcher-current: the signatures pin those exact bytes, so a feed
      # read while launcher-current's assets are being replaced still names
      # zips that match it.
      - name: sign the zip and write the updater feed
        if: steps.keys.outputs.sign == 'true'
        env:
          LAUNCHER_UPDATER_MINISIGN_KEY: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_KEY }}
          LAUNCHER_UPDATER_MINISIGN_PASSWORD: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh sign "${VERSION}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            "Stargate Worlds launcher ${VERSION} (${TAG})."

      # The launcher engine's own feed, signature and zip checks against the
      # public key the build compiled in: a pair that does not match, or a
      # feed the launcher would refuse, stops the release here.
      - name: check the feed as a launcher would
        if: steps.keys.outputs.sign == 'true'
        run: tools/launcher-release/build-desktop.sh verify-feed "${VERSION}"

      - name: upload the signature and feed
        if: steps.keys.outputs.sign == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-feed-${{ needs.desktop-windows.outputs.tag }}
          path: |
            artifacts/StargateWorlds-Launcher-windows-x64.zip.sig
            artifacts/StargateWorlds-Launcher-windows-arm64.zip.sig
            artifacts/latest.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Creates or updates the dated release, then refreshes launcher-current when
  # the zip was signed. Every step is safe to re-run: a re-run replaces this
  # run's own assets rather than failing on an existing tag. It runs when the
  # signing job succeeded; missing or skipped signing refuses publication.
  publish:
    name: dated release + launcher-current
    needs: [desktop-windows, desktop-windows-arm64, sign]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.desktop-windows.result == 'success'
      && needs.desktop-windows-arm64.result == 'success'
      && needs.sign.result == 'success' && needs.sign.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      ARM_ZIP: artifacts/StargateWorlds-Launcher-windows-arm64.zip
      TAG: ${{ needs.desktop-windows.outputs.tag }}
      VERSION: ${{ needs.desktop-windows.outputs.version }}
      ZIP_SHA256: ${{ needs.desktop-windows.outputs.zip_sha256 }}
      ARM_ZIP_SHA256: ${{ needs.desktop-windows-arm64.outputs.zip_sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The released commit, for tools/launcher-release/publish.sh. First:
      # checkout cleans the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: launcher-zip-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: launcher-zip-arm64-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: launcher-feed-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: needs.desktop-windows.outputs.has_overlay == 'true'
        with:
          name: launcher-overlay-${{ needs.desktop-windows.outputs.tag }}
          path: overlay-out

      - name: check the zips are the ones the build jobs made
        run: |
          tools/launcher-release/publish.sh check "${ZIP}" "${ZIP_SHA256}"
          tools/launcher-release/publish.sh check "${ARM_ZIP}" "${ARM_ZIP_SHA256}"

      - name: create or update the dated release
        env:
          TRIGGERING_PR: ${{ github.event.inputs.triggering_pr }}
        run: tools/launcher-release/publish.sh dated

      # D-LX7: the stable download link; latest.json goes last. A re-run
      # repairs a refresh that failed part-way.
      - name: refresh launcher-current
        run: tools/launcher-release/publish.sh current

      - name: job summary
        if: always()
        run: |
          {
            echo "## Published ${TAG}"
            echo
            echo "Signed release \`${VERSION}\` published; launcher-current feed refreshed after verification."
          } >> "$GITHUB_STEP_SUMMARY"

  # The five Windows pieces the macOS app carries, in their own job so they
  # never hold up sign and publish: the three Play pieces desktop-windows
  # staged, checked against its digest output before use, and the archive and
  # prerequisite workers for Install under Wine, built here. Read-only.
  mac-pieces:
    name: Windows pieces for the macOS app
    needs: desktop-windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    outputs:
      sha256: ${{ steps.pieces.outputs.sha256 }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PLAY_SHA256: ${{ needs.desktop-windows.outputs.play_pieces_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: launcher-release-desktop
          workspaces: |
            crates/launcher/desktop -> ../../../target/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: launcher-play-pieces-${{ needs.desktop-windows.outputs.tag }}
          path: play-pieces
      - name: take in the Play pieces, checked against desktop-windows' digest
        run: tools/launcher-release/build-desktop.sh play-pieces-in play-pieces "${PLAY_SHA256}"
      - name: build the Windows pieces only the macOS app carries
        run: tools/launcher-release/build-desktop.sh mac-helpers
      # mac-pieces.sha256's own digest travels as a job output, separate from
      # the artifact store.
      - name: collect the macOS app's Windows pieces
        id: pieces
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh mac-pieces
          echo "sha256=$(sha256sum artifacts/mac-pieces/mac-pieces.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-mac-pieces-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts/mac-pieces/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # LX-28 (D-LX14): the macOS app, built by the reusable workflow the PR dry
  # run also calls. Read-only; publish-macos attaches the zip.
  desktop-macos:
    name: desktop launcher (macOS)
    needs: [desktop-windows, mac-pieces]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-macos.yml
    with:
      pieces_artifact: launcher-mac-pieces-${{ needs.desktop-windows.outputs.tag }}
      pieces_sha256: ${{ needs.mac-pieces.outputs.sha256 }}
      artifact_name: launcher-macos-zip-${{ needs.desktop-windows.outputs.tag }}
      tag: ${{ needs.desktop-windows.outputs.tag }}
      version: ${{ needs.desktop-windows.outputs.version }}
      epoch: ${{ needs.desktop-windows.outputs.epoch }}
      build_branch: main
      cache_key: launcher-release-desktop-macos
    secrets:
      LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}

  # Attaches the macOS zip after publish made the dated release, and replaces
  # the one on launcher-current after a successful signed publication. It runs whenever publish succeeded and fails
  # when the macOS build did not, so "Re-run failed jobs" reruns it with the
  # failed build. No build and no third-party action: publish.sh from the
  # released commit's checkout.
  publish-macos:
    name: macOS zip -> same release + launcher-current
    needs: [desktop-windows, sign, publish, desktop-macos]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      MAC_ZIP: artifacts/StargateWorlds-Launcher-macos-arm64.zip
      TAG: ${{ needs.desktop-windows.outputs.tag }}
      MAC_OK: ${{ needs.desktop-macos.result == 'success' }}
      VERSION: ${{ needs.desktop-windows.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: env.MAC_OK == 'true'
        with:
          name: launcher-macos-zip-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - name: attach the macOS zip to the dated release
        if: env.MAC_OK == 'true'
        env:
          MAC_ZIP_SHA256: ${{ needs.desktop-macos.outputs.zip_sha256 }}
        run: |
          tools/launcher-release/publish.sh check "${MAC_ZIP}" "${MAC_ZIP_SHA256}"
          tools/launcher-release/publish.sh macos
      - name: refresh the macOS zip on launcher-current
        id: rolling-macos
        if: env.MAC_OK == 'true'
        run: tools/launcher-release/publish.sh macos-current
      - name: summary, and fail when the macOS build failed
        if: always()
        env:
          ROLLING_STATUS: ${{ steps.rolling-macos.outputs.status }}
        run: |
          {
            echo "## macOS assets for ${TAG}"
            if [ "${MAC_OK}" != true ]; then
              echo "- The macOS build failed: \`${MAC_ZIP_NAME}\` is not on this release, and \`launcher-current\` keeps the macOS zip it had. \"Re-run failed jobs\" (crates/launcher/desktop/docs/release.md)."
            elif [ "${ROLLING_STATUS}" = skipped_older ]; then
              echo "- The dated macOS assets were repaired; a newer release is current, so its macOS assets and notes were kept."
            elif [ "${ROLLING_STATUS}" = refreshed ]; then
              echo "- \`${MAC_ZIP_NAME}\` is on the dated release and on \`launcher-current\`; not in \`latest.json\` (macOS updates are manual)."
            else
              echo "- macOS publication did not finish; check the failed publishing step before retrying."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${MAC_OK}" = true ]
