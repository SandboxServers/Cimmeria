name: launcher-release

# Builds and publishes the desktop launcher (crates/launcher/desktop, the Tauri
# one) as a GitHub Release. Triggered either manually via the Actions UI
# (`workflow_dispatch`) or via the `/release-launcher` ChatOps command on a
# merged PR, which dispatches this workflow through
# `launcher-release-on-comment.yml`.
#
# Releases are built from `main` only. `workflow_dispatch` accepts any branch,
# so the build job fails at its first step on any other ref, and the signing
# and publishing jobs do not run; the signing job's environment,
# `launcher-release`, is also restricted to `main` in the repository settings.
# The commit built is the one dispatched (`github.sha`), main's HEAD at that
# moment; the triggering PR is just the cut-point marker, mirroring the policy
# of `release-container.yml`.
#
# Six jobs, so the updater signing key never shares a job with the build's
# third-party code, and no job that runs that code can write to the repository
# (crates/launcher/desktop/docs/release.md, "Jobs"):
#   - `desktop-windows` stamps the tag and version, builds, checks and zips the
#     launcher. It also builds the five Windows pieces the macOS app carries.
#     It never sees the Minisign secrets.
#   - `sign` runs in the `launcher-release` environment, whose secrets are the
#     Minisign key and password. It downloads only the zip, checks its digest
#     against the build job's output, builds the release_feed tool with cargo
#     alone (no node, no cache action) before the key is in any step, signs,
#     writes latest.json and checks it as a launcher would.
#   - `publish` creates or updates the dated release `launcher-YYYYMMDD-<sha7>`
#     and, when signed, refreshes the rolling `launcher-current` (D-LX7):
#     the zip, `.sha256`, `.zip.sig`, then `latest.json` last.
#   - `desktop-macos` (LX-28, D-LX14) builds the macOS app on an arm64 runner
#     from those pieces, signs it ad hoc and zips it as
#     `StargateWorlds-Launcher-macos-arm64.zip`, through the reusable
#     `launcher-desktop-macos.yml` the PR dry run also calls. Read-only.
#   - `egui-macos-wine` builds the original egui launcher as
#     `sgw-launcher-macos-wine-<tag>.exe` for Mac players who still run it
#     under Wine, until LX-18 retires it. Read-only. It is no longer published
#     as `sgw-launcher-<tag>.exe`, the exact name the egui launcher updates
#     itself from, so Windows players of the egui launcher stop being offered
#     updates and move to the zip (D-LX2).
#   - `publish-macos` attaches both macOS assets to the dated release, and the
#     macOS zip to `launcher-current` when `publish` refreshed it. A failed
#     macOS build leaves the Windows release as it is.
# The two jobs with a write token, `publish` and `publish-macos`, run no build
# and no third-party action: tools/launcher-release/publish.sh from a checkout
# of the released commit.
#
# Releases ship unsigned on Windows: code signing is deferred by the owner
# (D-LX10). The launch worker injects DLLs into the game, which is what
# Defender and SmartScreen react to. The macOS app is signed ad hoc only.
# Out of scope by D-LX14: a Developer ID signature, notarization and the
# hardened runtime. A player opens the app once with System Settings > Privacy
# & Security > Open Anyway. macOS updates are manual: the updater feed offers
# `windows-x86_64` only, and the shell keeps the updater Disabled on macOS
# (docs/analysis/launcher-consolidation/worknotes/lx-28-redistribution.md,
# "Self-update on macOS").
#
# Every third-party action is pinned to a full commit SHA, with its version in
# a comment, per GitHub's secure-use guide.

on:
  workflow_dispatch:
    inputs:
      triggering_pr:
        description: 'PR # that triggered this release (informational, optional)'
        required: false

permissions: {}

concurrency:
  group: launcher-release
  cancel-in-progress: false

env:
  ZIP_NAME: StargateWorlds-Launcher-windows-x64.zip
  MAC_ZIP_NAME: StargateWorlds-Launcher-macos-arm64.zip

jobs:
  # The zip holds cimmeria-launcher-desktop.exe at its root with a windows/
  # directory beside it (the 32-bit launch worker and the two game DLLs) and
  # graphics/. The launcher refuses any of those three whose SHA-256 is not the
  # one compiled into it, so they are built, staged and pinned in this one job.
  # Its build runs in stages from tools/launcher-release/build-desktop.sh, the
  # same stages launcher-desktop.yml dry-runs on every desktop-launcher PR.
  desktop-windows:
    name: desktop launcher (Windows) -> zip
    runs-on: windows-latest
    permissions:
      # Reads the release list for the version; publishing is a later job.
      contents: read
    # 60 for the Windows release plus the macOS pieces' 35 of step timeouts.
    timeout-minutes: 95
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
      epoch: ${{ steps.stamp.outputs.epoch }}
      version: ${{ steps.stamp.outputs.version }}
      same_day: ${{ steps.stamp.outputs.same_day }}
      zip_sha256: ${{ steps.digest.outputs.sha256 }}
      has_overlay: ${{ steps.overlay.outputs.has_overlay }}
      # SHA-256 of mac-pieces.sha256, which lists the five Windows pieces the
      # macOS app carries. Empty when they failed to build.
      mac_pieces_sha256: ${{ steps.macpieces.outputs.sha256 }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      # The Minisign public key, base64 of the `.pub` file. A repository
      # variable, not a secret: it is public, and a variable shows in logs
      # and settings, so a mismatch with the private key is easy to see.
      LAUNCHER_UPDATER_PUBKEY: ${{ vars.LAUNCHER_UPDATER_PUBKEY }}
    steps:
      # Before anything is checked out or built: a dispatch from any branch
      # but main would otherwise build that branch, and the signing job would
      # offer it to every player.
      - name: refuse any ref but main
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::launcher releases are built from main only; this run was dispatched on ${GITHUB_REF}"
            exit 1
          fi

      # `persist-credentials: false` so the GITHUB_TOKEN isn't left in the
      # local git config for later steps.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # The dispatched commit; every later job builds or tags the same one.
          ref: ${{ github.sha }}
          persist-credentials: false

      # tools/launcher-release/stamp.sh explains the tag, the D-LX8 version
      # and the same-day and re-run rules.
      - name: stamp tag and version
        id: stamp
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: tools/launcher-release/stamp.sh

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: launcher-release-desktop
          workspaces: |
            . -> target
            crates/launcher/desktop -> ../../../target/desktop

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'

      - name: build the i686 launch worker and game DLLs
        shell: bash
        run: tools/launcher-release/build-desktop.sh helpers

      - name: stage them as the launcher's bundled resources
        shell: bash
        run: tools/launcher-release/build-desktop.sh stage

      # The release stamps are on this step only. The test suites use the
      # development manifest key and fail with the production one set, and the
      # SAS is compiled in with `option_env!`, so no other step has them.
      - name: build the 64-bit desktop launcher, pinned to them
        shell: bash
        env:
          # 64 hex chars = 32 raw bytes. Ed25519 public key whose private
          # counterpart signs every manifest the launcher will accept
          # (docs/client/launcher-distribution-setup.md).
          LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}
          # Where Settings' "Upload debug logs" PUTs the zip (D-LX11). Unset,
          # the button is hidden.
          LAUNCHER_LOG_SAS_URL: ${{ secrets.LAUNCHER_LOG_SAS_URL }}
          CIMMERIA_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
          CIMMERIA_LAUNCHER_TAG: ${{ steps.stamp.outputs.tag }}
          CIMMERIA_LAUNCHER_BUILD_EPOCH: ${{ steps.stamp.outputs.epoch }}
          CIMMERIA_BUILD_BRANCH: main
          CIMMERIA_BUILD_GIT_SHA: ${{ github.sha }}
          # LAUNCHER_UPDATER_PUBKEY comes from the job env. Unset, the build's
          # updater is Disabled.
        run: tools/launcher-release/build-desktop.sh launcher

      - name: verify the artifacts
        shell: bash
        env:
          CIMMERIA_LAUNCHER_TAG: ${{ steps.stamp.outputs.tag }}
          CIMMERIA_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
        run: tools/launcher-release/build-desktop.sh verify

      # StargateWorlds-Launcher-windows-x64.zip and its .sha256 (sha256sum
      # format, `<hex>  <file name>`).
      - name: package
        shell: bash
        run: tools/launcher-release/build-desktop.sh package

      # The digest travels to the signing and publishing jobs as a job output,
      # a channel separate from the artifact store: each checks the zip it
      # downloads against it.
      - name: record the zip digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "${ZIP}" | cut -d' ' -f1)"
          [ "${SHA}" = "$(cut -d' ' -f1 "${ZIP}.sha256")" ] || { echo "::error::${ZIP}.sha256 does not match the zip"; exit 1; }
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      # The overlay zip is served from this release's own immutable tag, so
      # the entry's blob URL points here. With no overlay committed the tool
      # prints "nothing to pack" and the release carries the launcher alone.
      - name: pack client-patches overlay
        id: overlay
        shell: bash
        env:
          TAG: ${{ steps.stamp.outputs.tag }}
        run: |
          set -euo pipefail
          cargo build --locked -p cimmeria-launcher-core --bin pack-client-overlay --release
          tools/launcher-release/build.sh overlay "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          shopt -s nullglob
          packed=(overlay-out/*.zip overlay-out/*.entry.json)
          if [ ${#packed[@]} -gt 0 ]; then HAS=true; else HAS=false; fi
          echo "has_overlay=${HAS}" >> "$GITHUB_OUTPUT"

      # The signing job downloads this artifact and nothing else.
      - name: upload the zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-zip-${{ steps.stamp.outputs.tag }}
          path: |
            artifacts/StargateWorlds-Launcher-windows-x64.zip
            artifacts/StargateWorlds-Launcher-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: upload the overlay patch
        if: steps.overlay.outputs.has_overlay == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-overlay-${{ steps.stamp.outputs.tag }}
          path: overlay-out/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: job summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.stamp.outputs.tag }}
          VERSION: ${{ steps.stamp.outputs.version }}
          SAME_DAY: ${{ steps.stamp.outputs.same_day }}
        run: |
          {
            echo "## Launcher ${TAG}"
            echo
            echo "Compiled version: \`${VERSION}\`"
            if [ "${SAME_DAY}" = true ]; then
              echo
              echo "**Same-day build.** \`${VERSION}\` is a prerelease, which the launcher's stable channel refuses, so this build is not signed or offered to players as an update. It is published as its dated release only; \`launcher-current\` still holds the day's first release."
            fi
            if [ -z "${LAUNCHER_UPDATER_PUBKEY}" ]; then
              echo
              echo "The build's updater is Disabled (no \`LAUNCHER_UPDATER_PUBKEY\` variable)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, after everything the Windows release needs is uploaded: the five
      # Windows pieces the macOS app carries (the three above plus, for Install
      # under Wine, the archive and prerequisite workers), handed to
      # desktop-macos. continue-on-error and a step timeout, so a failure or a
      # hang here fails only the macOS build; the job's timeout leaves room for
      # it. mac-pieces.sha256's own digest travels as a job output, separate
      # from the artifact store.
      - name: build the Windows pieces only the macOS app carries
        id: machelpers
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: tools/launcher-release/build-desktop.sh mac-helpers
      - name: collect the macOS app's Windows pieces
        id: macpieces
        if: steps.machelpers.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh mac-pieces
          echo "sha256=$(sha256sum artifacts/mac-pieces/mac-pieces.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: upload the macOS app's Windows pieces
        if: steps.macpieces.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-mac-pieces-${{ steps.stamp.outputs.tag }}
          path: artifacts/mac-pieces/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The only job that sees LAUNCHER_UPDATER_MINISIGN_KEY and _PASSWORD: they are
  # secrets of the `launcher-release` environment, which only main may use.
  # It runs no third-party action and no node: the checkout and artifact
  # actions are GitHub's own, the toolchain action is this repository's
  # (dtolnay/rust-toolchain by SHA inside), and there is no cache to restore
  # from. The release_feed tool is compiled in a step with no secret, so the
  # build scripts and proc macros of its dependencies never see the key; the
  # sign step runs the built executable directly.
  sign:
    name: sign the zip and write the updater feed
    needs: desktop-windows
    if: github.ref == 'refs/heads/main' && needs.desktop-windows.outputs.same_day == 'false'
    runs-on: windows-latest
    environment: launcher-release
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.keys.outputs.sign }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      TAG: ${{ needs.desktop-windows.outputs.tag }}
      VERSION: ${{ needs.desktop-windows.outputs.version }}
      ZIP_SHA256: ${{ needs.desktop-windows.outputs.zip_sha256 }}
      LAUNCHER_UPDATER_PUBKEY: ${{ vars.LAUNCHER_UPDATER_PUBKEY }}
    steps:
      # 'true' or 'false' only: the key itself reaches the sign step alone.
      # The key and the public-key variable go together (D-LX9); the key
      # without the variable is a misconfiguration, since the build could not
      # verify what it is offered.
      - name: decide whether to sign
        id: keys
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_UPDATER_KEY}" = true ] && [ -z "${LAUNCHER_UPDATER_PUBKEY}" ]; then
            echo "::error::LAUNCHER_UPDATER_MINISIGN_KEY is set but the LAUNCHER_UPDATER_PUBKEY variable is not; the launcher was built unable to verify what it is offered"
            exit 1
          fi
          echo "sign=${HAS_UPDATER_KEY}" >> "$GITHUB_OUTPUT"
          {
            echo "## Signing ${TAG}"
            echo
            if [ "${HAS_UPDATER_KEY}" = true ]; then
              echo "Signed with the updater key; \`latest.json\` offers \`${VERSION}\` to every older launcher."
            else
              echo "**No updater key.** \`LAUNCHER_UPDATER_MINISIGN_KEY\` is not set in the \`launcher-release\` environment, so the zip is unsigned, no \`latest.json\` was written and \`launcher-current\` is skipped. This is expected until the key holder does D-LX9 (crates/launcher/desktop/docs/release.md, \"Key holder steps\")."
              if [ -n "${LAUNCHER_UPDATER_PUBKEY}" ]; then
                echo
                echo "Warning: \`LAUNCHER_UPDATER_PUBKEY\` is set without the private key, so this build's updater is enabled but nothing publishes a feed for it."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        if: steps.keys.outputs.sign == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        if: steps.keys.outputs.sign == 'true'

      - name: build the release_feed tool (no secrets in this step)
        if: steps.keys.outputs.sign == 'true'
        shell: bash
        run: tools/launcher-release/build-desktop.sh feed-tool

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: steps.keys.outputs.sign == 'true'
        with:
          name: launcher-zip-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts

      - name: check the zip is the one the build job made
        if: steps.keys.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GOT="$(sha256sum "${ZIP}" | cut -d' ' -f1)"
          [ -n "${ZIP_SHA256}" ] && [ "${GOT}" = "${ZIP_SHA256}" ] \
            || { echo "::error::the downloaded zip is ${GOT}, the build job made ${ZIP_SHA256}"; exit 1; }
          [ "$(cut -d' ' -f1 "${ZIP}.sha256")" = "${ZIP_SHA256}" ] \
            || { echo "::error::${ZIP}.sha256 does not name the build job's digest"; exit 1; }

      # The feed offers the zip from this release's own immutable tag, not
      # from launcher-current: the signature pins those exact bytes, so a feed
      # read while launcher-current's assets are being replaced still names a
      # zip that matches it.
      - name: sign the zip and write the updater feed
        if: steps.keys.outputs.sign == 'true'
        shell: bash
        env:
          LAUNCHER_UPDATER_MINISIGN_KEY: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_KEY }}
          LAUNCHER_UPDATER_MINISIGN_PASSWORD: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh sign "${VERSION}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}" \
            "Stargate Worlds launcher ${VERSION} (${TAG})."

      # The launcher engine's own feed, signature and zip checks against the
      # public key the build compiled in: a pair that does not match, or a
      # feed the launcher would refuse, stops the release here.
      - name: check the feed as a launcher would
        if: steps.keys.outputs.sign == 'true'
        shell: bash
        run: tools/launcher-release/build-desktop.sh verify-feed "${VERSION}"

      - name: upload the signature and feed
        if: steps.keys.outputs.sign == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-feed-${{ needs.desktop-windows.outputs.tag }}
          path: |
            artifacts/StargateWorlds-Launcher-windows-x64.zip.sig
            artifacts/latest.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Creates or updates the dated release, then refreshes launcher-current when
  # the zip was signed. Every step is safe to re-run: a re-run replaces this
  # run's own assets rather than failing on an existing tag. It runs when the
  # signing job succeeded or was skipped (a same-day build), never when it
  # failed.
  publish:
    name: dated release + launcher-current
    needs: [desktop-windows, sign]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.desktop-windows.result == 'success'
      && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      TAG: ${{ needs.desktop-windows.outputs.tag }}
      VERSION: ${{ needs.desktop-windows.outputs.version }}
      ZIP_SHA256: ${{ needs.desktop-windows.outputs.zip_sha256 }}
      SIGNED: ${{ needs.sign.outputs.signed == 'true' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The released commit, for tools/launcher-release/publish.sh. First:
      # checkout cleans the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: launcher-zip-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: env.SIGNED == 'true'
        with:
          name: launcher-feed-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: needs.desktop-windows.outputs.has_overlay == 'true'
        with:
          name: launcher-overlay-${{ needs.desktop-windows.outputs.tag }}
          path: overlay-out

      - name: check the zip is the one the build job made
        run: tools/launcher-release/publish.sh check "${ZIP}" "${ZIP_SHA256}"

      - name: create or update the dated release
        env:
          TRIGGERING_PR: ${{ github.event.inputs.triggering_pr }}
        run: tools/launcher-release/publish.sh dated

      # D-LX7: the stable download link; latest.json goes last. A re-run
      # repairs a refresh that failed part-way.
      - name: refresh launcher-current
        if: env.SIGNED == 'true'
        run: tools/launcher-release/publish.sh current

      - name: job summary
        if: always()
        run: |
          {
            echo "## Published ${TAG}"
            echo
            if [ "${SIGNED}" = true ]; then
              echo "\`launcher-current\` now holds this release's zip, \`.sha256\`, \`.zip.sig\` and \`latest.json\`, which offers \`${VERSION}\` to every older launcher."
            else
              echo "Published as its dated release only; \`launcher-current\` was not changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # LX-28 (D-LX14): the macOS app, built by the reusable workflow the PR dry
  # run also calls. Read-only; publish-macos attaches the zip.
  desktop-macos:
    name: desktop launcher (macOS)
    needs: desktop-windows
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-desktop-macos.yml
    with:
      pieces_artifact: launcher-mac-pieces-${{ needs.desktop-windows.outputs.tag }}
      pieces_sha256: ${{ needs.desktop-windows.outputs.mac_pieces_sha256 }}
      artifact_name: launcher-macos-zip-${{ needs.desktop-windows.outputs.tag }}
      tag: ${{ needs.desktop-windows.outputs.tag }}
      version: ${{ needs.desktop-windows.outputs.version }}
      epoch: ${{ needs.desktop-windows.outputs.epoch }}
      build_branch: main
      cache_key: launcher-release-desktop-macos
    secrets:
      LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}
      LAUNCHER_LOG_SAS_URL: ${{ secrets.LAUNCHER_LOG_SAS_URL }}

  # D-LX14: Mac players who run the original egui launcher under Wine keep
  # getting it until LX-18 retires it, under a name the egui self-update does
  # not look for (D-LX2; see the top of this file). A read-only build: it
  # uploads the exe as an artifact and publish-macos attaches it, so a failure
  # here leaves the release as it is. LX-18 deletes this job with the egui
  # launcher.
  egui-macos-wine:
    name: original launcher for macOS under Wine
    needs: desktop-windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      exe_sha256: ${{ steps.exe.outputs.sha256 }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TAG: ${{ needs.desktop-windows.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # The commit the first job stamped into the tag, not whatever main
          # has become since.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: launcher-release
      - name: build the i686 client-patches and client-telemetry DLLs and sgw-start32 helper
        shell: bash
        run: tools/launcher-release/build.sh i686
      # Both secrets are baked in at compile time via `option_env!` in
      # src/config.rs and src/manifest.rs. The tag and epoch are the release's,
      # read by src/self_update/build_info.rs.
      - name: build the 64-bit launcher, embedding them
        shell: bash
        env:
          LAUNCHER_LOG_SAS_URL: ${{ secrets.LAUNCHER_LOG_SAS_URL }}
          LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}
          CIMMERIA_LAUNCHER_TAG: ${{ needs.desktop-windows.outputs.tag }}
          CIMMERIA_LAUNCHER_BUILD_EPOCH: ${{ needs.desktop-windows.outputs.epoch }}
          CIMMERIA_BUILD_BRANCH: main
          CIMMERIA_BUILD_GIT_SHA: ${{ github.sha }}
        run: tools/launcher-release/build.sh launcher
      - name: verify the artifacts
        shell: bash
        env:
          CIMMERIA_LAUNCHER_TAG: ${{ needs.desktop-windows.outputs.tag }}
        run: tools/launcher-release/build.sh verify
      - name: name the exe for the release
        id: exe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          EXE="sgw-launcher-macos-wine-${TAG}.exe"
          cp target/release/sgw-launcher.exe "artifacts/${EXE}"
          SHA="$(sha256sum "artifacts/${EXE}" | cut -d' ' -f1)"
          printf '%s  %s\n' "${SHA}" "${EXE}" > "artifacts/${EXE}.sha256"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: launcher-egui-${{ needs.desktop-windows.outputs.tag }}
          path: |
            artifacts/sgw-launcher-macos-wine-${{ needs.desktop-windows.outputs.tag }}.exe
            artifacts/sgw-launcher-macos-wine-${{ needs.desktop-windows.outputs.tag }}.exe.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Attaches both macOS assets after publish made the dated release: the egui
  # exe under Wine, then the macOS zip, each when its build succeeded, in one
  # job because both rewrite the dated release's notes. The macOS zip also
  # replaces the one on launcher-current when publish refreshed it (a signed,
  # first-of-the-day release), so both stable links name the same release. No
  # build and no third-party action: tools/launcher-release/publish.sh from
  # the released commit's checkout.
  publish-macos:
    name: macOS assets -> same release + launcher-current
    needs: [desktop-windows, sign, publish, desktop-macos, egui-macos-wine]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.publish.result == 'success'
      && (needs.desktop-macos.result == 'success' || needs.egui-macos-wine.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      MAC_ZIP: artifacts/StargateWorlds-Launcher-macos-arm64.zip
      EGUI_EXE: artifacts/sgw-launcher-macos-wine-${{ needs.desktop-windows.outputs.tag }}.exe
      TAG: ${{ needs.desktop-windows.outputs.tag }}
      MAC_OK: ${{ needs.desktop-macos.result == 'success' }}
      EGUI_OK: ${{ needs.egui-macos-wine.result == 'success' }}
      SIGNED: ${{ needs.sign.outputs.signed == 'true' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: env.EGUI_OK == 'true'
        with:
          name: launcher-egui-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: env.MAC_OK == 'true'
        with:
          name: launcher-macos-zip-${{ needs.desktop-windows.outputs.tag }}
          path: artifacts

      - name: attach the egui exe to the dated release
        if: env.EGUI_OK == 'true'
        env:
          EGUI_SHA256: ${{ needs.egui-macos-wine.outputs.exe_sha256 }}
        run: |
          set -euo pipefail
          tools/launcher-release/publish.sh check "${EGUI_EXE}" "${EGUI_SHA256}"
          tools/launcher-release/publish.sh egui

      - name: attach the macOS zip to the dated release
        if: env.MAC_OK == 'true'
        env:
          MAC_ZIP_SHA256: ${{ needs.desktop-macos.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          tools/launcher-release/publish.sh check "${MAC_ZIP}" "${MAC_ZIP_SHA256}"
          tools/launcher-release/publish.sh macos

      - name: refresh the macOS zip on launcher-current
        if: env.MAC_OK == 'true' && env.SIGNED == 'true'
        run: tools/launcher-release/publish.sh macos-current

      - name: job summary
        if: always()
        run: |
          {
            echo "## macOS assets for ${TAG}"
            echo
            [ "${EGUI_OK}" = true ] || echo "The egui launcher under Wine was not built; the release has no \`sgw-launcher-macos-wine\` exe."
            if [ "${MAC_OK}" != true ]; then
              echo "The macOS build failed; \`${MAC_ZIP_NAME}\` is not on this release, and \`launcher-current\` keeps the macOS zip it had (crates/launcher/desktop/docs/release.md)."
            elif [ "${SIGNED}" = true ]; then
              echo "\`${MAC_ZIP_NAME}\` is on the dated release and on \`launcher-current\`. It is not in \`latest.json\`: macOS updates are manual."
            else
              echo "\`${MAC_ZIP_NAME}\` is on the dated release only; \`launcher-current\` was not changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
