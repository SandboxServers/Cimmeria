name: launcher-release

# Builds and publishes the desktop launcher (crates/launcher/desktop, the Tauri
# one) as a GitHub Release. Triggered either manually via the Actions UI
# (`workflow_dispatch`) or via the `/release-launcher` ChatOps command on a
# merged PR, which dispatches this workflow through
# `launcher-release-on-comment.yml`.
#
# Always builds whatever is at `main` HEAD — the triggering PR is just
# the cut-point marker, mirroring the policy of `release-container.yml`.
#
# What one run publishes (crates/launcher/desktop/docs/release.md):
#   - the dated release `launcher-YYYYMMDD-<sha7>`, created by the
#     `desktop-windows` job, with `StargateWorlds-Launcher-windows-x64.zip`,
#     its `.sha256`, its Minisign `.zip.sig` when the updater key is set, and
#     the client-patches overlay patch when one is committed;
#   - the rolling `launcher-current` release (D-LX7), its assets deleted and
#     recreated: the zip, `.sha256`, `.zip.sig` and the updater feed
#     `latest.json`. Only with the updater key (D-LX9), and only for the day's
#     first release (see the version step);
#   - until the macOS desktop build ships (LX-28, D-LX14), the original egui
#     launcher as `sgw-launcher-macos-wine-<tag>.exe` for Mac players who run
#     it under Wine. It is no longer published as `sgw-launcher-<tag>.exe`, the
#     exact name the egui launcher updates itself from, so Windows players of
#     the egui launcher stop being offered updates and move to the zip (D-LX2).
#
# Releases ship unsigned: code signing is deferred by the owner (D-LX10). The
# launch worker injects DLLs into the game, which is what Defender and
# SmartScreen react to.

on:
  workflow_dispatch:
    inputs:
      triggering_pr:
        description: 'PR # that triggered this release (informational, optional)'
        required: false

permissions: {}

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  # The zip holds cimmeria-launcher-desktop.exe at its root with a windows/
  # directory beside it (the 32-bit launch worker and the two game DLLs) and
  # graphics/. The launcher refuses any of those three whose SHA-256 is not the
  # one compiled into it, so they are built, staged and pinned in this one job.
  # Its build runs in stages from tools/launcher-release/build-desktop.sh, the
  # same stages launcher-desktop.yml dry-runs on every desktop-launcher PR.
  desktop-windows:
    name: desktop launcher (Windows) -> dated release + launcher-current
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
      epoch: ${{ steps.stamp.outputs.epoch }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZIP: artifacts/StargateWorlds-Launcher-windows-x64.zip
      # 'true' or 'false' only: the key itself reaches the sign step alone.
      HAS_UPDATER_KEY: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_KEY != '' }}
      # The Minisign public key, base64 of the `.pub` file. A repository
      # variable, not a secret: it is public, and a variable shows in logs
      # and settings, so a mismatch with the private key is easy to see.
      LAUNCHER_UPDATER_PUBKEY: ${{ vars.LAUNCHER_UPDATER_PUBKEY }}
    steps:
      # Actions pinned to immutable commit SHAs (with version comments) per
      # GitHub's secure-use guide. This job is privileged — it builds with a
      # secret SAS baked in, signs with the updater key and creates GitHub
      # Releases — so the supply-chain surface from any third-party action is
      # unusually large here. `persist-credentials: false` so the GITHUB_TOKEN
      # isn't left in the local git config for later steps.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # The dispatched commit; the egui job below builds the same one.
          ref: ${{ github.sha }}
          persist-credentials: false

      # The tag and the build time, as before: a manifest's `min_launcher`
      # compares them. The compiled version is D-LX8's `YYYY.M.D` from the
      # same date, which the updater compares as SemVer. When a dated release
      # already exists for that day this one is `YYYY.M.D-N`, N counting this
      # run among the day's releases (the second is -2). The stable channel
      # refuses a prerelease, so such a rebuild is never offered as an update;
      # it is published as its dated release only and launcher-current keeps
      # the day's first release.
      - name: stamp tag and version
        id: stamp
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          EPOCH=$(date -u +%s)
          DATE=$(date -u -d "@${EPOCH}" +%Y%m%d)
          TAG="launcher-${DATE}-${SHORT_SHA}"
          BASE="$(date -u -d "@${EPOCH}" +%Y).$(date -u -d "@${EPOCH}" +%-m).$(date -u -d "@${EPOCH}" +%-d)"
          # This run's own tag is left out, so a re-run keeps its version.
          EARLIER=$(gh release list --limit 200 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"launcher-${DATE}-\")) | select(.tagName != \"${TAG}\")] | length")
          if [ "${EARLIER}" -eq 0 ]; then
            VERSION="${BASE}"; SAME_DAY=false
          else
            VERSION="${BASE}-$((EARLIER + 1))"; SAME_DAY=true
          fi
          [[ "${VERSION}" =~ ^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(-[0-9]+)?$ ]] \
            || { echo "::error::computed version ${VERSION} is not D-LX8 SemVer"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "same_day=${SAME_DAY}" >> "$GITHUB_OUTPUT"
          echo "tag ${TAG}, version ${VERSION}, earlier releases today: ${EARLIER}"

      # launcher-current and its feed are written only for a stable version
      # signed with the updater key. The key and the public-key variable go
      # together (D-LX9); one without the other is a misconfiguration.
      - name: decide what this release publishes
        id: plan
        shell: bash
        env:
          SAME_DAY: ${{ steps.stamp.outputs.same_day }}
        run: |
          set -euo pipefail
          if [ "${HAS_UPDATER_KEY}" = true ] && [ -z "${LAUNCHER_UPDATER_PUBKEY}" ]; then
            echo "::error::LAUNCHER_UPDATER_MINISIGN_KEY is set but the LAUNCHER_UPDATER_PUBKEY variable is not; the launcher would be built unable to verify what it is offered"
            exit 1
          fi
          SIGN=false
          if [ "${HAS_UPDATER_KEY}" = true ] && [ "${SAME_DAY}" = false ]; then SIGN=true; fi
          echo "sign=${SIGN}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: launcher-release-desktop
          workspaces: |
            . -> target
            crates/launcher/desktop -> ../../../target/desktop

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: build the i686 launch worker and game DLLs
        shell: bash
        run: tools/launcher-release/build-desktop.sh helpers

      - name: stage them as the launcher's bundled resources
        shell: bash
        run: tools/launcher-release/build-desktop.sh stage

      # The release stamps are on this step only. The test suites use the
      # development manifest key and fail with the production one set, and the
      # SAS is compiled in with `option_env!`, so no other step has them.
      - name: build the 64-bit desktop launcher, pinned to them
        shell: bash
        env:
          # 64 hex chars = 32 raw bytes. Ed25519 public key whose private
          # counterpart signs every manifest the launcher will accept
          # (docs/client/launcher-distribution-setup.md).
          LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}
          # Where Settings' "Upload debug logs" PUTs the zip (D-LX11). Unset,
          # the button is hidden.
          LAUNCHER_LOG_SAS_URL: ${{ secrets.LAUNCHER_LOG_SAS_URL }}
          CIMMERIA_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
          CIMMERIA_LAUNCHER_TAG: ${{ steps.stamp.outputs.tag }}
          CIMMERIA_LAUNCHER_BUILD_EPOCH: ${{ steps.stamp.outputs.epoch }}
          CIMMERIA_BUILD_BRANCH: main
          CIMMERIA_BUILD_GIT_SHA: ${{ github.sha }}
          # LAUNCHER_UPDATER_PUBKEY comes from the job env. Unset, the build's
          # updater is Disabled.
        run: tools/launcher-release/build-desktop.sh launcher

      - name: verify the artifacts
        shell: bash
        env:
          CIMMERIA_LAUNCHER_TAG: ${{ steps.stamp.outputs.tag }}
          CIMMERIA_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
        run: tools/launcher-release/build-desktop.sh verify

      # StargateWorlds-Launcher-windows-x64.zip and its .sha256 (sha256sum
      # format, `<hex>  <file name>`).
      - name: package
        shell: bash
        run: tools/launcher-release/build-desktop.sh package

      # The feed offers the zip from this release's own immutable tag, not
      # from launcher-current: the signature pins those exact bytes, so a feed
      # read while launcher-current's assets are being replaced still names a
      # zip that matches it.
      - name: sign the zip and write the updater feed
        if: steps.plan.outputs.sign == 'true'
        shell: bash
        env:
          LAUNCHER_UPDATER_MINISIGN_KEY: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_KEY }}
          LAUNCHER_UPDATER_MINISIGN_PASSWORD: ${{ secrets.LAUNCHER_UPDATER_MINISIGN_PASSWORD }}
          TAG: ${{ steps.stamp.outputs.tag }}
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          tools/launcher-release/build-desktop.sh sign "${VERSION}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/StargateWorlds-Launcher-windows-x64.zip" \
            "Stargate Worlds launcher ${VERSION} (${TAG})."

      # The launcher engine's own feed, signature and zip checks against the
      # public key this build compiled in: a pair that does not match, or a
      # feed the launcher would refuse, stops the release here.
      - name: check the feed as a launcher would
        if: steps.plan.outputs.sign == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: tools/launcher-release/build-desktop.sh verify-feed "${VERSION}"

      # The overlay zip is served from this release's own immutable tag, so
      # the entry's blob URL points here. With no overlay committed the tool
      # prints "nothing to pack" and the release carries the launcher alone.
      - name: pack client-patches overlay
        shell: bash
        env:
          TAG: ${{ steps.stamp.outputs.tag }}
        run: |
          set -euo pipefail
          cargo build --locked -p cimmeria-launcher-core --bin pack-client-overlay --release
          tools/launcher-release/build.sh overlay "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

      - name: upload build artifact (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: stargate-worlds-launcher-windows-${{ steps.stamp.outputs.tag }}
          path: |
            artifacts/StargateWorlds-Launcher-windows-x64.zip*
            artifacts/latest.json
            overlay-out/
          if-no-files-found: error
          retention-days: 30

      - name: create the dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRIGGERING_PR: ${{ github.event.inputs.triggering_pr }}
          TAG: ${{ steps.stamp.outputs.tag }}
          VERSION: ${{ steps.stamp.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="Stargate Worlds launcher ${VERSION}, built from commit \`${GITHUB_SHA}\`."
          if [ -n "${TRIGGERING_PR}" ]; then
            BODY="${BODY}

          Dispatched from PR #${TRIGGERING_PR}."
          fi
          BODY="${BODY}

          **Windows:** download \`StargateWorlds-Launcher-windows-x64.zip\`, unzip it anywhere and run \`cimmeria-launcher-desktop.exe\`; keep the \`windows\` and \`graphics\` folders beside it. It needs the WebView2 runtime (part of Windows 11). The newest release is always at https://github.com/${GITHUB_REPOSITORY}/releases/download/launcher-current/StargateWorlds-Launcher-windows-x64.zip.

          This build is unsigned. If Windows Defender or SmartScreen blocks it, see docs/client/launcher-guide.md."
          assets=("${ZIP}" "${ZIP}.sha256")
          if [ -f "${ZIP}.sig" ]; then assets+=("${ZIP}.sig"); fi
          shopt -s nullglob
          overlay=(overlay-out/*.zip overlay-out/*.entry.json)
          if [ ${#overlay[@]} -gt 0 ]; then
            BODY="${BODY}

          Includes the client-patches UI overlay patch. To publish it, add its \`.entry.json\` to the content manifest and re-sign (docs/client/launcher-distribution-setup.md)."
          fi
          gh release create "${TAG}" \
            --title "Launcher ${TAG}" \
            --notes "${BODY}" \
            "${assets[@]}" "${overlay[@]}"

      # D-LX7: the stable download link. Each asset is deleted and uploaded
      # again (a release asset cannot be replaced in place); latest.json goes
      # last, and it names the dated release's zip, so a launcher reading the
      # feed mid-refresh is never pointed at a missing or mismatched file. The
      # release is never marked latest, and its tag has no date, which the egui
      # launcher's self-update skips.
      - name: refresh launcher-current
        if: steps.plan.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.stamp.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=launcher-current
          if ! gh release view "${CURRENT}" >/dev/null 2>&1; then
            gh release create "${CURRENT}" --latest=false \
              --title "Launcher (current)" \
              --notes "The newest Stargate Worlds launcher, refreshed by every release. Download StargateWorlds-Launcher-windows-x64.zip. The desktop launcher's updater reads latest.json from here."
          fi
          gh release edit "${CURRENT}" --latest=false \
            --notes "The newest Stargate Worlds launcher, currently ${TAG}. Download StargateWorlds-Launcher-windows-x64.zip. The desktop launcher's updater reads latest.json from here."
          for file in "${ZIP}" "${ZIP}.sha256" "${ZIP}.sig" artifacts/latest.json; do
            name="$(basename "${file}")"
            gh release delete-asset "${CURRENT}" "${name}" --yes 2>/dev/null || true
            gh release upload "${CURRENT}" "${file}"
          done

      - name: job summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.stamp.outputs.tag }}
          VERSION: ${{ steps.stamp.outputs.version }}
          SAME_DAY: ${{ steps.stamp.outputs.same_day }}
          SIGN: ${{ steps.plan.outputs.sign }}
        run: |
          {
            echo "## Launcher ${TAG}"
            echo
            echo "Compiled version: \`${VERSION}\`"
            echo
            if [ "${SIGN}" = true ]; then
              echo "Signed with the updater key. \`launcher-current\` now holds this release's zip, \`.sha256\`, \`.zip.sig\` and \`latest.json\`, which offers \`${VERSION}\` to every older launcher."
            else
              if [ "${SAME_DAY}" = true ]; then
                echo "**Same-day rebuild.** \`${VERSION}\` is a prerelease, which the launcher's stable channel refuses, so this build is not offered to players as an update. It is published as its dated release only; \`launcher-current\` still holds the day's first release."
                echo
              fi
              if [ "${HAS_UPDATER_KEY}" != true ]; then
                echo "**No updater key.** \`LAUNCHER_UPDATER_MINISIGN_KEY\` is not set, so the zip is unsigned, no \`latest.json\` was written and \`launcher-current\` was skipped. This is expected until the key holder does D-LX9 (crates/launcher/desktop/docs/release.md, \"Key holder steps\")."
                if [ -n "${LAUNCHER_UPDATER_PUBKEY}" ]; then
                  echo
                  echo "Warning: \`LAUNCHER_UPDATER_PUBKEY\` is set without the private key, so this build's updater is enabled but nothing publishes a feed for it."
                else
                  echo "The build's updater is Disabled (no \`LAUNCHER_UPDATER_PUBKEY\`)."
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # D-LX14: Mac players run the original egui launcher under Wine until the
  # macOS desktop build ships (LX-28), so it is still built, under a name the
  # egui self-update does not look for (D-LX2; see the top of this file). It
  # runs after the dated release exists and only adds an asset, so a failure
  # here leaves the release as it is. LX-18 deletes this job with the egui
  # launcher, after LX-28.
  egui-macos-wine:
    name: original launcher for macOS under Wine -> same release
    needs: desktop-windows
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TAG: ${{ needs.desktop-windows.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # The commit the first job stamped into the tag, not whatever main
          # has become since.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: launcher-release
      - name: build the i686 client-patches and client-telemetry DLLs and sgw-start32 helper
        shell: bash
        run: tools/launcher-release/build.sh i686
      # Both secrets are baked in at compile time via `option_env!` in
      # src/config.rs and src/manifest.rs. The tag and epoch are the release's,
      # read by src/self_update/build_info.rs.
      - name: build the 64-bit launcher, embedding them
        shell: bash
        env:
          LAUNCHER_LOG_SAS_URL: ${{ secrets.LAUNCHER_LOG_SAS_URL }}
          LAUNCHER_MANIFEST_PUBKEY_HEX: ${{ secrets.LAUNCHER_MANIFEST_PUBKEY_HEX }}
          CIMMERIA_LAUNCHER_TAG: ${{ needs.desktop-windows.outputs.tag }}
          CIMMERIA_LAUNCHER_BUILD_EPOCH: ${{ needs.desktop-windows.outputs.epoch }}
          CIMMERIA_BUILD_BRANCH: main
          CIMMERIA_BUILD_GIT_SHA: ${{ github.sha }}
        run: tools/launcher-release/build.sh launcher
      - name: verify the artifacts
        shell: bash
        env:
          CIMMERIA_LAUNCHER_TAG: ${{ needs.desktop-windows.outputs.tag }}
        run: tools/launcher-release/build.sh verify
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          EXE="sgw-launcher-macos-wine-${TAG}.exe"
          cp target/release/sgw-launcher.exe "artifacts/${EXE}"
          printf '%s  %s\n' "$(sha256sum "artifacts/${EXE}" | cut -d' ' -f1)" "${EXE}" > "artifacts/${EXE}.sha256"
          gh release upload "${TAG}" "artifacts/${EXE}" "artifacts/${EXE}.sha256"
          BODY="$(gh release view "${TAG}" --json body --jq .body)"
          BODY="${BODY}

          **macOS (under Wine):** \`${EXE}\` is the original launcher, for Mac players who run it under Wine (docs/guides/macos.md) until the macOS desktop launcher is released. It does not update itself to later releases; download the newest from the releases page."
          gh release edit "${TAG}" --notes "${BODY}"
