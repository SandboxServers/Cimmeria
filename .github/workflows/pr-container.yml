name: pr-container

# Build the release container on every PR that touches files going into
# the image, and smoke-test the result locally — without pushing to
# GHCR. Catches Docker / db-init / s6 / boot regressions before merge,
# which otherwise only surface when `release-container.yml` runs on
# push to main and main is already broken.
#
# Path filter matches release-container.yml exactly, so a PR triggers
# this iff a push of the same diff would have triggered a release.
#
# Cache: reuses the same `type=gha` cache scope as the release
# workflow. The release stage uses `cargo build -p cimmeria-server
# --release`; this workflow uses the same Dockerfile, so the buildx
# layers (deps compiled, recast hydrated, db-init pgdata) are shared.
# Cold first PR after a dep change is ~10-15 min; warm PRs are a few
# minutes.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'entities/defs/**'
      - 'entities/spaces.xml'
      - 'entities/cell_spaces.xml'
      - 'data/cache/**'
      - 'data/spaces/**'
      - 'db/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'docker/**'
      - '.github/workflows/pr-container.yml'
      - '.github/workflows/release-container.yml'
      - 'tools/container-smoke.sh'
  workflow_dispatch:

# Top-level: deny everything. Each job opts into the minimum it needs.
# This is the gold-standard least-privilege posture per Well-Architected.
permissions: {}

# Cancel superseded runs on the same PR — saves runner minutes when a
# PR gets force-pushed during review. (Releases must NOT cancel; PRs
# should.)
concurrency:
  group: pr-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build + smoke-test (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    # Hard ceiling on runner minutes. Cold cache + full Rust build is
    # ~15 min; warm PRs are 5 min. 30 catches a runaway / hung step
    # without wrecking legitimate cold builds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Default leaves the GH token in `.git/config`, where any
          # subsequent step (or compromised dep) can read it. We don't
          # push from this workflow, so drop the token after checkout.
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Busts the cached `apt-get upgrade` layer once a day (docker/Dockerfile).
      - name: apt upgrade date
        id: aptdate
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: build (load locally, do not push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}
          # OTLP `service.version` (crates/server/build.rs). The PR head, not
          # the synthetic merge commit; falls back to github.sha on dispatch.
          build-args: |
            CIMMERIA_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            APT_UPGRADE_DATE=${{ steps.aptdate.outputs.date }}
          # Share the cache scope with release-container.yml so warm
          # builds skip the Rust compile entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan of the locally-built image. Fails the job on
      # CRITICAL CVEs — those are usually known-exploited or pre-auth
      # remote (the kind of thing that warrants holding a release).
      # HIGH and below are reported but don't block; bumping pins via
      # Dependabot covers most of those over time. `.trivyignore` (if
      # present) lets the team accept individual CVEs explicitly.
      - name: scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # .trivyignore documents each suppressed CVE and why it's
          # unreachable in our image. See the file for the policy.
          trivyignores: .trivyignore

      # The login probe (cimmeria-wireclient's `login-probe`) is compiled in
      # the same builder layer as the server, so this export is a cache hit
      # on the build above, not a second compile. See docker/Dockerfile.
      - name: export the login probe
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: login-probe
          push: false
          outputs: type=local,dest=${{ runner.temp }}/login-probe
          # Must match the image build exactly so the builder layer is shared.
          build-args: |
            CIMMERIA_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            APT_UPGRADE_DATE=${{ steps.aptdate.outputs.date }}
          cache-from: type=gha
          # No cache-to: a second gha export would overwrite the scope's
          # cache index with this small target's.
          provenance: false
          sbom: false

      # Log in to the running container as a client: wrong password rejected,
      # seeded account accepted (SOAP Phase 1 + 2), advertised BaseApp
      # endpoint = 127.0.0.1 and the port Docker published (not the server's
      # own BASE_* values), and the Mercury handshake against it. The script prints container state, `docker
      # logs` and copies the server's log files on every run. See
      # tools/container-smoke.sh and docs/operations/container.md.
      - name: smoke-test the locally-built image (login probe)
        run: |
          bash tools/container-smoke.sh \
            "cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}" \
            "${{ runner.temp }}/login-probe/login-probe" \
            "${{ runner.temp }}/container-smoke-logs"

      - name: upload container smoke logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-smoke-logs
          path: ${{ runner.temp }}/container-smoke-logs
          if-no-files-found: ignore
          retention-days: 14

      # The image must refuse to serve when the server cannot log in to its
      # database. pg_isready passes here (postgres is up); only DB_URL names a
      # database that does not exist. The container must exit non-zero and
      # never bind the login port (docker/s6/cimmeria-server/run, finish).
      - name: smoke-test refusal with an unusable DB_URL
        env:
          IMAGE: cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}
        run: |
          set -uo pipefail
          docker run -d --name dbcheck \
            -e DB_URL="host=127.0.0.1 port=5432 user=w-testing password=w-testing dbname=cimmeria_missing_db" \
            -e DB_AUTH_CHECK_ATTEMPTS=3 \
            "$IMAGE"
          status=""
          served=0
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}}' dbcheck 2>/dev/null)"
            [ "$status" = "exited" ] && break
            if docker exec dbcheck timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/8081" 2>/dev/null; then
              served=1
              break
            fi
            sleep 2
          done
          code="$(docker inspect -f '{{.State.ExitCode}}' dbcheck 2>/dev/null)"
          echo "::group::container logs"
          docker logs dbcheck || true
          echo "::endgroup::"
          logs="$(docker logs dbcheck 2>&1 || true)"
          docker rm -f dbcheck >/dev/null 2>&1 || true

          if [ "$served" -eq 1 ]; then
            echo "::error::login port was bound although DB_URL cannot log in"
            exit 1
          fi
          if [ "$status" != "exited" ] || [ "$code" = "0" ]; then
            echo "::error::expected the container to exit non-zero (status=$status exit=$code)"
            exit 1
          fi
          if ! printf '%s' "$logs" | grep -q 'cannot log in to the database'; then
            echo "::error::the database login check did not report the failure"
            exit 1
          fi
          echo "refused as expected (exit $code)"
