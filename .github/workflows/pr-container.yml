name: pr-container

# Build the release container and smoke-test it locally, without pushing
# to GHCR. Catches Docker / db-init / s6 / boot regressions long before
# release-container.yml (which runs only on `/release` or a manual
# dispatch) would.
#
# Two triggers, two path lists:
#
#   * pull_request: only the files that are the container itself (the
#     Dockerfile and s6 tree, the smoke scripts (login and persistence), the DB
#     seeds that feed db-sync (db/sgw, db/persistent), the Trivy policy, these
#     workflows) and the dependency set Trivy scans (Cargo.lock). Until
#     2026-10-11 every crates/** or db/** PR ran it, which made it the
#     self-hosted pool's largest load (more runner time than the gating
#     build + nextest job) for a check that never gated a merge.
#   * push to main: everything that goes into the image, the list the PR
#     trigger used to have. A crates-only break is caught one merge later,
#     on main, and the `report` job makes it loud: a `main-red` issue, and
#     tools/build-lane/ship.py refuses code merges until a passing run on
#     main closes it.
#
# Cache: self-hosted runners use the node's shared BuildKit daemon; hosted
# runners reuse release-container.yml's `type=gha` scope. Cold first build
# after a dep change is ~10-15 min; warm builds are a few minutes.

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'Cargo.lock'
      - '.trivyignore'
      - '.github/workflows/pr-container.yml'
      - '.github/workflows/release-container.yml'
      - 'tools/container-smoke.sh'
      - 'tools/container-persistence-smoke.sh'
      - 'db/sgw/**'
      - 'db/persistent/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'entities/defs/**'
      - 'entities/spaces.xml'
      - 'entities/cell_spaces.xml'
      - 'data/cache/**'
      - 'data/spaces/**'
      - 'db/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'docker/**'
      - '.trivyignore'
      - '.github/workflows/pr-container.yml'
      - '.github/workflows/release-container.yml'
      - 'tools/container-smoke.sh'
      - 'tools/container-persistence-smoke.sh'
  workflow_dispatch:

# Top-level: deny everything. Each job opts into the minimum it needs.
# This is the gold-standard least-privilege posture per Well-Architected.
permissions: {}

# A PR cancels its own superseded run. On main a running build always
# finishes (its verdict opens or closes the main-red issue), and GitHub keeps
# only the newest pending run: a burst of merges is checked as one batch, at
# the newest commit, instead of once per merge.
concurrency:
  group: pr-container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    name: build + smoke-test (no push)
    # Self-hosted cimmeria-linux (tools/ci-runners/README.md), except fork PRs and
    # CI_LINUX_RUNNER=hosted, which use GitHub-hosted runners.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',build-and-smoke,')) && 'ubuntu-latest' || 'cimmeria-linux' }}
    permissions:
      contents: read   # actions/checkout
    # Hard ceiling on runner minutes. Cold cache + full Rust build is
    # ~15 min; warm PRs are 5 min; the persistence smoke adds eight
    # scenarios with several 1-5 minute boots. 45 catches a runaway / hung
    # step without wrecking legitimate cold builds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Default leaves the GH token in `.git/config`, where any
          # subsequent step (or compromised dep) can read it. We don't
          # push from this workflow, so drop the token after checkout.
          persist-credentials: false

      # On self-hosted runners, build through the node's shared BuildKit daemon
      # (tools/ci-runners/compose.yml `buildkitd`): its layers and the Dockerfile's
      # cargo cache mounts persist between jobs, which the gha cache can't do for
      # cache mounts. GitHub-hosted runners keep the default builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ runner.environment == 'self-hosted' && 'remote' || 'docker-container' }}
          endpoint: ${{ runner.environment == 'self-hosted' && 'tcp://buildkitd:1234' || '' }}

      # Busts the cached `apt-get upgrade` layer once a day (docker/Dockerfile).
      - name: apt upgrade date
        id: aptdate
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: build (load locally, do not push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}
          # OTLP `service.version` (crates/server/build.rs). The PR head, not
          # the synthetic merge commit; falls back to github.sha on dispatch.
          build-args: |
            CIMMERIA_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            APT_UPGRADE_DATE=${{ steps.aptdate.outputs.date }}
          # Share the cache scope with release-container.yml so warm
          # builds skip the Rust compile entirely. Self-hosted runners use the
          # node's BuildKit cache instead: a gha export from the colo would upload
          # GBs through the egress detour (tools/ci-runners/README.md).
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max' || '' }}

      # Trivy scan of the locally-built image. Fails the job on
      # CRITICAL CVEs — those are usually known-exploited or pre-auth
      # remote (the kind of thing that warrants holding a release).
      # HIGH and below are reported but don't block; bumping pins via
      # Dependabot covers most of those over time. `.trivyignore` (if
      # present) lets the team accept individual CVEs explicitly.
      - name: scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # .trivyignore documents each suppressed CVE and why it's
          # unreachable in our image. See the file for the policy.
          trivyignores: .trivyignore

      # The login probe (cimmeria-wireclient's `login-probe`) is compiled in
      # the same builder layer as the server, so this export is a cache hit
      # on the build above, not a second compile. See docker/Dockerfile.
      - name: export the login probe
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: login-probe
          push: false
          outputs: type=local,dest=${{ runner.temp }}/login-probe
          # Must match the image build exactly so the builder layer is shared.
          build-args: |
            CIMMERIA_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            APT_UPGRADE_DATE=${{ steps.aptdate.outputs.date }}
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          # No cache-to: a second gha export would overwrite the scope's
          # cache index with this small target's.
          provenance: false
          sbom: false

      # Log in to the running container as a client: wrong password rejected,
      # seeded account accepted (SOAP Phase 1 + 2), advertised BaseApp
      # endpoint = 127.0.0.1 and the port Docker published (not the server's
      # own BASE_* values), and the Mercury handshake against it. The script prints container state, `docker
      # logs` and copies the server's log files on every run. See
      # tools/container-smoke.sh and docs/operations/container.md.
      - name: smoke-test the locally-built image (login probe)
        run: |
          bash tools/container-smoke.sh \
            "cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}" \
            "${{ runner.temp }}/login-probe/login-probe" \
            "${{ runner.temp }}/container-smoke-logs"

      - name: upload container smoke logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-smoke-logs
          path: ${{ runner.temp }}/container-smoke-logs
          if-no-files-found: ignore
          retention-days: 14

      # The image must refuse to serve when the server cannot log in to its
      # database. pg_isready passes here (postgres is up); only DB_URL names a
      # database that does not exist. The container must exit non-zero and
      # never bind the login port (docker/s6/cimmeria-server/run, finish).
      - name: smoke-test refusal with an unusable DB_URL
        env:
          IMAGE: cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}
        run: |
          set -uo pipefail
          docker run -d --name dbcheck \
            -e DB_URL="host=127.0.0.1 port=5432 user=w-testing password=w-testing dbname=cimmeria_missing_db" \
            -e DB_AUTH_CHECK_ATTEMPTS=3 \
            "$IMAGE"
          status=""
          served=0
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}}' dbcheck 2>/dev/null)"
            [ "$status" = "exited" ] && break
            if docker exec dbcheck timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/8081" 2>/dev/null; then
              served=1
              break
            fi
            sleep 2
          done
          code="$(docker inspect -f '{{.State.ExitCode}}' dbcheck 2>/dev/null)"
          echo "::group::container logs"
          docker logs dbcheck || true
          echo "::endgroup::"
          logs="$(docker logs dbcheck 2>&1 || true)"
          docker rm -f dbcheck >/dev/null 2>&1 || true

          if [ "$served" -eq 1 ]; then
            echo "::error::login port was bound although DB_URL cannot log in"
            exit 1
          fi
          if [ "$status" != "exited" ] || [ "$code" = "0" ]; then
            echo "::error::expected the container to exit non-zero (status=$status exit=$code)"
            exit 1
          fi
          if ! printf '%s' "$logs" | grep -q 'cannot log in to the database.*the database does not exist'; then
            echo "::error::the database login check did not report the sanitised reason"
            exit 1
          fi
          # The check prints a fixed reason, never the connection string.
          if printf '%s' "$logs" | grep -q 'password=w-testing'; then
            echo "::error::the container log contains the DB_URL password"
            exit 1
          fi
          echo "refused as expected (exit $code)"

      - name: validate docker/compose.yml
        run: docker compose -f docker/compose.yml config -q
        env:
          CIMMERIA_BACKUP_DIR: ${{ runner.temp }}/backups

      - name: persistence smoke (keep / rebuild / restore / wipe)
        run: |
          bash tools/container-persistence-smoke.sh \
            "cimmeria-server:pr-${{ github.event.pull_request.number || 'dispatch' }}" \
            "${{ runner.temp }}/container-persistence-logs"

      - name: upload persistence smoke logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-persistence-logs
          path: ${{ runner.temp }}/container-persistence-logs
          if-no-files-found: ignore
          retention-days: 14
  # Main only: a failed build or smoke on main opens (or updates) the
  # `main-red` issue for this check, and a passing one closes it. A run that
  # was cancelled or superseded says nothing either way. A manual dispatch on
  # main reports too (`gh workflow run pr-container.yml --ref main`), so a
  # Trivy flake or a newly published CVE fixed by .trivyignore can be cleared
  # without waiting for the next image-input merge.
  report:
    name: report the main build
    needs: build-and-smoke
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.build-and-smoke.result == 'success' || needs.build-and-smoke.result == 'failure')
    runs-on: ${{ (vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',report,')) && 'ubuntu-latest' || 'cimmeria-linux-quick' }}
    permissions:
      contents: read   # actions/checkout
      issues: write    # the main-red issue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: tools/main-red
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ needs.build-and-smoke.result == 'success' && 'pass' || 'fail' }}
        run: bash tools/main-red/main-red.sh "$VERDICT" "container build + smoke" "$RUN"
