name: release-container

# Build and publish a self-contained Cimmeria server container image
# (server + cooked data + pre-loaded Postgres). Releases are gated —
# this workflow does NOT run on push to main. Trigger paths:
#
#   1. Comment `/release` on a merged PR — release-on-comment.yml
#      validates the commenter and dispatches this workflow.
#   2. Run manually from the Actions UI ("Run workflow" button) or
#      `gh workflow run release-container.yml --ref main`.
#
# In both cases this workflow builds whatever is at `main` HEAD, not
# the SHA of any specific PR. The optional `triggering_pr` input is
# audit metadata only — it links the produced release back to the PR
# whose `/release` comment kicked off the build.
#
# The image is published to two places:
#   1. ghcr.io/<owner>/cimmeria-server:<YYYY-MM-DD.N> (canonical home)
#   2. GitHub Releases (pre-release with pull instructions)
#
# Versioning: YYYY-MM-DD.N where N is the 1-based release count for that
# UTC calendar day. Same-day collisions are serialised by the
# `release-container` concurrency group.

on:
  workflow_dispatch:
    inputs:
      triggering_pr:
        description: 'Optional PR number that prompted this release (audit-only)'
        required: false
        type: string

# Top-level: deny everything. Each job opts into the minimum it needs.
permissions: {}

# Serialise builds rather than cancelling them — a release that started
# building must finish, even if a follow-up commit lands. (`test.yml`
# uses cancel-in-progress: true; that's wrong for releases.)
concurrency:
  group: release-container
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: build, push, release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # push to ghcr.io
      attestations: write   # buildx provenance + SBOM attestations
      id-token: write       # OIDC token for keyless provenance signing
    # Cold release ~20 min for the Rust compile + DB bake + push +
    # smoke. 45 lets a single transient registry blip retry without
    # killing the run.
    timeout-minutes: 45
    steps:
      # Refuse to publish from anywhere other than main. workflow_dispatch
      # accepts an arbitrary `--ref`, so without this guard a typo'd
      # `gh workflow run --ref my-feature-branch` (or a malicious one)
      # would push that branch's code to GHCR and tag it as a release,
      # contradicting the documented contract that releases always come
      # from main HEAD.
      - name: reject non-main dispatches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release-container must be dispatched from main; got ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No subsequent step pushes via git — we publish via docker
          # push (using GHCR creds set by docker/login-action) and via
          # `gh release create` (using GITHUB_TOKEN env). Drop the git
          # token from the on-disk config to shrink the secret surface.
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase image owner
        id: img
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/cimmeria-server" >> "$GITHUB_OUTPUT"

      - name: compute version (YYYY-MM-DD.N)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Initial guess from existing GH releases for this UTC day.
          N=$(gh release list --limit 200 --json tagName \
                --jq "[.[] | select(.tagName | startswith(\"v${DATE}.\"))] | length")
          N=$((N + 1))

          # Bump past any GHCR tag that already exists at this version. The
          # release-list count above only sees runs that completed through
          # `gh release create`; a prior run that pushed the image but failed
          # before that step would leave a tag here that release-list misses,
          # and we'd otherwise clobber it. Tag is the source of truth.
          while docker manifest inspect "${IMAGE}:${DATE}.${N}" >/dev/null 2>&1; do
              N=$((N + 1))
          done

          echo "version=${DATE}.${N}"  >> "$GITHUB_OUTPUT"
          echo "tag=v${DATE}.${N}"     >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"          >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}"    >> "$GITHUB_OUTPUT"

      # Two-pass build: load-for-scan, then push-with-attestations.
      # Why both: buildx's `load: true` (Docker daemon export) is
      # incompatible with `provenance: true` (the docker exporter
      # doesn't carry attestations). Pushing first then scanning
      # would briefly publish a vulnerable image; scanning first
      # means a CRITICAL CVE blocks publish entirely. The second
      # build hits the buildx cache and effectively just attaches
      # attestations + pushes — no recompile.
      - name: build (load locally for scan)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No `provenance` / `sbom` here — incompatible with `load: true`.
          # Attestations are added on the push pass below.
          provenance: false
          sbom: false

      - name: scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      # Push only the dated tag at this point. `latest-prerelease` is
       # promoted AFTER the smoke test passes, so a smoke failure can't
       # leave the rolling pointer aimed at a broken image. The dated
       # tag is immutable and the version step's manifest-inspect loop
       # naturally bumps past any orphan, so leaving a failed dated
       # tag in place is fine — `latest-prerelease` is the only
       # consumer-facing pointer we have to protect.
      - name: push dated tag (with provenance + SBOM, after scan)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.created=${{ steps.ver.outputs.created }}
          cache-from: type=gha
          # Don't `cache-to` here — the load-for-scan pass already populated
          # the cache and another mode=max write is wasted bandwidth.
          provenance: true
          sbom: true

      - name: smoke-test the published image
        env:
          IMAGE: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
        # Note: NOT using `--rm`. If the container exits early `--rm`
        # would remove it before we could pull logs.
        run: |
          set -uo pipefail
          docker pull "$IMAGE"
          docker run -d --name smoke \
            -p 13001:13001 \
            -p 32832:32832/udp \
            -p 50000:50000/udp \
            -p 8443:8443 \
            "$IMAGE"
          # Postgres + auth listener + TCP probe — ~120 s budget for
          # cold pgdata boot + s6 service init.
          ok=0
          for i in $(seq 1 60); do
            if docker exec smoke pg_isready -h 127.0.0.1 -U w-testing -d sgw >/dev/null 2>&1 \
               && timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/13001" 2>/dev/null; then
              echo "smoke ok at iteration $i"
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" = "exited" ]; then
              echo "::error::container exited before becoming ready"
              break
            fi
            sleep 2
          done

          echo "::group::container state"
          docker inspect -f 'Status: {{.State.Status}}  ExitCode: {{.State.ExitCode}}  Error: {{.State.Error}}' smoke || true
          echo "::endgroup::"
          echo "::group::container logs"
          docker logs smoke || true
          echo "::endgroup::"

          docker rm -f smoke >/dev/null 2>&1 || true

          if [ "$ok" -ne 1 ]; then
              echo "::error::smoke test never saw postgres + auth listener within 120s"
              exit 1
          fi

      # Smoke passed — only NOW move the rolling pointer. `docker pull`
       # in the smoke step already loaded the image into the runner's
       # daemon, so this is just a local retag + push (no rebuild, no
       # network round-trip for layers).
      - name: promote latest-prerelease
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest-prerelease"
          docker push "${IMAGE}:latest-prerelease"

      # Render the Discord-notifications colo overlay. The template at
      # docker/compose.discord.yml carries `__DISCORD_*_WEBHOOK__`
      # sentinels which we substitute with the corresponding GitHub
      # Actions secrets here. Channels whose secret is unset are
      # stripped entirely from the rendered TOML (an empty URL would
      # trip cimmeria-discord's URL validation at startup — silently
      # dropping the channel is the right behaviour for "the colo
      # only cares about lifecycle, not errors").
      #
      # If BOTH secrets are unset we skip producing the artifact
      # altogether; the colo just won't have Discord notifications.
      # That's also the default for forks that don't have the org's
      # webhook secrets configured.
      - name: render Discord-notifications overlay
        id: discord_overlay
        env:
          # Empty strings if the secret is not configured on this
          # repo. The render step downstream is responsible for
          # handling those uniformly (drop the channel block).
          DISCORD_LIFECYCLE_WEBHOOK: ${{ secrets.DISCORD_LIFECYCLE_WEBHOOK }}
          DISCORD_ERRORS_WEBHOOK: ${{ secrets.DISCORD_ERRORS_WEBHOOK }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ -z "${DISCORD_LIFECYCLE_WEBHOOK}" && -z "${DISCORD_ERRORS_WEBHOOK}" ]]; then
              echo "::notice::No Discord webhook secrets are set on this repo — skipping compose.discord.yml render."
              echo "rendered=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # Per-channel render with awk so we can both substitute the
          # webhook URL AND drop the entire `[discord.channels.X]`
          # TOML block when the secret is empty. A two-stage sed
          # cannot do block-delete cleanly across the blank lines we
          # rely on for readability inside `content: |`.
          awk \
              -v lifecycle="${DISCORD_LIFECYCLE_WEBHOOK}" \
              -v errors="${DISCORD_ERRORS_WEBHOOK}" \
              '
              # Per-channel toml block (`[discord.channels.X]`
              # through the next blank line). When the corresponding
              # secret is empty, swallow the block; otherwise emit it
              # with the placeholder substituted.
              function emit_block(channel, secret, lines, n,    i) {
                  if (secret == "") return
                  for (i = 1; i <= n; i++) {
                      gsub("__DISCORD_" toupper(channel) "_WEBHOOK__", secret, lines[i])
                      print lines[i]
                  }
              }

              /\[discord\.channels\.lifecycle\]/ {
                  # Capture this and the next two non-empty lines (url, rate_limit).
                  n = 0; lines[++n] = $0
                  while ((getline ln) > 0 && ln != "") lines[++n] = ln
                  emit_block("lifecycle", lifecycle, lines, n)
                  # Re-emit the terminating blank line only when we
                  # kept the block (so the YAML stays grammatical).
                  if (lifecycle != "") print ""
                  next
              }

              /\[discord\.channels\.errors\]/ {
                  n = 0; lines[++n] = $0
                  while ((getline ln) > 0 && ln != "") lines[++n] = ln
                  emit_block("errors", errors, lines, n)
                  if (errors != "") print ""
                  next
              }

              # Default: pass through untouched.
              { print }
              ' docker/compose.discord.yml > dist/compose.discord.yml

          # Strip the leading commented preamble (template warning +
          # in-repo authoring notes) and replace it with a rendered-
          # overlay header. The original preamble warns operators not
          # to use the in-repo file directly — that's exactly the file
          # we're producing here, so the warning is wrong on the
          # rendered artifact. Deterministic strip: delete every
          # line until just before the first `services:` document key.
          awk '
              BEGIN { in_preamble = 1 }
              in_preamble && /^services:/ { in_preamble = 0 }
              !in_preamble { print }
          ' dist/compose.discord.yml > dist/compose.discord.yml.body
          cat > dist/compose.discord.yml <<HEADER
          # Cimmeria — Discord-notifications colo overlay
          #
          # Rendered by .github/workflows/release-container.yml from
          # docker/compose.discord.yml with webhook URLs substituted
          # from GitHub Actions secrets. Channels whose secret was
          # unset at render time were dropped from the TOML.
          #
          # Deploy on the colo (alongside docker/compose.yml):
          #
          #   docker compose -f compose.yml -f compose.discord.yml up -d
          #
          # See docs/operations/colo-deploy.md for full ops notes.
          HEADER
          # The here-doc indents each line by 10 spaces (to match
          # workflow YAML indentation). Strip that back out so the
          # rendered file is left-margin clean.
          sed -i 's/^          //' dist/compose.discord.yml
          cat dist/compose.discord.yml.body >> dist/compose.discord.yml
          rm dist/compose.discord.yml.body

          # Sanity check: no sentinels survived. A surviving sentinel
          # means the awk above lost track of a block — fail the
          # release rather than ship a broken overlay.
          if grep -q '__DISCORD_.*_WEBHOOK__' dist/compose.discord.yml; then
              echo "::error::Unrendered sentinel(s) left in dist/compose.discord.yml — render step is broken."
              grep -n '__DISCORD_.*_WEBHOOK__' dist/compose.discord.yml || true
              exit 1
          fi

          echo "::group::rendered compose.discord.yml"
          # Mask the URLs in the workflow log — the GH Actions secret
          # registry already masks the exact strings, but we belt-and-
          # braces it by redacting the entire `url = "..."` line.
          sed 's|url = ".*"|url = "<redacted>"|' dist/compose.discord.yml
          echo "::endgroup::"

          echo "rendered=true" >> "$GITHUB_OUTPUT"

      - name: create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          set -euo pipefail
          chmod +x docker/release-notes.sh
          docker/release-notes.sh "${{ steps.ver.outputs.version }}" > /tmp/release-notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            --prerelease \
            --title "Cimmeria server ${{ steps.ver.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --target "${{ github.sha }}"

      # Upload the Discord overlay (when rendered) AFTER the release
      # exists. This is the artifact operators `curl` from the release
      # page; without it the overlay isn't reachable. Use `--clobber`
      # so retried releases overwrite stale overlays in place.
      - name: attach Discord overlay to release
        if: steps.discord_overlay.outputs.rendered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.ver.outputs.tag }}" \
            dist/compose.discord.yml \
            --clobber
