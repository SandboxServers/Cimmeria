name: release-container

# Build and publish a self-contained Cimmeria server container image
# (server + cooked data + pre-loaded Postgres) on every shippable change
# to main. Doc-only changes do not trigger a build — see the path
# filter below.
#
# The image is published to two places:
#   1. ghcr.io/<owner>/cimmeria-server:<YYYY-MM-DD.N> (canonical home)
#   2. GitHub Releases (pre-release with pull instructions)
#
# Versioning: YYYY-MM-DD.N where N is the 1-based release count for that
# UTC calendar day. Same-day collisions are serialised by the
# `release-container` concurrency group.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'entities/defs/**'   # compile-time codegen — affects the binary
      - 'data/cache/**'      # PAKs — required at runtime
      - 'data/spaces/**'     # navmeshes — optional but ship for AI/LoS
      - 'db/**'              # schema + seeds (baked into pgdata)
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/**'
      - '.github/workflows/release-container.yml'
  workflow_dispatch:

permissions:
  contents: write   # create GitHub releases
  packages: write   # push to ghcr.io

# Serialise builds rather than cancelling them — a release that started
# building must finish, even if a follow-up commit lands. (`test.yml`
# uses cancel-in-progress: true; that's wrong for releases.)
concurrency:
  group: release-container
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: build, push, release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: compute version (YYYY-MM-DD.N)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          # Count existing releases for this UTC day.
          N=$(gh release list --limit 200 --json tagName \
                --jq "[.[] | select(.tagName | startswith(\"v${DATE}.\"))] | length")
          N=$((N + 1))
          echo "version=${DATE}.${N}" >> "$GITHUB_OUTPUT"
          echo "tag=v${DATE}.${N}"     >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"          >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase image owner
        id: img
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/cimmeria-server" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # GHCR tags: dated tag (immutable) + rolling pre-release pointer.
          # `latest` is reserved for the future stable promotion workflow.
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.image }}:latest-prerelease
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.created=${{ steps.ver.outputs.date }}
          # GitHub Actions cache exporter — keeps buildx layers warm
          # across runs without needing an external registry cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: smoke-test the published image
        env:
          IMAGE: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm -d --name smoke \
            -p 13001:13001 \
            -p 32832:32832/udp \
            -p 50000:50000/udp \
            -p 8443:8443 \
            "$IMAGE"
          # Postgres + auth listener + TCP probe — ~60 s for cold pgdata
          # boot + service init.
          for i in $(seq 1 60); do
            if docker exec smoke pg_isready -h 127.0.0.1 -U w-testing -d sgw >/dev/null 2>&1 \
               && timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/13001" 2>/dev/null; then
              echo "smoke ok at iteration $i"
              docker logs smoke || true
              docker stop smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::smoke test never saw postgres + auth listener within 120s"
          docker logs smoke || true
          docker stop smoke || true
          exit 1

      - name: create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x docker/release-notes.sh
          docker/release-notes.sh "${{ steps.ver.outputs.version }}" > /tmp/release-notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            --prerelease \
            --title "Cimmeria server ${{ steps.ver.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --target "${{ github.sha }}"
