name: launcher

# Path-filtered: only runs when the launcher crate or its workflows change.
# The launcher is excluded from the main `ci` workflow (test.yml) because
# eframe brings in heavier system deps than the rest of the workspace and
# only matters on Windows. This workflow owns its full pipeline.

on:
  push:
    branches: [main]
    paths:
      - 'crates/launcher/**'
      - 'crates/client-launch/**'
      - 'crates/start32/**'
      - 'crates/client-patches/**'
      - 'tools/launcher-release/**'
      - '.github/workflows/launcher-*.yml'
  pull_request:
    paths:
      - 'crates/launcher/**'
      - 'crates/client-launch/**'
      - 'crates/start32/**'
      - 'crates/client-patches/**'
      - 'tools/launcher-release/**'
      - '.github/workflows/launcher-*.yml'

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt --check (launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if ! cargo fmt -p sgw-launcher -- --check; then
            echo "::error::Formatting differs from rustfmt. Run 'cargo fmt -p sgw-launcher' locally and commit the result."
            exit 1
          fi

  clippy:
    name: cargo clippy -D warnings (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # client-launch too: its injection code is cfg(windows), so the
      # workspace clippy on Linux never lints it.
      - name: cargo clippy
        run: cargo clippy -p sgw-launcher -p cimmeria-client-launch -p cimmeria-start32 --all-targets -- -D warnings

  build:
    name: cargo build (Windows)
    runs-on: windows-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build
        run: cargo build -p sgw-launcher --all-targets

  test:
    name: cargo nextest (Windows)
    runs-on: windows-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install nextest
        uses: taiki-e/install-action@nextest
      # The launcher is x64 and SGW.exe is 32-bit, so injection goes through
      # the i686 sgw-start32 helper. Build it, then run the x64 tests with
      # CIMMERIA_TEST_START32 pointing at it: the start32 tests inject a real
      # DLL into a real 32-bit process through the helper, check its
      # asInvoker manifest, and that it starts without elevation. They fail,
      # rather than skip, when CI is set and the variable is not.
      - name: build the i686 sgw-start32 helper
        run: cargo build -p cimmeria-start32 --target i686-pc-windows-msvc
      - name: cargo nextest run
        shell: bash
        run: |
          set -euo pipefail
          # A Windows path: the test runs the helper through std::process::Command.
          export CIMMERIA_TEST_START32="$(cygpath -w "$PWD/target/i686-pc-windows-msvc/debug/sgw-start32.exe")"
          cargo nextest run --profile=ci -p sgw-launcher -p cimmeria-client-launch

  # launcher-release.yml has never run; its build must not be first tested at
  # release time. This job runs the same tools/launcher-release/build.sh
  # stages, in release profile, minus publishing: the i686 DLL
  # and helper, the 64-bit launcher embedding both, the artifact checks
  # (bitness, the helper's manifest and version resource, both embedded), and
  # the overlay pack.
  release-dry-run:
    name: release build dry run (Windows)
    runs-on: windows-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher-release-dry-run
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the i686 DLL and helper
        shell: bash
        run: tools/launcher-release/build.sh i686
      - name: build the 64-bit launcher, embedding both
        shell: bash
        run: tools/launcher-release/build.sh launcher
      - name: verify the artifacts
        shell: bash
        run: tools/launcher-release/build.sh verify
      - name: pack the client-patches overlay
        shell: bash
        run: tools/launcher-release/build.sh overlay https://example.invalid/dry-run

  # Coverage runs on ubuntu — the test logic is platform-agnostic, the
  # eframe deps that force the rest of the launcher pipeline onto Windows
  # aren't exercised by the unit suite, and ubuntu llvm-cov is cheaper
  # and faster than the Windows equivalent. The `launcher` flag tags the
  # upload so codecov can carve out per-component deltas without
  # double-counting against the main workspace coverage job in test.yml.
  coverage:
    name: cargo llvm-cov (launcher)
    runs-on: ubuntu-latest
    needs: clippy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - name: install eframe / egui Linux deps + clang + mold
        # `.cargo/config.toml` pins `linker = "clang"` with
        # `rustflags = ["-C", "link-arg=-fuse-ld=mold"]` for the Linux GNU
        # target. The runner's stock clang doesn't ship with mold so the
        # build fails with `invalid linker name in argument '-fuse-ld=mold'`
        # unless we install it here.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang mold \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: clean stale counter data
        run: cargo llvm-cov clean --workspace
      - name: cargo llvm-cov nextest -p sgw-launcher
        run: cargo llvm-cov --no-report nextest --profile=ci -p sgw-launcher
      - name: render cobertura report
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
      - name: print summary to job log
        run: |
          echo "## Launcher coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: launcher-coverage
          path: target/coverage/
          retention-days: 14
      - name: upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/cobertura.xml
          flags: launcher
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
