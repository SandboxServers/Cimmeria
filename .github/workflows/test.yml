name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — saves runner minutes when a
# PR gets force-pushed during review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri / GTK-using members of the workspace pull in heavy GUI deps and
  # have their own Linux-build prerequisites; keep them out of CI builds.
  WORKSPACE_EXCLUDES: >-
    --exclude cimmeria-app
    --exclude cimmeria-content-editor
    --exclude cimmeria-scene-editor
    --exclude sgw-launcher
  # Pinned to keep CI byte-identical with what setup.ps1 hydrates locally
  # (bootstrap/CimmeriaBootstrap/Data/Dependencies.psd1). Bumping requires
  # a coordinated change there.
  RECAST_VERSION: "1.6.0"

jobs:
  # cargo fmt is fast enough that we don't bother caching or installing
  # native deps. Fails the pipeline with a clear "run cargo fmt" message
  # instead of auto-fixing.
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error::Formatting differs from rustfmt. Run 'cargo fmt --all' locally and commit the result."
            exit 1
          fi

  # clippy with -D warnings. Project-level thresholds for too_many_arguments
  # and type_complexity live in clippy.toml at the repo root.
  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: cargo clippy
        run: |
          cargo clippy --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets -- -D warnings

  # cargo build catches link-time errors that cargo check misses (build
  # scripts, codegen output, dynamic-link issues).
  build:
    name: cargo build (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: cargo build
        run: cargo build --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets

  # cargo test (no DB). Live-DB tests in cimmeria-services use
  # test_support::require_db_or_skip! and self-skip when DATABASE_URL is
  # unset, so this job covers the unit + non-DB integration tests across
  # the whole workspace (mercury, content-engine, services unit tests, etc.).
  # The live-DB suite runs in the dedicated `test-live-db` job below.
  test:
    name: cargo test (workspace, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo test
        run: cargo test --workspace ${{ env.WORKSPACE_EXCLUDES }}

  # cargo test against a live Postgres. Schema is loaded from
  # db/database.sql (which `\ir`-includes everything in db/sgw and
  # db/resources, including seed data). The live-DB regression guards
  # we've written for vendor / inventory / progression / mail / missions
  # actually fire in this job — the prior `test` job's
  # require_db_or_skip! short-circuits without DATABASE_URL.
  #
  # --test-threads=1 because some live-DB tests share sentinel id ranges
  # and collide under parallel execution against a single shared DB.
  # That's a fixture-design constraint, not a bug in the handlers.
  test-live-db:
    name: cargo test -p cimmeria-services (live DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the bundled local Postgres in external/postgresql_server/.
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang + mold + psql
        run: sudo apt-get update && sudo apt-get install -y clang mold postgresql-client
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - name: load schema + seeds
        env:
          PGPASSWORD: w-testing
        run: |
          psql -h localhost -U w-testing -d sgw -v ON_ERROR_STOP=1 -f db/database.sql
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-live-db
      - name: cargo test (live DB)
        run: |
          cargo test -p cimmeria-services --lib -- --test-threads=1
