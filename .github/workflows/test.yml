name: ci

# Where the full suite runs (docs/agents/pre-pr-checks.md § Merge queue): main
# requires a merge queue, and the build + nextest + live-DB job runs in the queue
# (`merge_group`), on the exact code that lands. A PR push runs fmt, clippy and the
# quick jobs only; the `full-ci` label adds the full job to a PR (add it, then
# push: a `labeled` trigger would let an unrelated label's skipped run stand in
# for a gating check). The nightly schedule runs everything on main, coverage
# included. Nothing runs on push to main: every commit there came through the
# queue, except regen-docs' Markdown.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '23 9 * * *'   # nightly, 02:23 Pacific
  workflow_dispatch:

# Cancel superseded runs on the same PR branch — saves runner minutes when a
# PR gets force-pushed during review. A merge group's ref is unique to it, so
# a group the queue abandons keeps its run going to the end; keeping direct
# pushes to main rare (regen-docs every six hours) keeps those wasted runs rare.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner routing (tools/ci-runners/README.md): build jobs run on the self-hosted
# `cimmeria-linux` pool (five runners each on node5, node2 and node1) and the
# seconds-long jobs on `cimmeria-linux-quick` (two per node). Fork PRs and
# Dependabot PRs always get GitHub-hosted `ubuntu-latest`. Repository variables:
# CI_LINUX_RUNNER=hosted sends every job to GitHub-hosted runners; CI_HOSTED_JOBS
# (comma-separated job ids) sends just those; CI_OVERFLOW_MIN_IDLE (default 2) is
# how many idle build runners the `changes` job wants before it keeps a run's
# build jobs self-hosted rather than overflowing them to GitHub-hosted runners.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in CI's dev/test builds (Cargo.toml keeps line tables for local
  # builds). Every test binary is a crate sccache can't cache, so each one is
  # compiled and linked on every run; without debug info that is cheaper. A
  # panic still prints its file:line (that comes from the panic location, not
  # debug info); only multi-frame backtraces lose line numbers. Release builds
  # (docker/Dockerfile) are unaffected.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Tauri / GTK-using members of the workspace pull in heavy GUI deps and
  # have their own Linux-build prerequisites; keep them out of CI builds.
  WORKSPACE_EXCLUDES: >-
    --exclude cimmeria-app
    --exclude cimmeria-content-editor
    --exclude cimmeria-scene-editor
    --exclude sgw-launcher
    --exclude cimmeria-client-telemetry
    --exclude cimmeria-client-patches
    --exclude cimmeria-lab
  # Pinned to keep CI byte-identical with what setup.ps1 hydrates locally
  # (bootstrap/CimmeriaBootstrap/Data/Dependencies.psd1). Bumping requires
  # a coordinated change there.
  RECAST_VERSION: "1.6.0"

jobs:
  # Decides whether the Rust jobs run. A PR whose every changed file is
  # Markdown, agent config under .claude/, or an image under docs/ skips
  # them; a skipped job reports as passed. docs/protocol/ always counts as
  # code, because cimmeria-patch-wire's tests read the dispatch tables there,
  # and so does tools/token-profile/, whose contract tests read its Markdown.
  # The generated weapon-requirement audit doc counts as code: the
  # build-and-test job's `--check` is what catches a hand edit to it.
  # A merge group is judged by its diff against the queue's base. The nightly
  # and manual runs always run everything. Any doubt (API error, empty list,
  # the API's 3000-file cap) runs everything.
  #
  # Output `full` says whether the build + nextest + live-DB job runs: always in
  # a merge group and on the nightly/manual runs, and on a PR only with the
  # `full-ci` label. Docs-only changes skip it either way (`code`).
  #
  # It also picks the runner for this run's build jobs (output `linux`): the
  # self-hosted `cimmeria-linux` pool, or GitHub-hosted `ubuntu-latest` when
  # fewer than CI_OVERFLOW_MIN_IDLE (repo variable, default 2) of our build
  # runners are idle. Listing runners needs the RUNNER_STATUS_TOKEN secret (a
  # fine-grained token with Administration: read on this repo); without it, or if
  # the API call fails, the build jobs stay self-hosted. Per-job overrides:
  # CI_HOSTED_JOBS (repo variable, comma-separated job ids) sends those jobs to
  # GitHub-hosted runners; CI_LINUX_RUNNER=hosted sends every job.
  changes:
    name: detect code changes
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',changes,')) && 'ubuntu-latest' || 'cimmeria-linux-quick' }}
    permissions:
      contents: read        # the compare API, for a merge group's files
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      linux: ${{ steps.route.outputs.linux }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          MIN_IDLE: ${{ vars.CI_OVERFLOW_MIN_IDLE || '2' }}
          REPO: ${{ github.repository }}
        run: |
          runner=cimmeria-linux
          if [ -n "$GH_TOKEN" ] && idle="$(gh api "repos/$REPO/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status == "online" and (.busy | not) and ([.labels[].name] | index("cimmeria-linux")))] | length')"; then
            echo "idle cimmeria-linux runners: $idle (overflow below $MIN_IDLE)"
            if [ "$idle" -lt "$MIN_IDLE" ]; then
              runner=ubuntu-latest
              echo "::notice::Only $idle of our build runners are idle; this run's build jobs use GitHub-hosted runners."
            fi
          else
            echo "runner status unavailable; build jobs stay on cimmeria-linux"
          fi
          echo "linux=$runner" >> "$GITHUB_OUTPUT"
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          files=""
          cap=0   # the API's file-list cap: a list that reaches it may be cut short
          case "$EVENT" in
            pull_request) cap=3000; files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')" || files="" ;;
            merge_group) cap=300; files="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename')" || files="" ;;
          esac
          if [ -n "$files" ] && [ "$(echo "$files" | wc -l)" -lt "$cap" ]; then
            nocode='\.md$|^\.claude/|^docs/.*\.(svg|png|jpe?g|gif)$'
            if ! echo "$files" | grep -Ev "$nocode" | grep -q . \
              && ! echo "$files" | grep -q '^docs/protocol/' \
              && ! echo "$files" | grep -q '^docs/analysis/class-start-v6/weapon-requirement-audit\.md$' \
              && ! echo "$files" | grep -q '^tools/token-profile/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "::notice::Only docs and agent config changed; skipping the Rust jobs."
          fi

  # cargo fmt is fast enough that we don't bother caching or installing
  # native deps. Fails the pipeline with a clear "run cargo fmt" message
  # instead of auto-fixing.
  fmt:
    name: cargo fmt --check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',fmt,')) && 'ubuntu-latest' || 'cimmeria-linux-quick' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error::Formatting differs from rustfmt. Run 'cargo fmt --all' locally and commit the result."
            exit 1
          fi

  # clippy with -D warnings. Project-level thresholds for too_many_arguments
  # and type_complexity live in clippy.toml at the repo root.
  clippy:
    name: cargo clippy -D warnings
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',clippy,')) && 'ubuntu-latest' || needs.changes.outputs.linux || 'cimmeria-linux' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - name: install clang + mold
        run: for c in clang mold; do command -v "$c" > /dev/null || { sudo apt-get update && sudo apt-get install -y clang mold || exit 1; break; }; done
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        # Self-hosted runners keep a warm sccache instead (tools/ci-runners/).
        if: runner.environment == 'github-hosted'
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: |
          cargo clippy --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets -- -D warnings

  # One job builds the workspace and runs the tests. `cargo build
  # --all-targets` catches link-time errors that cargo check misses (build
  # scripts, codegen output, dynamic-link issues), and it compiles the test
  # binaries in the `test` profile, so the nextest run that follows reuses
  # them instead of compiling the workspace a second time on another runner.
  #
  # cargo nextest (no DB): live-DB tests use test_support::require_db_or_skip!
  # and self-skip when DATABASE_URL is unset, so this covers the unit + non-DB
  # integration tests across the whole workspace. The live-DB suite follows in
  # the same job (see below).
  #
  # nextest emits JUnit XML at target/nextest/ci/junit.xml (configured in
  # .config/nextest.toml); the upload step feeds it to Codecov Test
  # Analytics for per-test history and flake detection.
  #
  # nextest cannot run doctests (upstream limitation: nextest-rs/nextest#16),
  # so they run separately via `cargo test --doc` after the main pass. Only
  # cimmeria-commands has runnable doctests today; the rest of the workspace
  # uses ```text / ```ignore fences that don't compile.
  #
  # The live-DB suite runs in this job too, after the no-DB pass, on the same
  # test binaries. It used to be a separate job that compiled them again, and
  # test binaries are the part of a build sccache can't cache. Schema is loaded
  # from db/database.sql (which `\ir`-includes everything in db/sgw and
  # db/resources, including seed data). tools/test-live-db.sh holds the list of
  # crates with live-DB tests and runs all of them in one nextest invocation,
  # so a crate split out of cimmeria-services cannot silently drop out (#615).
  # The schema loads into `sgw` in the background while the workspace compiles
  # (tools/live-db-schema-load.sh). tools/test-live-db.sh then clones `sgw` into
  # sgw_0 .. sgw_<N-1> (N = the `live-db` test group's max-threads in
  # .config/nextest.toml), and the `ci-live-db` profile runs the tests whose
  # name contains `live_db` up to N at once, each on its group slot's own
  # clone. Some live-DB tests share sentinel id ranges in resources.* and would
  # collide in one database, so DATABASE_URL is set on the live-DB steps only:
  # the no-DB pass must not see it, or every live-DB test would run against the
  # one template database. Guard tests in cimmeria-test-support fail when a
  # test that reaches require_db_or_skip! lacks the `live_db` marker, or when
  # test code reads DATABASE_URL around the slot resolver.
  #
  # It runs in the merge queue, nightly, and on a PR labelled `full-ci`
  # (output `full`). On other PR pushes it reports `skipped`, which the
  # required check and tools/build-lane/ship.py count as passing there; the
  # queue then runs it on the merged result before anything lands.
  build-and-test:
    name: cargo build + nextest (workspace + live DB)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',build-and-test,')) && 'ubuntu-latest' || needs.changes.outputs.linux || 'cimmeria-linux' }}
    timeout-minutes: 75
    services:
      postgres:
        # Match the bundled local Postgres in external/postgresql_server/.
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
          # A throwaway CI database needs no durability: skip initdb's sync and run the
          # server without fsync. On a runner sharing a busy disk, initdb's sync and then
          # the entrypoint's shutdown checkpoint outlasted the health check and pg_ctl's
          # 60 s stop timeout (WC-16 worknote). initdb -c sets postgresql.conf (PG 16+).
          POSTGRES_INITDB_ARGS: --no-sync -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The generated effect NVP blocks in db/resources/Effects/Seed/ match
      # what the ability-mechanics generator writes (D-AB06), the CS-07
      # weapon-requirement audit doc matches the seeds, and their tests pass.
      # Stock Python; runs before the seed this job loads.
      - name: ability-mechanics generators (unit tests + --check)
        run: |
          python3 -m unittest discover -s tools/ability_mechanics -p "test_*.py"
          python3 tools/ability_mechanics/effect_nvps_from_desc.py --check
          python3 tools/ability_mechanics/weapon_requirement_audit.py --check
      - name: install clang + mold + psql
        run: for c in clang mold psql; do command -v "$c" > /dev/null || { sudo apt-get update && sudo apt-get install -y clang mold postgresql-client || exit 1; break; }; done
      - name: start schema + seeds load (background)
        # Loads db/database.sql into `sgw`, the template of the per-slot
        # clones, while the steps below compile. It outlives this step; the
        # wait step below fails the job, printing psql's log, if it failed.
        run: bash tools/live-db-schema-load.sh start
        env:
          DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
      - name: build-lane job log tests
        run: python3 -m unittest discover -s tools/build-lane -p "test_*.py"
      - name: docs-gen tests
        run: python3 -m unittest discover -s tools/docs-gen -p "test_*.py"
      - name: token-profile contract and ingest tests
        run: python3 -m unittest discover -s tools/token-profile -p "test_*.py"
      - name: CI runner egress proxy tests
        run: python3 -m unittest discover -s tools/ci-runners -p "test_*.py"
      # AB-C7: every ability method is accounted for on each side it travels
      # (or excused in the script), and the committed matrix is current. Fix
      # with `python tools/telemetry-coverage/abilities.py`.
      - name: ability telemetry coverage (unit tests + --check)
        run: |
          python3 -m unittest discover -s tools/telemetry-coverage -p "test_*.py"
          python3 tools/telemetry-coverage/abilities.py --check
      - uses: ./.github/actions/rust-toolchain
      # Generated doc blocks (test counts, crate graph, ...) are regenerated on
      # main by regen-docs.yml after the merge, so a stale block never fails a PR.
      # This only lists what the merge will change.
      - name: generated doc blocks (informational)
        run: |
          python3 tools/docs-gen/regen.py --check \
            || echo "::notice::regen-docs will update the generated doc blocks listed above after this merges"
      # crates/workspace-hack unifies third-party features so `-p` builds reuse
      # the workspace's dependency artifacts (docs/architecture/build-system.md
      # §6). Fail when a dependency change didn't regenerate it: fix with
      # `cargo hakari generate && cargo hakari manage-deps --yes`.
      - name: install cargo-hakari + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari,nextest
      - name: workspace-hack is current
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
          cargo hakari verify
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        # Self-hosted runners keep a warm sccache instead (tools/ci-runners/).
        if: runner.environment == 'github-hosted'
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build
        run: cargo build --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets
      - name: cargo nextest run
        run: cargo nextest run --profile=ci --workspace ${{ env.WORKSPACE_EXCLUDES }}
      - name: cargo test --doc (cimmeria-commands)
        run: cargo test --doc -p cimmeria-commands
      # The live-DB suite, on the test binaries built above (the build-only
      # pass only compiles what `-p` feature resolution changes, if anything).
      # `!cancelled()`: a failing no-DB pass still gets its live-DB results, as
      # when the two tiers were separate jobs.
      - name: build live-DB test binaries
        if: ${{ !cancelled() }}
        run: bash tools/test-live-db.sh --build-only
      - name: wait for schema + seeds load
        if: ${{ !cancelled() }}
        run: bash tools/live-db-schema-load.sh wait 300
      - name: cargo nextest run (live DB)
        if: ${{ !cancelled() }}
        run: bash tools/test-live-db.sh
        env:
          DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
      - name: upload test results to Codecov
        # `!cancelled()` runs this step on both success and failure (but not
        # on cancellation), so failing tests still get their JUnit uploaded
        # for Test Analytics annotations on the PR.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results
          flags: workspace
          fail_ci_if_error: false
      - name: upload live-DB test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci-live-db/junit.xml
          report_type: test_results
          flags: live-db
          fail_ci_if_error: false

  # Logic UAT for the client UI overlay (BM-05): loads the patched
  # BlackMarket.lua in stock Lua 5.1 against stubbed CEGUI windows and a
  # stubbed client-patch DLL. Seconds to run; no Rust involved.
  overlay-lua:
    name: client UI overlay logic UAT (Lua 5.1)
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',overlay-lua,')) && 'ubuntu-latest' || 'cimmeria-linux-quick' }}
    steps:
      - uses: actions/checkout@v7
      - name: install lua5.1
        run: for c in lua5.1; do command -v "$c" > /dev/null || { sudo apt-get update && sudo apt-get install -y lua5.1 || exit 1; break; }; done
      - name: run the overlay logic UAT
        run: lua5.1 crates/client-patches/overlay/test/run.lua
      # 009-starter-hotbar's hook against a clean-room model of the
      # ActionButtons module; the stock and WQHD v26 variants need a client
      # and run locally (data/client-patches/009-starter-hotbar/test/run.lua).
      - name: run the starter hotbar logic UAT
        run: lua5.1 data/client-patches/009-starter-hotbar/test/run.lua
      # 015-weapon-shot-bar's block, appended after 009's hook, against the
      # same clean-room model (it reads 009's stubs and model).
      - name: run the weapon shot bar logic UAT
        run: lua5.1 data/client-patches/015-weapon-shot-bar/test/run.lua
      # 016-hotbar-learn-and-feedback's block after 009's and 015's, and 015's
      # scenarios again with 016's block appended (016 must not break them).
      - name: run the hotbar learn and feedback logic UAT
        run: lua5.1 data/client-patches/016-hotbar-learn-and-feedback/test/run.lua
      - name: run the weapon shot bar logic UAT with 016 appended
        run: lua5.1 data/client-patches/015-weapon-shot-bar/test/run.lua
        env:
          WEAPON_SHOT_BAR_APPEND: data/client-patches/016-hotbar-learn-and-feedback/HotbarLearnAndFeedback.lua
      # 012-gm-slash-commands: the committed XML must be what the generator
      # makes from commands.toml (the Rust tests pin the zip to that XML).
      - name: check the generated GM slash command XML is current
        run: python3 tools/client-patches/gm_slash_commands.py --check

  # The one required check in main's ruleset. A job whose `needs` failed is
  # skipped, and a skipped required check passes, so requiring fmt, clippy and
  # build-and-test directly would let a merge group land untested whenever the
  # `changes` job itself failed. This job always runs and passes only when
  # `changes` succeeded and every gating job succeeded or was skipped by design.
  gate:
    name: ci gate
    needs: [changes, fmt, clippy, build-and-test]
    if: always()
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',gate,')) && 'ubuntu-latest' || 'cimmeria-linux-quick' }}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] != "success" and not (k != "changes" and v["result"] == "skipped")}
          for k, r in bad.items():
              print(f"::error::{k}: {r}")
          sys.exit(1 if bad else 0)
          PY

  # The nightly run is main's own check: everything landed through the queue,
  # so a failure here is drift (a flake, a toolchain or service change) or a
  # gap the queue missed. tools/main-red/main-red.sh opens a `main-red` issue,
  # which stops ship.py merging code until a passing night closes it.
  nightly-report:
    name: report the nightly run
    needs: [changes, fmt, clippy, build-and-test, overlay-lua]
    # A manual dispatch on main reports too, so a fix can clear the issue without
    # waiting for the next night.
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ${{ (vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',nightly-report,')) && 'ubuntu-latest' || 'cimmeria-linux-quick' }}
    permissions:
      contents: read   # actions/checkout
      issues: write    # the main-red issue
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/main-red
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Anything but success or skipped (failure, cancelled, timed out) is a fail.
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: bash tools/main-red/main-red.sh "$([ "$FAILED" = true ] && echo fail || echo pass)" "nightly ci" "$RUN"

  # Coverage, in two jobs that run at the same time: the workspace pass
  # without a DB, and the live-DB crates' lib tests (tools/test-live-db.sh
  # --llvm-cov) against a live Postgres. Most of each job is compiling
  # instrumented code, so splitting further would repeat that compile for
  # little gain. Each job renders and uploads its own report; Codecov merges
  # the two uploads for the commit. JUnit upload stays with the
  # build-and-test job to avoid double-counting in Test Analytics.
  #
  # Non-blocking: continue-on-error so a coverage-tool flake doesn't gate
  # merges. The artifacts and summaries are advisory.
  #
  # Nightly on main (and workflow_dispatch), not per merge or per PR: each job
  # rebuilds the workspace instrumented, two full builds for a report that
  # never gates a merge. It ran on every push to main until 2026-10-11, when
  # ~180 merges a day made it the self-hosted pool's second-largest load. A PR
  # that wants its own report gets the `coverage` label; add it, then push,
  # because a re-run reuses the labels the run started with.
  coverage-workspace:
    name: cargo llvm-cov (workspace, no DB)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'coverage'))
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',coverage-workspace,')) && 'ubuntu-latest' || needs.changes.outputs.linux || 'cimmeria-linux' }}
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - name: install clang + mold
        run: for c in clang mold; do command -v "$c" > /dev/null || { sudo apt-get update && sudo apt-get install -y clang mold || exit 1; break; }; done
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3             -o /tmp/recast.zip             "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        # Self-hosted runners keep a warm sccache instead (tools/ci-runners/).
        if: runner.environment == 'github-hosted'
        with:
          shared-key: coverage-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - name: clean stale counter data
        run: cargo llvm-cov clean --workspace
      - name: workspace pass (no DB)
        run: |
          cargo llvm-cov --no-report nextest             --profile=ci --workspace ${{ env.WORKSPACE_EXCLUDES }}
      - name: render reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --html --output-dir target/coverage/html
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
      - name: print summary to job log
        run: |
          echo "## Coverage summary (workspace, no DB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-workspace
          path: target/coverage/
          retention-days: 14
      - name: upload to Codecov
        # Codecov merges this upload with the other coverage job's upload for
        # the same commit (codecov.yml waits for both via after_n_builds).
        # CODECOV_TOKEN is required even for public repos. Fork PRs don't see
        # the secret and skip the upload (the action exits 0 without a token).
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/cobertura.xml
          flags: coverage-workspace
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  coverage-live-db:
    name: cargo llvm-cov (live DB)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'coverage'))
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || vars.CI_LINUX_RUNNER == 'hosted' || contains(format(',{0},', vars.CI_HOSTED_JOBS), ',coverage-live-db,')) && 'ubuntu-latest' || needs.changes.outputs.linux || 'cimmeria-linux' }}
    timeout-minutes: 75
    continue-on-error: true
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
          # A throwaway CI database needs no durability: skip initdb's sync and run the
          # server without fsync. On a runner sharing a busy disk, initdb's sync and then
          # the entrypoint's shutdown checkpoint outlasted the health check and pg_ctl's
          # 60 s stop timeout (WC-16 worknote). initdb -c sets postgresql.conf (PG 16+).
          POSTGRES_INITDB_ARGS: --no-sync -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - name: install clang + mold + psql
        run: for c in clang mold psql; do command -v "$c" > /dev/null || { sudo apt-get update && sudo apt-get install -y clang mold postgresql-client || exit 1; break; }; done
      - name: start schema + seeds load (background)
        # As in build-and-test: `sgw` loads while the instrumented build runs.
        run: bash tools/live-db-schema-load.sh start
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3             -o /tmp/recast.zip             "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        # Self-hosted runners keep a warm sccache instead (tools/ci-runners/).
        if: runner.environment == 'github-hosted'
        with:
          shared-key: coverage-live-db
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - name: clean stale counter data
        run: cargo llvm-cov clean --workspace
      - name: build live-DB test binaries (instrumented)
        run: bash tools/test-live-db.sh --llvm-cov --build-only
      - name: wait for schema + seeds load
        run: bash tools/live-db-schema-load.sh wait 300
      - name: live-DB pass
        run: bash tools/test-live-db.sh --llvm-cov
      - name: render reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --html --output-dir target/coverage/html
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
      - name: print summary to job log
        run: |
          echo "## Coverage summary (live DB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-live-db
          path: target/coverage/
          retention-days: 14
      - name: upload to Codecov
        # Codecov merges this upload with the other coverage job's upload for
        # the same commit (codecov.yml waits for both via after_n_builds).
        # CODECOV_TOKEN is required even for public repos. Fork PRs don't see
        # the secret and skip the upload (the action exits 0 without a token).
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/cobertura.xml
          flags: coverage-live-db
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
