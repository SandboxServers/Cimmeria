name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — saves runner minutes when a
# PR gets force-pushed during review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri / GTK-using members of the workspace pull in heavy GUI deps and
  # have their own Linux-build prerequisites; keep them out of CI builds.
  WORKSPACE_EXCLUDES: >-
    --exclude cimmeria-app
    --exclude cimmeria-content-editor
    --exclude cimmeria-scene-editor
    --exclude sgw-launcher
  # Pinned to keep CI byte-identical with what setup.ps1 hydrates locally
  # (bootstrap/CimmeriaBootstrap/Data/Dependencies.psd1). Bumping requires
  # a coordinated change there.
  RECAST_VERSION: "1.6.0"

jobs:
  # cargo fmt is fast enough that we don't bother caching or installing
  # native deps. Fails the pipeline with a clear "run cargo fmt" message
  # instead of auto-fixing.
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error::Formatting differs from rustfmt. Run 'cargo fmt --all' locally and commit the result."
            exit 1
          fi

  # clippy with -D warnings. Project-level thresholds for too_many_arguments
  # and type_complexity live in clippy.toml at the repo root.
  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: cargo clippy
        run: |
          cargo clippy --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets -- -D warnings

  # cargo build catches link-time errors that cargo check misses (build
  # scripts, codegen output, dynamic-link issues).
  build:
    name: cargo build (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: cargo build
        run: cargo build --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets

  # cargo nextest (no DB). Live-DB tests in cimmeria-services use
  # test_support::require_db_or_skip! and self-skip when DATABASE_URL is
  # unset, so this job covers the unit + non-DB integration tests across
  # the whole workspace (mercury, content-engine, services unit tests, etc.).
  # The live-DB suite runs in the dedicated `test-live-db` job below.
  #
  # nextest emits JUnit XML at target/nextest/ci/junit.xml (configured in
  # .config/nextest.toml); the upload step feeds it to Codecov Test
  # Analytics for per-test history and flake detection.
  #
  # nextest cannot run doctests (upstream limitation: nextest-rs/nextest#16),
  # so they run separately via `cargo test --doc` after the main pass. Only
  # cimmeria-commands has runnable doctests today; the rest of the workspace
  # uses ```text / ```ignore fences that don't compile.
  test:
    name: cargo nextest (workspace, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo nextest run
        run: cargo nextest run --profile=ci --workspace ${{ env.WORKSPACE_EXCLUDES }}
      - name: cargo test --doc (cimmeria-commands)
        run: cargo test --doc -p cimmeria-commands
      - name: upload test results to Codecov
        # `!cancelled()` runs this step on both success and failure (but not
        # on cancellation), so failing tests still get their JUnit uploaded
        # for Test Analytics annotations on the PR.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results
          flags: workspace
          fail_ci_if_error: false

  # cargo nextest against a live Postgres. Schema is loaded from
  # db/database.sql (which `\ir`-includes everything in db/sgw and
  # db/resources, including seed data). The live-DB regression guards
  # we've written for vendor / inventory / progression / mail / missions
  # actually fire in this job — the prior `test` job's
  # require_db_or_skip! short-circuits without DATABASE_URL.
  #
  # The `ci-live-db` profile in .config/nextest.toml serialises every
  # test (threads-required = "num-test-threads"). Some live-DB tests share
  # sentinel id ranges in resources.* and collide under parallel
  # execution against a single shared DB; that's a fixture-design
  # constraint, not a bug in the handlers.
  test-live-db:
    name: cargo nextest -p cimmeria-services (live DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the bundled local Postgres in external/postgresql_server/.
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: install clang + mold + psql
        run: sudo apt-get update && sudo apt-get install -y clang mold postgresql-client
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - name: load schema + seeds
        env:
          PGPASSWORD: w-testing
        run: |
          psql -h localhost -U w-testing -d sgw -v ON_ERROR_STOP=1 -f db/database.sql
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-live-db
      - name: cargo nextest run (live DB)
        run: cargo nextest run --profile=ci-live-db -p cimmeria-services --lib
      - name: upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci-live-db/junit.xml
          report_type: test_results
          flags: live-db
          fail_ci_if_error: false

  # Coverage report. Same matrix as the test + test-live-db jobs combined,
  # instrumented under cargo-llvm-cov. Two passes share counter data via
  # `--no-report`: the workspace pass picks up unit + non-DB integration
  # coverage, the second pass runs `-p cimmeria-services --lib` against a
  # live Postgres so the require_db_or_skip! guards actually count.
  # `cargo llvm-cov report` then merges them into one HTML/cobertura/summary.
  #
  # Both passes drive nextest under llvm-cov so a single test execution
  # produces both coverage counter data and the (unused here — the
  # `test`/`test-live-db` jobs own JUnit upload) per-test JUnit. Keeping
  # JUnit upload off this job avoids double-counting in Codecov Test
  # Analytics.
  #
  # Non-blocking: continue-on-error so a coverage-tool flake doesn't gate
  # merges. The artifact + summary log are advisory — the PR-gating signal
  # is still test/test-live-db turning green.
  coverage:
    name: cargo llvm-cov (workspace + live DB)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: install clang + mold + psql
        run: sudo apt-get update && sudo apt-get install -y clang mold postgresql-client
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - name: load schema + seeds
        env:
          PGPASSWORD: w-testing
        run: |
          psql -h localhost -U w-testing -d sgw -v ON_ERROR_STOP=1 -f db/database.sql
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: clean stale counter data
        run: cargo llvm-cov clean --workspace
      - name: workspace pass (no DB)
        # DATABASE_URL is set on the job, but we deliberately unset it here so
        # the live-DB tests skip in this pass — they're owned by the second
        # pass below, which serialises via the ci-live-db nextest profile.
        env:
          DATABASE_URL: ""
        run: |
          cargo llvm-cov --no-report nextest \
            --profile=ci --workspace ${{ env.WORKSPACE_EXCLUDES }}
      - name: services live-DB pass
        run: |
          cargo llvm-cov --no-report nextest \
            --profile=ci-live-db -p cimmeria-services --lib
      - name: render reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --html --output-dir target/coverage/html
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
      - name: print summary to job log
        run: |
          echo "## Coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 14
      - name: upload to Codecov
        # Codecov ingests cobertura.xml, posts a sticky PR comment with delta
        # vs main, and renders the per-file coverage overlay in GitHub's
        # Files-Changed tab. Settings (advisory vs blocking, drop tolerance,
        # path ignores) live in codecov.yml at the repo root.
        #
        # CODECOV_TOKEN is required even for public repos — Codecov disabled
        # tokenless uploads. Fork PRs won't see the secret and will skip the
        # upload (the action exits 0 when no token is present); coverage
        # deltas for fork PRs come via Codecov's GitHub App on the merge
        # commit instead.
        uses: codecov/codecov-action@v6
        with:
          files: target/coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
