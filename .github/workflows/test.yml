name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR branch — saves runner minutes when a
# PR gets force-pushed during review. Runs on main are never cancelled: a
# cancelled run doesn't save its rust-cache, and main's caches are the ones
# every PR restores (see `save-if` on each rust-cache step).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri / GTK-using members of the workspace pull in heavy GUI deps and
  # have their own Linux-build prerequisites; keep them out of CI builds.
  WORKSPACE_EXCLUDES: >-
    --exclude cimmeria-app
    --exclude cimmeria-content-editor
    --exclude cimmeria-scene-editor
    --exclude sgw-launcher
    --exclude cimmeria-client-telemetry
    --exclude cimmeria-client-patches
    --exclude cimmeria-lab
  # Pinned to keep CI byte-identical with what setup.ps1 hydrates locally
  # (bootstrap/CimmeriaBootstrap/Data/Dependencies.psd1). Bumping requires
  # a coordinated change there.
  RECAST_VERSION: "1.6.0"

jobs:
  # Decides whether the Rust jobs run. A PR whose every changed file is
  # Markdown, agent config under .claude/, or an image under docs/ skips
  # them; a skipped job reports as passed. docs/protocol/ always counts as
  # code, because cimmeria-patch-wire's tests read the dispatch tables there,
  # and so does tools/token-profile/, whose contract tests read its Markdown.
  # Pushes to main always run everything. Any doubt (API error, empty list,
  # the API's 3000-file cap) runs everything.
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] \
            && files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')" \
            && [ -n "$files" ] && [ "$(echo "$files" | wc -l)" -lt 3000 ]; then
            nocode='\.md$|^\.claude/|^docs/.*\.(svg|png|jpe?g|gif)$'
            if ! echo "$files" | grep -Ev "$nocode" | grep -q . \
              && ! echo "$files" | grep -q '^docs/protocol/' \
              && ! echo "$files" | grep -q '^tools/token-profile/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "::notice::Only docs and agent config changed; skipping the Rust jobs."
          fi

  # cargo fmt is fast enough that we don't bother caching or installing
  # native deps. Fails the pipeline with a clear "run cargo fmt" message
  # instead of auto-fixing.
  fmt:
    name: cargo fmt --check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error::Formatting differs from rustfmt. Run 'cargo fmt --all' locally and commit the result."
            exit 1
          fi

  # clippy with -D warnings. Project-level thresholds for too_many_arguments
  # and type_complexity live in clippy.toml at the repo root.
  clippy:
    name: cargo clippy -D warnings
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: |
          cargo clippy --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets -- -D warnings

  # One job builds the workspace and runs the tests. `cargo build
  # --all-targets` catches link-time errors that cargo check misses (build
  # scripts, codegen output, dynamic-link issues), and it compiles the test
  # binaries in the `test` profile, so the nextest run that follows reuses
  # them instead of compiling the workspace a second time on another runner.
  #
  # cargo nextest (no DB): live-DB tests use test_support::require_db_or_skip!
  # and self-skip when DATABASE_URL is unset, so this covers the unit + non-DB
  # integration tests across the whole workspace. The live-DB suite runs in
  # the dedicated `test-live-db` job below.
  #
  # nextest emits JUnit XML at target/nextest/ci/junit.xml (configured in
  # .config/nextest.toml); the upload step feeds it to Codecov Test
  # Analytics for per-test history and flake detection.
  #
  # nextest cannot run doctests (upstream limitation: nextest-rs/nextest#16),
  # so they run separately via `cargo test --doc` after the main pass. Only
  # cimmeria-commands has runnable doctests today; the rest of the workspace
  # uses ```text / ```ignore fences that don't compile.
  build-and-test:
    name: cargo build + nextest (workspace, no DB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: build-lane job log tests
        run: python3 -m unittest discover -s tools/build-lane -p "test_*.py"
      - name: docs-gen tests
        run: python3 -m unittest discover -s tools/docs-gen -p "test_*.py"
      - name: token-profile contract and ingest tests
        run: python3 -m unittest discover -s tools/token-profile -p "test_*.py"
      - uses: ./.github/actions/rust-toolchain
      # Generated doc blocks (test counts, crate graph, ...) are regenerated on
      # main by regen-docs.yml after the merge, so a stale block never fails a PR.
      # This only lists what the merge will change.
      - name: generated doc blocks (informational)
        run: |
          python3 tools/docs-gen/regen.py --check \
            || echo "::notice::regen-docs will update the generated doc blocks listed above after this merges"
      # crates/workspace-hack unifies third-party features so `-p` builds reuse
      # the workspace's dependency artifacts (docs/architecture/build-system.md
      # §6). Fail when a dependency change didn't regenerate it: fix with
      # `cargo hakari generate && cargo hakari manage-deps --yes`.
      - name: install cargo-hakari + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari,nextest
      - name: workspace-hack is current
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
          cargo hakari verify
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build
        run: cargo build --workspace ${{ env.WORKSPACE_EXCLUDES }} --all-targets
      - name: cargo nextest run
        run: cargo nextest run --profile=ci --workspace ${{ env.WORKSPACE_EXCLUDES }}
      - name: cargo test --doc (cimmeria-commands)
        run: cargo test --doc -p cimmeria-commands
      - name: upload test results to Codecov
        # `!cancelled()` runs this step on both success and failure (but not
        # on cancellation), so failing tests still get their JUnit uploaded
        # for Test Analytics annotations on the PR.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results
          flags: workspace
          fail_ci_if_error: false

  # Logic UAT for the client UI overlay (BM-05): loads the patched
  # BlackMarket.lua in stock Lua 5.1 against stubbed CEGUI windows and a
  # stubbed client-patch DLL. Seconds to run; no Rust involved.
  overlay-lua:
    name: client UI overlay logic UAT (Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install lua5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: run the overlay logic UAT
        run: lua5.1 crates/client-patches/overlay/test/run.lua

  # cargo nextest against a live Postgres. Schema is loaded from
  # db/database.sql (which `\ir`-includes everything in db/sgw and
  # db/resources, including seed data). The live-DB regression guards
  # we've written for vendor / inventory / progression / mail / missions
  # actually fire in this job — the prior `test` job's
  # require_db_or_skip! short-circuits without DATABASE_URL.
  #
  # tools/test-live-db.sh holds the list of crates with live-DB tests and
  # runs all of them in one nextest invocation, so a crate split out of
  # cimmeria-services cannot silently drop out of this job (#615). The job
  # name still says `-p cimmeria-services` so a required status check keyed
  # on it keeps matching; the split's final wave renames it.
  #
  # The schema loads into `sgw` in the background while the test binaries
  # compile (tools/live-db-schema-load.sh, then test-live-db.sh
  # --build-only). tools/test-live-db.sh then clones `sgw` into sgw_0 ..
  # sgw_<N-1> (N = the `live-db` test group's max-threads in
  # .config/nextest.toml), and the `ci-live-db` profile runs the tests whose
  # name contains `live_db` up to N at once, each on its group slot's own
  # clone, and every other test in parallel. Some live-DB tests share
  # sentinel id ranges in resources.* and would collide in one database;
  # that's a fixture-design constraint, not a bug in the handlers. Guard
  # tests in cimmeria-test-support fail when a test that reaches
  # require_db_or_skip! lacks the `live_db` marker, or when test code reads
  # DATABASE_URL around the slot resolver.
  test-live-db:
    name: cargo nextest -p cimmeria-services (live DB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # Match the bundled local Postgres in external/postgresql_server/.
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
    steps:
      - uses: actions/checkout@v7
      # The generated effect NVP blocks in db/resources/Effects/Seed/ match
      # what the ability-mechanics generator writes (D-AB06), and its parser
      # tests pass. Stock Python; runs before the seed this job loads.
      - name: effect NVP generator (unit tests + --check)
        run: |
          python3 -m unittest discover -s tools/ability_mechanics -p "test_*.py"
          python3 tools/ability_mechanics/effect_nvps_from_desc.py --check
      - uses: ./.github/actions/rust-toolchain
      - name: install clang + mold + psql
        run: sudo apt-get update && sudo apt-get install -y clang mold postgresql-client
      - name: start schema + seeds load (background)
        # Loads db/database.sql into `sgw`, the template of the per-slot
        # clones, while the steps below compile. It outlives this step; the
        # wait step below fails the job, printing psql's log, if it failed.
        run: bash tools/live-db-schema-load.sh start
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3 \
            -o /tmp/recast.zip \
            "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-live-db
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build live-DB test binaries
        run: bash tools/test-live-db.sh --build-only
      - name: wait for schema + seeds load
        run: bash tools/live-db-schema-load.sh wait 300
      - name: cargo nextest run (live DB)
        run: bash tools/test-live-db.sh
      - name: upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci-live-db/junit.xml
          report_type: test_results
          flags: live-db
          fail_ci_if_error: false

  # Coverage, in two jobs that run at the same time: the workspace pass
  # without a DB, and the live-DB crates' lib tests (tools/test-live-db.sh
  # --llvm-cov) against a live Postgres. Most of each job is compiling
  # instrumented code, so splitting further would repeat that compile for
  # little gain. Each job renders and uploads its own report; Codecov merges
  # the two uploads for the commit. JUnit upload stays with the
  # build-and-test/test-live-db jobs to avoid double-counting in Test
  # Analytics.
  #
  # Non-blocking: continue-on-error so a coverage-tool flake doesn't gate
  # merges. The artifacts and summaries are advisory.
  coverage-workspace:
    name: cargo llvm-cov (workspace, no DB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - name: install clang + mold
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3             -o /tmp/recast.zip             "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - name: clean stale counter data
        run: cargo llvm-cov clean --workspace
      - name: workspace pass (no DB)
        run: |
          cargo llvm-cov --no-report nextest             --profile=ci --workspace ${{ env.WORKSPACE_EXCLUDES }}
      - name: render reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --html --output-dir target/coverage/html
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
      - name: print summary to job log
        run: |
          echo "## Coverage summary (workspace, no DB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-workspace
          path: target/coverage/
          retention-days: 14
      - name: upload to Codecov
        # Codecov merges this upload with the other coverage job's upload for
        # the same commit (codecov.yml waits for both via after_n_builds).
        # CODECOV_TOKEN is required even for public repos. Fork PRs don't see
        # the secret and skip the upload (the action exits 0 without a token).
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/cobertura.xml
          flags: coverage-workspace
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  coverage-live-db:
    name: cargo llvm-cov (live DB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: w-testing
          POSTGRES_PASSWORD: w-testing
          POSTGRES_DB: sgw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://w-testing:w-testing@localhost:5432/sgw
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - name: install clang + mold + psql
        run: sudo apt-get update && sudo apt-get install -y clang mold postgresql-client
      - name: start schema + seeds load (background)
        # As in test-live-db: `sgw` loads while the instrumented build runs.
        run: bash tools/live-db-schema-load.sh start
      - name: hydrate external/recast
        run: |
          mkdir -p external
          curl -sL --retry 3             -o /tmp/recast.zip             "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v${RECAST_VERSION}.zip"
          unzip -q /tmp/recast.zip -d /tmp/recast_extract
          mv "/tmp/recast_extract/recastnavigation-${RECAST_VERSION}" external/recast
          test -f external/recast/Detour/Source/DetourAssert.cpp
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-live-db
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - name: clean stale counter data
        run: cargo llvm-cov clean --workspace
      - name: build live-DB test binaries (instrumented)
        run: bash tools/test-live-db.sh --llvm-cov --build-only
      - name: wait for schema + seeds load
        run: bash tools/live-db-schema-load.sh wait 300
      - name: live-DB pass
        run: bash tools/test-live-db.sh --llvm-cov
      - name: render reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --html --output-dir target/coverage/html
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
      - name: print summary to job log
        run: |
          echo "## Coverage summary (live DB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-live-db
          path: target/coverage/
          retention-days: 14
      - name: upload to Codecov
        # Codecov merges this upload with the other coverage job's upload for
        # the same commit (codecov.yml waits for both via after_n_builds).
        # CODECOV_TOKEN is required even for public repos. Fork PRs don't see
        # the secret and skip the upload (the action exits 0 without a token).
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/cobertura.xml
          flags: coverage-live-db
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
