# Development builds run natively on Windows with the default MSVC target (rust-lld,
# below). CI builds on Linux runners. There is no cross-compile target; see
# docs/architecture/build-system.md. Build parallelism is not set here: the build lane
# (tools/build-lane/lane.sh) sets CARGO_BUILD_JOBS per build from the core and slot counts.

[alias]
test-workspace = "test --workspace --exclude cimmeria-app --exclude cimmeria-content-editor --exclude cimmeria-scene-editor --exclude sgw-launcher --exclude cimmeria-client-telemetry --exclude cimmeria-lab"

# Linux (CI runners): clang with the mold linker for faster links.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Windows MSVC: use rust-lld (shipped with rustup as part of the toolchain
# under `lib/rustlib/<target>/bin/rust-lld.exe`) for dramatically lower memory
# usage and faster linking versus link.exe.
#
# `linker-flavor=lld-link` selects the MSVC-compatible lld frontend; rustc
# resolves the bare `rust-lld` name via the toolchain's bin directory, so this
# stays portable across rustup-managed Windows installs without a hardcoded
# user profile path. Override locally if you have a non-rustup toolchain by
# adding a `[target.x86_64-pc-windows-msvc]` block to your user-level
# `~/.cargo/config.toml`.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link"]
