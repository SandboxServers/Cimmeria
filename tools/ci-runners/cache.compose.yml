# The runners' shared compile cache: one Redis that every runner on every node
# uses as its sccache backend, so a crate compiled by any job is a hit for all the
# others. It runs on one node (deploy.ps1 -CacheNode, node2 by default, the
# non-production one).
#
# A cache, not a store: no persistence (a restart means one cold run), least-
# recently-used eviction at CACHE_MAXMEMORY, and a password because node5's
# runners reach it over the colo network. If it is down, sccache counts every
# lookup as a miss and compiles normally.
name: gha-cache

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command:
      - redis-server
      - --requirepass
      - ${CACHE_PASSWORD:?set CACHE_PASSWORD in .env}
      - --maxmemory
      - ${CACHE_MAXMEMORY:-24gb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      # sccache stores whole rlibs; the largest are tens of MB.
      - --proto-max-bulk-len
      - 512mb
    ports:
      - "6379:6379"
    mem_limit: ${CACHE_MEM_LIMIT:-26g}
