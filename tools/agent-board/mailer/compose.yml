# SMTP -> Graph bridge for board.cimmeria.app. Deployed on the colo node at
# /mnt/nvme/board-mailer/ next to a root-only mailer.env.
name: board-mailer
services:
  mailer:
    build: .
    image: local/board-mailer:latest
    container_name: board-mailer
    restart: unless-stopped
    network_mode: host          # binds 172.17.0.1:2525 (docker0) only; Discourse reaches it there
    env_file: mailer.env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32
    labels:
      com.centurylinklabs.watchtower.enable: "false"
