# Codecov configuration. Reference: https://docs.codecov.com/docs/codecov-yaml
#
# Coverage is advisory in this repo — the test + test-live-db jobs are the
# blocking gate. The Codecov status check exists to surface drift in PR
# review, not to fail builds on small fluctuations.

coverage:
  status:
    project:
      default:
        # The whole-project check posts a status against the PR. We allow
        # small drops (1%) without flagging — random scheduler ordering on
        # async tests can shift counters by a fraction of a percent run to
        # run, and a strict zero-tolerance gate would just teach reviewers
        # to ignore the check.
        target: 75%
        threshold: 1%
        informational: true
    patch:
      default:
        # New code in the patch should be exercised. 70% is the floor for
        # informational signal; reviewers can ask for more on a per-PR basis.
        target: 70%
        threshold: 0%
        informational: true

# PR comment shape. The defaults are noisy on a workspace this size, so we
# scope the comment to a header + the per-component diff and trim file lists.
comment:
  layout: "header, diff, components, files, footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# Code that doesn't get instrumented or doesn't represent runtime behaviour.
# Keep this list aligned with the cargo workspace's CI excludes
# (cimmeria-app / cimmeria-content-editor / cimmeria-scene-editor /
# sgw-launcher are Tauri/GUI surfaces excluded from CI, so their files
# would show as 0% covered and skew the report).
ignore:
  - "src-tauri/**"
  - "crates/cimmeria-content-editor/**"
  - "crates/cimmeria-scene-editor/**"
  - "crates/launcher/**"
  - "deprecated/**"    # legacy C++/Python reference + retired artifacts
  - "tools/**"         # editor tools + smoke SQL scripts
  - "bootstrap/**"
  - "ghidra/**"
  - "external/**"
  - "**/build.rs"
  - "**/tests/**"      # test code itself
  - "**/*_tests.rs"
  # Binary entry points where assertion-style tests are not idiomatic.
  - "crates/server/src/main.rs"
  - "crates/supervisor/src/main.rs"
  - "crates/upk-objects/src/bin/**"
  - "crates/upk/src/bin/**"
  # Deferred per issue #205 (fixture cost exceeds value-per-line)
  #
  # The connect_loop directory hosts the BaseService UDP receive loop and the
  # full encrypted-bundle scanner. Every code path inside needs a real
  # UdpSocket, an established Mercury session (encryption key + sequence
  # state), AND a populated `connected: HashMap<SocketAddr, ConnectedClientState>`
  # to drive end-to-end. The scanner-helper unit tests in
  # `connect_loop/mod.rs` cover the offset arithmetic that's actually pure;
  # everything else (handle_encrypted_datagram, account_arms, cell_arms) is
  # integration-test territory. Was originally a single `connect_loop.rs`
  # file ignored under #205; the path was widened to `**` after issue #244
  # split it into a directory.
  - "crates/services/src/base/connect_loop/**"
  - "crates/services/src/base/cooked_data.rs"
  - "crates/services/src/base/dispatch.rs"
  - "crates/services/src/minigame/server.rs"
  # ── Cell→Base dispatcher arms that wrap wire builders or session glue ──
  #
  # `cell_dispatch/aoi.rs` is six functions, each shaped
  # `send_to_witness(socket, connected, entity_to_addr, witness_id, |k, s, a|
  # build_<wire_builder>(...)).await`. The wire builders themselves
  # (`build_create_entity_base`, `build_avatar_update`, `build_entity_leave`,
  # etc.) are byte-exact-tested in `crates/services/src/mercury/aoi/tests.rs`;
  # the `send_to_witness` glue is internal plumbing that needs a real
  # UdpSocket fixture for any non-trivial assertion. The unit-test value of
  # "with empty fixtures the function doesn't panic" is low; real
  # regressions surface in the wire-builder tests or in integration runs.
  - "crates/services/src/base/world_entry/cell_dispatch/aoi.rs"
  # `cell_dispatch/minigame.rs::start_minigame` is URL formatting +
  # `SessionRegistry::register` + `send_to_witness` woven together. Mocking
  # SessionRegistry plus building a UDP fixture per test is the same
  # fixture-cost-vs-value-per-line tradeoff that put `minigame/server.rs`
  # on this list — defer until a minigame integration harness exists.
  # `minigame_result` IS unit-tested (see `cell_dispatch/tests.rs`); the
  # ignore is scoped to the file because codecov can't carve out a single
  # function.
  - "crates/services/src/base/world_entry/cell_dispatch/minigame.rs"

# Components let the PR comment break coverage out by subsystem. Mirrors
# the crate dependency graph in README.md so reviewers can see "the
# mercury delta is +2.1%, the services delta is -0.4%" at a glance.
component_management:
  # Fallback for components listed under `paths:` below without an explicit
  # `statuses:` override. Every component currently overrides, so this only
  # kicks in for future additions.
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
  individual_components:
    - component_id: mercury
      name: mercury
      paths:
        - "crates/mercury/**"
      statuses:
        - type: project
          target: 92%
          informational: true
    - component_id: services
      name: services
      paths:
        - "crates/services/**"
      statuses:
        - type: project
          target: 62%
          informational: true
    - component_id: content-engine
      name: content-engine
      paths:
        - "crates/content-engine/**"
      statuses:
        - type: project
          target: 82%
          informational: true
    - component_id: entity
      name: entity
      paths:
        - "crates/entity/**"
      statuses:
        - type: project
          target: 88%
          informational: true
    - component_id: game
      name: game
      paths:
        - "crates/game/**"
      statuses:
        - type: project
          target: 80%
          informational: true
    - component_id: defs
      name: defs
      paths:
        - "crates/defs/**"
      statuses:
        - type: project
          target: 84%
          informational: true
    - component_id: common
      name: common
      paths:
        - "crates/common/**"
      statuses:
        - type: project
          target: 98%
          informational: true
    - component_id: commands
      name: commands
      paths:
        - "crates/commands/**"
      statuses:
        - type: project
          target: 92%
          informational: true
    # admin-api currently has no tests — keep `target: auto` so the per-PR
    # comment doesn't shout "0% (target 50%)" on every PR. Ratchet to 50%
    # once the tier-1 admin-api tests land.
    - component_id: admin-api
      name: admin-api
      paths:
        - "crates/admin-api/**"
      statuses:
        - type: project
          target: auto
          threshold: 1%
          informational: true
