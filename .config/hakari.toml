# Settings for `cargo hakari`, which maintains crates/workspace-hack
# (cimmeria-workspace-hack). See docs/architecture/build-system.md §6.
#
# Why: with the split, agents build single crates (`cargo check -p <crate>`) far more than
# the whole workspace. Each crate asks for its own feature set of shared dependencies, so a
# `-p` build after a workspace build recompiled up to 36 third-party crates with different
# features (measured 2026-09-26). The workspace-hack crate makes every member request the
# unified feature set, so every build reuses the same dependency artifacts.
#
# After adding or changing a dependency, run:
#     cargo hakari generate && cargo hakari manage-deps --yes
# CI fails when either would change a file.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for every option.

hakari-package = "cimmeria-workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Matches the root Cargo.toml's workspace.resolver.
resolver = "2"

# Development builds run on Windows (MSVC); CI builds on Linux runners.
platforms = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# The crates CI leaves out of the gated workspace (the GUI apps, the Windows-only
# client-telemetry and client-patches cdylibs, and the lab supervisor). Their dependencies' features must not
# leak into the unified set, or every crate would pull in GUI-only features that the Linux
# CI runners can't build.
[traversal-excludes]
workspace-members = [
    "cimmeria-app",
    "cimmeria-content-editor",
    "cimmeria-scene-editor",
    "sgw-launcher",
    "cimmeria-client-telemetry",
    "cimmeria-client-patches",
    "cimmeria-lab",
    "cimmeria-start32",
    "cimmeria-sgw-testhost",
]

# Keep them out of the generated dependency lines too. cimmeria-patch-wire is here as well,
# although CI builds it with the rest of the workspace: it is linked into the client-patch
# DLL inside SGW.exe and must stay free of dependencies, and the workspace-hack would pull
# tokio, hyper and sqlx into it. It has no dependencies, so it has no features to unify.
# cimmeria-client-hookgate is here for the same reason: both client DLLs link it. Its only
# dependency (windows-sys) is for the i686 target, which is not one of the platforms above.
# cimmeria-client-launch and cimmeria-start32 likewise: start32 is the 32-bit (i686)
# sgw-start32 helper that injects DLLs into the 32-bit SGW.exe, built on client-launch, and
# the workspace-hack would pull reqwest's aws-lc-rs (which needs NASM on i686) and the
# server's whole dependency set into it. Their only dependencies are thiserror and
# windows-sys (start32 also has winres at build time, kept out of the unified set by the
# traversal exclude above).
# cimmeria-sgw-testhost is the i686 stand-in for SGW.exe the DLL boot tests
# inject into; its binary is std-only and its dev-dependencies are test-only.
[final-excludes]
workspace-members = [
    "cimmeria-app",
    "cimmeria-content-editor",
    "cimmeria-scene-editor",
    "sgw-launcher",
    "cimmeria-client-telemetry",
    "cimmeria-client-patches",
    "cimmeria-lab",
    "cimmeria-patch-wire",
    "cimmeria-client-hookgate",
    "cimmeria-client-launch",
    "cimmeria-start32",
    "cimmeria-sgw-testhost",
]
