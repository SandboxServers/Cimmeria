# cargo-nextest configuration. Two CI profiles mirror the two test
# jobs in .github/workflows/test.yml:
#
#   * `ci`         — workspace pass without DATABASE_URL; the live-DB
#                    tests self-skip via require_db_or_skip!. Parallel.
#   * `ci-live-db` — the live-DB tier (tools/test-live-db.sh) against a
#                    live Postgres. The live-DB tests run in the `live-db`
#                    test group, up to N at once, each against its group
#                    slot's own database. Every other test in those crates
#                    runs in parallel beside them.
#
# JUnit XML is emitted under target/nextest/<profile>/junit.xml and
# uploaded to Codecov Test Analytics by the workflow.

[test-groups]
# N, the number of live-DB tests that run at once. It is also the number of
# database clones: tools/test-live-db.sh (and .ps1) read this exact line and
# clone the template database into <db>_0 .. <db>_<N-1> before the run, and
# each test in the group uses the clone for its NEXTEST_TEST_GROUP_SLOT
# (`database_url()` in crates/test-support/src/live_db_slot.rs). No two
# running tests share a slot, so no two share a database: tests that reuse
# sentinel ids or seed rows cannot collide. Keep the line's shape; the
# scripts parse it and `nextest_profile_groups_the_live_db_filter` pins
# it. The tests mostly wait on the database, so N is tuned by measurement
# (TESTING.md, "Live-DB tests"), not by core count.
live-db = { max-threads = 8 }

# A hung test is killed and named instead of holding the job until GitHub
# kills it at 6 h (#1033: a live-DB cleanup guard deadlocked its runtime and
# held three CI runs for up to 3.5 h). SLOW is reported each 60 s, and a
# test still running at 5 min is terminated and fails.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
report-name = "cimmeria"

[profile.ci-live-db]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci-live-db.junit]
path = "junit.xml"
report-name = "cimmeria-live-db"

# A live-DB test is one whose name (module path + fn name) contains
# `live_db`: a `live_db_*` test fn, or any test in a `*live_db*` module.
# The `every_live_db_test_is_in_the_live_db_group` guard in
# cimmeria-test-support (crates/test-support/src/live_db_group/) fails
# when a test that reaches `require_db_or_skip!` misses this filter, and
# `nextest_profile_groups_the_live_db_filter` pins these lines.
# Replaces the old `filter = "all()"` + `threads-required =
# "num-test-threads"` override, which ran all ~5,500 tests one at a time
# against one database.
[[profile.ci-live-db.overrides]]
filter = "test(~live_db)"
test-group = "live-db"
