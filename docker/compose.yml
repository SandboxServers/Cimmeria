# Cimmeria — game server deployment (colo / any single Docker host).
#
# Two compose projects make up the colo:
#
#   /opt/cimmeria/compose.yml          this file: cimmeria + watchtower
#   /opt/cimmeria/signoz/compose.yaml  SigNoz (docker/signoz/), optional
#
# They meet on the `signoz-net` Docker network, where this container reaches
# `otel-collector:4317` by name. Create the network once per host, then start
# either stack in either order:
#
#   docker network create signoz-net
#   cp .env.example .env && $EDITOR .env    # BASE_EXTERNAL at least
#   docker compose up -d
#
# Without SigNoz the server logs one OTLP export warning per batch and plays
# normally; set OTEL_EXPORTER_OTLP_ENDPOINT= (empty) in .env to switch the
# exporter off instead.
#
# Overlays, chosen with COMPOSE_FILE in .env (colon-separated):
#   compose.discord-file.yml   Discord notifications from ./config/discord.toml
#   compose.discord.yml        Discord notifications, release-rendered (env)
#   compose.lab.yml            Live Research Lab endpoint on a private address
#
# Full runbook: docs/operations/colo-deploy.md.
#
# Edits to this file reach the running container only through
# `docker compose up -d`. Watchtower recreates the container from the old
# container's settings, not from this file.

services:
  cimmeria:
    image: ghcr.io/sandboxservers/cimmeria-server:latest-prerelease
    container_name: cimmeria
    # Stable OTLP `host.name`: the server reports the OS hostname, and a
    # container's default hostname is its random container ID, which
    # changes on every watchtower swap.
    hostname: cimmeria-colo
    restart: unless-stopped
    ports:
      - "32832:32832/udp"    # BaseApp — game traffic after login
      - "8081:8081"          # SOAP login (TCP); also launcher telemetry ingest
      - "30000:30000"        # minigame SmartFoxServer (TCP)
      # Admin REST API. No authentication (issue #439): server stop, content
      # rewrite and the /ws/logs stream are open to whoever reaches it. Keep
      # ADMIN_PUBLISH on loopback or a private address; the colo's network
      # edge does not forward it. Telemetry ingest does not need it (8081
      # serves those routes).
      - "${ADMIN_PUBLISH:-127.0.0.1}:8443:8443"
      # Not published: 13001 (AUTH_PORT) and 50000/udp (CELL_PORT). The
      # image EXPOSEs them, but nothing binds either; login is 8081 and the
      # CellApp runs in-process. The lab endpoint (8444) is in compose.lab.yml.
    environment:
      # The address players connect to, handed out during login. Clients
      # that can't reach it log in and are bounced back to the login screen.
      # 127.0.0.1 works only for a client on this host.
      BASE_EXTERNAL: "${BASE_EXTERNAL:?set BASE_EXTERNAL in .env to the address players connect to}"
      # The SigNoz collector on signoz-net (docker/signoz/compose.yaml).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4317}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "cimmeria-server"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${CIMMERIA_DEPLOY_ENV:-colo},service.namespace=cimmeria"
      OTEL_TRACES_SAMPLER: "always_on"
      # otel.rs sets deployment.environment explicitly from this var, and an
      # explicit builder attribute beats OTEL_RESOURCE_ATTRIBUTES: without it
      # every row is tagged "dev".
      CIMMERIA_DEPLOY_ENV: "${CIMMERIA_DEPLOY_ENV:-colo}"
      # Seconds the server waits for the collector at container start before
      # starting without it (docker/s6/cimmeria-server/run).
      OTEL_WAIT_TIMEOUT: "${OTEL_WAIT_TIMEOUT:-120}"
      # Client telemetry (the launcher's uploads and the injected client
      # DLL's events, which land in SigNoz as service.name=cimmeria-client).
      # Signs /api/auth/dev-session tokens; unset or under 32 bytes, every
      # mint and upload is refused and the server logs
      # `dev_session_secret_unusable`. The game itself is unaffected.
      CIMMERIA_TELEMETRY_HMAC_SECRET: "${CIMMERIA_TELEMETRY_HMAC_SECRET:-}"
      # The upload base the mint hands to launchers; they append
      # /upload-chunk and /upload-bundle. Point it at this host's login
      # port, e.g. http://<public-host>:8081/api/telemetry. Blank falls back
      # to http://localhost:8443/api/telemetry, usable only on this host.
      CIMMERIA_TELEMETRY_UPLOAD_ENDPOINT: "${CIMMERIA_TELEMETRY_UPLOAD_ENDPOINT:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    # No volume for /var/lib/postgresql/data on purpose: the entrypoint
    # (docker/entrypoint.sh) reseeds it from the image on every container
    # start, so every start, update or restart, begins with a fresh DB.
    volumes:
      # Server logs (logs/*.log, plus logs/archive/<timestamp>/ per start).
      # A host bind mount survives watchtower swaps. The files have no
      # rotation of their own; point CIMMERIA_LOG_DIR at a roomy disk.
      - "${CIMMERIA_LOG_DIR:-./logs}:/var/log/cimmeria"
    networks:
      - signoz-net
    logging:
      # Container stdout (server console + postgres) is otherwise unbounded.
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    # containrrr/watchtower is no longer maintained; 1.7.1 is its last
    # release and what `latest` resolves to.
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"          # delete the replaced image
      WATCHTOWER_REMOVE_VOLUMES: "true"   # see colo-deploy.md: does not actually free the pgdata volume
      # Only containers labelled watchtower.enable=true (the cimmeria
      # service above). Without this, watchtower updates every container on
      # the host, including other projects'.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Docker 29+ refuses watchtower's default API version (1.25), and
      # watchtower then fails every poll.
      DOCKER_API_VERSION: "1.44"
      # Optional swap announcements (shoutrrr URL, e.g. discord://token@id).
      # Leave both blank for none.
      WATCHTOWER_NOTIFICATIONS: "${WATCHTOWER_NOTIFICATIONS:-}"
      WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_NOTIFICATION_URL:-}"
      WATCHTOWER_NOTIFICATIONS_LEVEL: "info"
      WATCHTOWER_NOTIFICATION_TITLE_TAG: "Cimmeria-Server"
      WATCHTOWER_NOTIFICATION_REPORT: "true"

networks:
  signoz-net:
    name: signoz-net
    external: true
