# Cimmeria — colo game-server deployment.
#
# This file is the game-server half of the colo deployment. The SigNoz
# observability stack lives in [compose.signoz.yml](compose.signoz.yml);
# the optional Discord notifications overlay lives in
# [compose.discord.yml](compose.discord.yml).
#
# # What's in the box
#
#   - cimmeria-server (the game server)
#   - watchtower auto-update (only manages the cimmeria container)
#
# # Usage
#
# The SigNoz stack should be brought up first so the otel-collector is
# reachable by the time the game server starts emitting telemetry. The
# game server tolerates a missing collector — the exporter logs
# "[otel] Exporter init failed" and the game keeps running — so the
# ordering is a preference, not a hard requirement.
#
#   docker compose -f compose.signoz.yml up -d   # SigNoz first
#   # wait ~90s for clickhouse to finish first-boot init
#   docker compose -f compose.yml up -d          # then the game server
#
# Both files declare `name: cimmeria` at the top, which pins them to a
# single Compose project (and therefore a single default network) — the
# `cimmeria` service can resolve `otel-collector:4317` by DNS without
# explicit network configuration.
#
# To run the game server without any observability, just skip the
# compose.signoz.yml step:
#
#   docker compose -f compose.yml up -d
#
# The OTLP exporter inside cimmeria-server will log connection-refused
# errors but the game runs normally.

services:
  cimmeria:
    image: ghcr.io/sandboxservers/cimmeria-server:latest-prerelease
    container_name: cimmeria
    restart: unless-stopped
    ports:
      - "13001:13001"        # auth (TCP) — game client login
      - "32832:32832/udp"    # BaseApp
      - "30000:30000"        # Minigame
      - "50000:50000/udp"    # CellApp
      - "8081:8081"          # SOAP login (TCP)
      - "8443:8443"          # admin REST API (TCP)
    environment:
      # MUST be overridden for any client that isn't on this host.
      # Defaults to 127.0.0.1 inside the image, which only works for
      # same-host clients. See docs/operations/container.md.
      BASE_EXTERNAL: "${BASE_EXTERNAL:-127.0.0.1}"
      # OTEL exporter — points at the SigNoz collector defined in
      # compose.signoz.yml. If you bring up compose.yml without the
      # SigNoz half, the exporter logs "[otel] Exporter init failed"
      # and the game server runs without telemetry shipping. Non-fatal.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "cimmeria-server"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=colo,service.namespace=cimmeria"
      OTEL_TRACES_SAMPLER: "always_on"
      # Uncomment for verbose logs while debugging:
      # RUST_LOG: "debug"
    # Intentionally NO `volumes:` for /var/lib/postgresql/data — Docker
    # creates a fresh anonymous volume on every `docker run`, populated
    # from the image's baked pgdata layer. When watchtower replaces this
    # container, the new instance gets a brand-new anon volume = clean DB.
    # WATCHTOWER_REMOVE_VOLUMES below cleans up the orphaned ones.
    labels:
      # Opt this container in to watchtower management. Containers without
      # this label are ignored thanks to WATCHTOWER_LABEL_ENABLE=true.
      - "com.centurylinklabs.watchtower.enable=true"
    # Attach to SigNoz's network so cimmeria can reach `otel-collector:4317`
    # by DNS. SigNoz creates `signoz-net` when its stack comes up; we
    # declare it `external: true` below so this file doesn't try to own
    # it. If SigNoz isn't running, `docker compose up` will fail with
    # "network signoz-net not found" — bring up SigNoz first (see docs).
    networks:
      - signoz-net
    # cimmeria-discord server-event notifications (startup/shutdown/panic,
    # errors). Mounts the rendered TOML below into the container; the crate
    # resolves /opt/cimmeria/config/discord.toml at startup. This is the
    # cimmeria-discord crate — independent of watchtower's image-swap pings.
    configs:
      - source: discord-config
        target: /opt/cimmeria/config/discord.toml
        # Server runs as the `cimmeria` user (UID/GID 1001). 0440 + matching
        # owner means only cimmeria + root can read the file, which holds the
        # webhook auth tokens.
        uid: "1001"
        gid: "1001"
        mode: 0440

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Docker API access so watchtower can stop/start/replace containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"       # 5 min — adjust as desired
      WATCHTOWER_CLEANUP: "true"            # delete the prior image after a successful swap
      WATCHTOWER_REMOVE_VOLUMES: "true"     # delete the orphaned anonymous pgdata volume too
      WATCHTOWER_LABEL_ENABLE: "true"       # only manage containers with the label above
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Optional: Discord/Slack/email pings on each image swap. To enable,
      # set WATCHTOWER_DISCORD_URL in your .env (see .env.example) and
      # uncomment the five lines below.
      # Reference: https://containrrr.dev/watchtower/notifications/
      # WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      # WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_DISCORD_URL}"
      # WATCHTOWER_NOTIFICATIONS_LEVEL: "info"
      # WATCHTOWER_NOTIFICATION_TITLE_TAG: "Cimmeria-Server"
      # WATCHTOWER_NOTIFICATION_REPORT: "true"

# `signoz-net` is created by SigNoz's own docker compose (their install.sh
# or `docker compose -f signoz/deploy/docker/docker-compose.yaml up`). We
# attach the cimmeria service to it so OTLP gRPC can reach
# `otel-collector:4317` by DNS. `external: true` means: don't try to
# create or destroy this network; SigNoz owns its lifecycle.
networks:
  signoz-net:
    external: true

# cimmeria-discord config, mounted into the cimmeria service above.
# Webhook URLs come from a .env file: copy .env.example -> .env and fill it
# in. Compose substitutes ${DISCORD_WEBHOOK} below at `up` time, so no secret
# lives in this committed file. Keep your .env chmod 0600 — it is gitignored;
# never commit it. All channels point at one webhook here; to fan events out
# to separate Discord channels, give each block its own ${VAR} and add it to
# .env. Discord is OFF by default — like the optional SigNoz stack, the
# server runs fine with nothing configured. Set DISCORD_ENABLED=true (and
# DISCORD_WEBHOOK) in .env to turn it on.
configs:
  discord-config:
    content: |
      [discord]
      # OFF unless DISCORD_ENABLED=true is set in .env. When false the crate
      # ignores the channel URLs below, so an unset DISCORD_WEBHOOK is fine.
      enabled = ${DISCORD_ENABLED:-false}
      username = "Cimmeria (colo)"

      [discord.channels.lifecycle]
      url = "${DISCORD_WEBHOOK}"
      rate_limit_per_min = 30

      [discord.channels.errors]
      url = "${DISCORD_WEBHOOK}"
      rate_limit_per_min = 60

      # auth/world/gameplay/gm: the channels with live emit sites as of the
      # #527 wiring merge. (chat + ops have no emit sites yet, and only
      # gm_command fires under gm — gm_teleport/spawn/item_grant aren't wired —
      # so those channels are omitted to avoid empty routes.)
      # Tip: to funnel everything into ONE Discord channel, set the same url
      # on every block (watch Discord's ~150/min per-webhook cap under load).
      [discord.channels.auth]
      url = "${DISCORD_WEBHOOK}"
      rate_limit_per_min = 60

      [discord.channels.world]
      url = "${DISCORD_WEBHOOK}"
      rate_limit_per_min = 60

      [discord.channels.gameplay]
      url = "${DISCORD_WEBHOOK}" 
      rate_limit_per_min = 60

      [discord.channels.gm]
      url = "${DISCORD_WEBHOOK}"
      rate_limit_per_min = 60

      [discord.events]
      # Defaults match crates/discord/src/config.rs EventToggles::default().
      # warning is off locally but on for the colo so ops sees non-fatal
      # regressions.
      warning = true
      # These gameplay events are OFF by default; turn them on so the colo
      # emits the full set of wired events (login/world-entry/level_up/
      # mission_accepted+completed/gm_command are already on by default).
      player_death = true
      player_respawn = true
      mission_failed = true
      item_used = true
