# Cimmeria — launcher sign-in auth proxy listener overlay (opt-in).
#
# Turns on the auth proxy listener (contract C2) inside the container and
# publishes it on the host's LOOPBACK address only, for a TLS-terminating
# reverse proxy on the same host. On the colo that proxy is the board's
# Caddy; runbook: docs/operations/auth-https.md.
#
# The listener trusts X-Forwarded-* headers from its trusted peers, so
# port 13480 must never be in a public `ports:` entry (the 32832/udp,
# 8081 and 30000 entries of docker/compose.yml) and never edge-forwarded.
# This overlay publishes it on 127.0.0.1 and nowhere else.
#
# Through a loopback publish the server does not see 127.0.0.1 as the peer:
# it sees the bridge gateway of the container's network. The default trusted
# list (127.0.0.0/8,::1,172.16.0.0/12) already covers that gateway. To narrow
# the list to the gateway alone, set AUTH_PROXY_TRUSTED_PEERS in .env to
#
#   <gateway>/32
#
# where <gateway> is printed by
#
#   docker network inspect signoz-net --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
#
# Never commit that value.
#
# config/auth-providers.toml must exist before `docker compose up -d`.
# Otherwise Docker creates an empty directory in its place, as it does for
# config/discord.toml. The file is owned by uid 1001 and mode 0440. The
# provider secrets are forwarded by docker/compose.yml (the base file), not
# by this overlay; their variable names there must match the
# client_secret_env names in that file.
#
# Enable it: append `:compose.auth-proxy.yml` to COMPOSE_FILE in .env, then
#
#   docker compose up -d
#
# That recreates the cimmeria container and restarts the game server. An
# image without the proxy listener ignores AUTH_PROXY_ADDR, so this overlay
# is harmless there.
#
# Full runbook: docs/operations/auth-https.md.

services:
  cimmeria:
    environment:
      # The auth proxy listener (contract C2), bound inside the container.
      AUTH_PROXY_ADDR: "0.0.0.0:13480"
      # Empty keeps the server default 127.0.0.0/8,::1,172.16.0.0/12.
      AUTH_PROXY_TRUSTED_PEERS: "${AUTH_PROXY_TRUSTED_PEERS:-}"
      CIMMERIA_AUTH_PROVIDERS: "/opt/cimmeria/config/auth-providers.toml"
      # Kill switches (docs/operations/auth-https.md). Only the literal 1 turns one on.
      CIMMERIA_IDP_DISABLED: "${CIMMERIA_IDP_DISABLED:-}"
      CIMMERIA_IDP_SIGNUP_DISABLED: "${CIMMERIA_IDP_SIGNUP_DISABLED:-}"
      CIMMERIA_SOAP_RELAY_DISABLED: "${CIMMERIA_SOAP_RELAY_DISABLED:-}"
    ports:
      # Host loopback ONLY, for a TLS-terminating proxy on this host.
      # Never "13480:13480": that publishes it on every interface.
      - "127.0.0.1:13480:13480"
    volumes:
      - ./config/auth-providers.toml:/opt/cimmeria/config/auth-providers.toml:ro
