# Cimmeria — SigNoz observability stack (the colo's second compose project).
#
# This is SigNoz's own single-node compose file, vendored from
# github.com/SigNoz/signoz deploy/docker/docker-compose.yaml at commit
# 804ea2a7f (v0.125.1-34, the checkout the colo ran from 2026-05-25), with
# the config files it mounts copied beside it. Cimmeria-specific changes:
#
#   - `name: signoz` replaces upstream's deploy/docker/.env, so the project,
#     container and volume names match the colo exactly.
#   - Paths are ./common/... instead of ../common/... (flat layout).
#   - `signoz-net` is external, created once with `docker network create
#     signoz-net`, so this stack and the game stack (../compose.yml) can be
#     started in either order and either can run alone. Only `signoz` and
#     `otel-collector` join it; ClickHouse (passwordless `default` user) and
#     ZooKeeper (anonymous login) stay on the project's own `signoz-internal`
#     network, out of the game container's reach.
#   - The UI and OTLP ports bind to ${SIGNOZ_UI_BIND} / ${OTLP_BIND}
#     (default 127.0.0.1), not every interface.
#   - The JWT secret comes from .env instead of upstream's literal "secret".
#   - otel-collector-config.yaml adds the `transform/claude-code-scrub`
#     processor (docs/operations/claude-code-telemetry.md).
#
# Deploy: docs/operations/colo-deploy.md. Upgrade: signoz-deployment.md.
#
#   cd /opt/cimmeria/signoz
#   cp .env.example .env && $EDITOR .env      # SIGNOZ_JWT_SECRET at least
#   docker network create signoz-net          # once per host
#   docker compose up -d
#
# First boot downloads a ClickHouse UDF (init-clickhouse needs outbound
# HTTPS to github.com) and runs the schema migrations; allow ~2 minutes.
# The UI then asks you to create the admin account on first visit.

name: signoz

x-common: &common
  networks:
    - signoz-internal
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"
x-clickhouse-defaults: &clickhouse-defaults
  !!merge <<: *common
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9363"
    signoz.io/path: "/metrics"
  depends_on:
    init-clickhouse:
      condition: service_completed_successfully
    zookeeper-1:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - wget
      - --spider
      - -q
      - 0.0.0.0:8123/ping
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
x-zookeeper-defaults: &zookeeper-defaults
  !!merge <<: *common
  image: signoz/zookeeper:3.7.1
  user: root
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"
  healthcheck:
    test:
      - CMD-SHELL
      - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
    interval: 30s
    timeout: 5s
    retries: 3
x-db-depend: &db-depend
  !!merge <<: *common
  depends_on:
    clickhouse:
      condition: service_healthy
services:
  init-clickhouse:
    !!merge <<: *common
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - ./common/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
  zookeeper-1:
    !!merge <<: *zookeeper-defaults
    container_name: signoz-zookeeper-1
    volumes:
      - zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
  clickhouse:
    !!merge <<: *clickhouse-defaults
    container_name: signoz-clickhouse
    volumes:
      - ./common/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./common/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./common/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./common/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - ./common/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - clickhouse:/var/lib/clickhouse/
  signoz:
    !!merge <<: *db-depend
    image: signoz/signoz:${VERSION:-v0.125.1}
    container_name: signoz
    networks:
      - signoz-internal
      - signoz-net
    ports:
      # UI and query API. No public ingest happens here: player telemetry
      # enters through the game server's login port and reaches the
      # collector over signoz-net. Widen SIGNOZ_UI_BIND only to an address
      # your operators reach privately (LAN / VPN).
      - "${SIGNOZ_UI_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      # Signs UI sessions. Upstream ships the literal "secret". Changing it
      # logs every UI user out once; nothing else is lost.
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET:?set SIGNOZ_JWT_SECRET in signoz/.env (openssl rand -hex 32)}
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
  otel-collector:
    !!merge <<: *db-depend
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-v0.144.4}
    container_name: signoz-otel-collector
    # signoz-net is how the game container reaches otel-collector:4317.
    networks:
      - signoz-internal
      - signoz-net
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./common/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      # The game server does not use these: it reaches otel-collector:4317
      # over signoz-net. They are for exporters outside Docker (a natively
      # run cimmeria-server, workstation Claude Code telemetry). The
      # collector has no authentication; never bind them to an address the
      # internet can reach.
      - "${OTLP_BIND:-127.0.0.1}:4317:4317" # OTLP gRPC receiver
      - "${OTLP_BIND:-127.0.0.1}:4318:4318" # OTLP HTTP receiver
  signoz-telemetrystore-migrator:
    !!merge <<: *db-depend
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-v0.144.4}
    container_name: signoz-telemetrystore-migrator
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    restart: on-failure
networks:
  # Not `internal: true`: init-clickhouse downloads a UDF from github.com.
  signoz-internal: {}
  signoz-net:
    name: signoz-net
    external: true
volumes:
  clickhouse:
    name: signoz-clickhouse
  sqlite:
    name: signoz-sqlite
  zookeeper-1:
    name: signoz-zookeeper-1
