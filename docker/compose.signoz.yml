# Cimmeria ↔ SigNoz utilities.
#
# This file holds the optional smoke-test container that verifies the
# OTLP wire path between cimmeria-server and the SigNoz collector
# before the game server boots its game services.
#
# The OTEL_* environment overrides on the cimmeria service live in
# [`compose.colo.yml`](./compose.colo.yml) directly — Docker Compose's
# `include:` directive (used by `docker/compose.yml`) does not allow
# same-name services across included files to be merged, so the env
# overlay has to be in the file that originally defines the service.
# The OTEL env vars there default to the in-network collector address
# but no-op cleanly when SigNoz isn't running alongside.
#
# The SigNoz stack itself is defined upstream at
# `external/signoz/deploy/docker/clickhouse-setup/docker-compose.yaml`
# — cloned by setup.ps1 at a pinned tag, brought into the same Compose
# project by `docker/compose.yml`'s `include:` directive.

services:
  # An optional one-shot "sanity check" container that fires a single
  # OTLP event after compose startup so we can confirm the wire path
  # is live before cimmeria-server is ready. Surface in
  # `docker compose -f docker/compose.yml --profile smoke logs otel-smoke`.
  # Disabled by default — enable via:
  #     docker compose -f docker/compose.yml --profile smoke up otel-smoke
  otel-smoke:
    image: alpine/curl:3.14
    container_name: cimmeria-otel-smoke
    profiles: [smoke]
    depends_on:
      - cimmeria
    command:
      - sh
      - -c
      - >
        echo "Sending smoke event to otel-collector:4318..." &&
        curl -sf -X POST http://otel-collector:4318/v1/logs
        -H 'Content-Type: application/json'
        -d '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"cimmeria-smoke"}}]}, "scopeLogs":[{"logRecords":[{"body":{"stringValue":"SigNoz wire path smoke"},"severityText":"INFO"}]}]}]}' &&
        echo "Smoke OK — check http://localhost:3301 → Logs"
