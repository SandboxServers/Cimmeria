# Cimmeria — Discord-notifications colo overlay (TEMPLATE)
#
# This file is a TEMPLATE. The `__DISCORD_*_WEBHOOK__` sentinels are
# rendered into real Discord webhook URLs by
# `.github/workflows/release-container.yml` using GitHub Actions
# secrets, and the rendered overlay is attached to the corresponding
# GitHub Release as `compose.discord.yml`. The version of this file
# committed to the repo is not directly deployable — cimmeria-discord
# will refuse to start with the sentinels in place.
#
# # Deploy on a colo box (alongside docker/compose.yml)
#
#   cd /opt/cimmeria
#   # Pull the rendered overlay published by the release workflow.
#   # `latest` resolves to the most recent prerelease asset.
#   curl -L -o compose.discord.yml \
#     "https://github.com/SandboxServers/Cimmeria/releases/latest/download/compose.discord.yml"
#   docker compose -f compose.yml -f compose.discord.yml up -d
#
# # What this overlay does
#
# Mounts a server-side `/opt/cimmeria/config/discord.toml` into the
# cimmeria container via Docker Compose's `configs:` mechanism (same
# pattern the SigNoz services use). cimmeria-discord's `init()`
# resolves that path at startup and the notifications crate posts to
# the configured webhooks. No environment variables involved in the
# container — the rendered TOML carries the real URLs.
#
# # Adding more channels
#
# Today the overlay configures `lifecycle` and `errors` (the highest-
# signal channels). To enable additional channels (auth, world, chat,
# gameplay, gm, ops):
#
#   1. Add a `DISCORD_<CHANNEL>_WEBHOOK` GitHub Actions secret.
#   2. Add a `[discord.channels.<channel>]` block below, mirroring
#      the lifecycle / errors blocks, with a fresh `__DISCORD_*__`
#      sentinel.
#   3. Update the render step in release-container.yml to substitute
#      the new sentinel from the new secret.
#
# Channels without a `[discord.channels.X]` block are silently dropped
# from routing — see `docs/architecture/discord-notifications.md`.

services:
  cimmeria:
    configs:
      - source: discord-config
        target: /opt/cimmeria/config/discord.toml
        # Server runs as the `cimmeria` user (UID/GID 1001) per the
        # Dockerfile. 0440 + matching owner means only cimmeria + root
        # can read the file; the file contains webhook auth tokens, so
        # the world-readable default would be a credential leak on a
        # shared host.
        uid: "1001"
        gid: "1001"
        mode: 0440

configs:
  discord-config:
    # NOTE: do not introduce ${VAR} references inside this content
    # block — Docker Compose interprets `${VAR}` at `compose up` time
    # and would either substitute from the host environment (leaking
    # the colo host's env into the rendered TOML) or fail outright on
    # unset variables. Sentinels are the only safe templating mechanism
    # here because Compose passes them through untouched.
    content: |
      [discord]
      enabled = true
      username = "Cimmeria (colo)"

      [discord.channels.lifecycle]
      url = "__DISCORD_LIFECYCLE_WEBHOOK__"
      rate_limit_per_min = 30

      [discord.channels.errors]
      url = "__DISCORD_ERRORS_WEBHOOK__"
      rate_limit_per_min = 60

      [discord.events]
      # Defaults match crates/discord/src/config.rs `EventToggles::default()`.
      # Override here when the colo's signal preferences diverge from
      # the local-dev defaults — e.g. turn `warning` on for the colo so
      # ops sees non-fatal regressions even when the day-to-day dev
      # noise is muted.
      warning = true
