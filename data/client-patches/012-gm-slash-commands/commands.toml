# Project-maintained table behind patch 012-gm-slash-commands.
#
# One entry per typeable /gm* command the Stargate Worlds client registers from
# Common/xml/slash_commands/InternalSlashCommands.xml. Only identifiers and
# types live here: the command word, the client event class it fires
# (Event_SlashCmd_*, from SGW.exe), and the typed parameters in the order the
# client parses them. There is no help or description text, by design (the
# project ships no CME-authored text). The generator
# (tools/client-patches/gm_slash_commands.py) turns this table into the XML.
#
# access: the role letters the client's parser reads from the Access attribute.
# Its mask code treats a letter at the first position as ABSENT and every other
# role as present, so "p" gives mask 0x2FF, which any non-zero server access
# level passes (the client-side filter only; the server still gates every
# GM method). See data/client-patches/README.md, patch 012.
access = "p"

# params:   mandatory parameters, "<Type> <Name>", Type one of
#           Boolean, Integer, Float, String.
# optional: optional parameters, same shape, after the mandatory ones.

