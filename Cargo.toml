[workspace]
resolver = "2"
exclude = [
    "tools/SGWLauncher/src-tauri",
    # cargo-fuzz target — depends on libfuzzer-sys which requires
    # nightly Rust. Run manually via `cargo +nightly fuzz run <target>`
    # from inside `fuzz/`. See fuzz/README.md for invocation.
    "fuzz",
]
members = [
    "crates/common",
    "crates/mercury",
    "crates/defs",
    "crates/entity",
    "crates/game",
    "crates/content-engine",
    "crates/services",
    "crates/admin-api",
    "crates/commands",
    "crates/server",
    "crates/supervisor",
    "crates/launcher",
    "src-tauri",
    "tools/ContentEditor",
    "tools/SceneEditor",
    "tools/spec-lint",
    "crates/upk",
    "crates/upk-objects",
    "crates/wireclient",
    "crates/discord",
]
default-members = [
    "crates/common",
    "crates/mercury",
    "crates/defs",
    "crates/entity",
    "crates/game",
    "crates/content-engine",
    "crates/services",
    "crates/admin-api",
    "crates/commands",
    "crates/server",
    "crates/supervisor",
    "crates/wireclient",
    "crates/discord",
]

# Optimize dependencies and strip their debug info in dev builds.
# This dramatically reduces .rlib sizes so the linker doesn't OOM on WSL
# (~8 GB linker RSS instead of ~47 GB). Our own crates keep full debug info.
[profile.dev.package."*"]
opt-level = 1
debug = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# XML parsing
quick-xml = "0.39"

# Cryptography (client requires AES-256-CBC + HMAC-MD5)
aes = "0.9"
cbc = "0.2"
hmac = "0.12"
md-5 = "0.10"
rand = "0.10"
rand_distr = "0.6"
rand_chacha = "0.10"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Config file parsing
toml = "0.9"

# Filesystem watch (Discord config live-reload)
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Lock-free atomic config swap (Discord notifications + future feature flags)
arc-swap = "1"

# Date/time formatting (Discord embed RFC3339 timestamps)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# HTTP mocking for tests (Discord webhook integration)
wiremock = "0.6"

# Hashing
sha2 = "0.10"

# Encoding
base64 = "0.22"

# Async utilities
futures-util = "0.3"

# Archive reading (CookedCharCreation.pak is a ZIP)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Streaming compression — used by the launcher chunk uploader and by
# the admin-api ingest endpoint that unwraps those chunks.
flate2 = "1"

# Auth
jsonwebtoken = "9"

# Property-based testing (used as dev-dependency in mercury)
proptest = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait objects (object-safe `async fn` in traits — needed for
# `Arc<dyn Transport>` in the Mercury transport layer).
async-trait = "0.1"

# Navigation
# recast-detour-rs = "0.1"  # TODO: evaluate crate availability

# Tauri
tauri = { version = "2" }
tauri-build = { version = "2" }

# Image processing (scene editor texture thumbnails)
image = { version = "0.25", default-features = false, features = ["png"] }
texture2ddecoder = "0.1.2"

# Internal crates
cimmeria-common = { path = "crates/common" }
cimmeria-mercury = { path = "crates/mercury" }
cimmeria-defs = { path = "crates/defs" }
cimmeria-entity = { path = "crates/entity" }
cimmeria-game = { path = "crates/game" }
cimmeria-content-engine = { path = "crates/content-engine" }
cimmeria-services = { path = "crates/services" }
cimmeria-admin-api = { path = "crates/admin-api" }
cimmeria-commands = { path = "crates/commands" }
cimmeria-server = { path = "crates/server" }
cimmeria-upk = { path = "crates/upk" }
cimmeria-upk-objects = { path = "crates/upk-objects" }
cimmeria-wireclient = { path = "crates/wireclient" }
cimmeria-discord = { path = "crates/discord" }

# ---------------------------------------------------------------------------
# Profile: dev — optimise compile speed
# ---------------------------------------------------------------------------

[profile.dev]
# Split debug info into a separate file — speeds up linking.
split-debuginfo = "unpacked"
# Fewer codegen units = fewer parallel LLVM backends = lower peak memory.
# Default is 256 for dev; 16 is a good balance of speed vs memory.
codegen-units = 16
