[package]
name = "cimmeria-admin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST/WebSocket admin API for the Cimmeria server emulator"

[dependencies]
cimmeria-services = { workspace = true }
# Telemetry ingest names client rows (NT-40): the NameBook for item and
# ability IDs, the NT-30 wire tables for message ids and method indexes.
cimmeria-names = { workspace = true }
cimmeria-wire = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

# Dev-session telemetry HMAC token mint/verify.
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Launcher telemetry ingest: parse gzipped NDJSON chunks + zipped bundles.
flate2 = { workspace = true }
zip = { workspace = true }
bytes = { workspace = true }
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }
