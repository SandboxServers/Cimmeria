[package]
name = "cimmeria-admin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST/WebSocket admin API for the Cimmeria server emulator"

[dependencies]
cimmeria-common = { workspace = true }
cimmeria-services = { workspace = true }
cimmeria-entity = { workspace = true }
cimmeria-content-engine = { workspace = true }
cimmeria-commands = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Dev-session telemetry HMAC token mint/verify.
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Launcher telemetry ingest: parse gzipped NDJSON chunks + zipped bundles.
flate2 = { workspace = true }
zip = { workspace = true }
bytes = { workspace = true }
