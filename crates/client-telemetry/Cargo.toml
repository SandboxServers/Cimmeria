[package]
name = "cimmeria-client-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Injected DLL that observes SGW.exe via CME EventSignal subscription, function hooks, and log4cxx tees, and ships events to the cimmeria-server telemetry endpoint."

# cdylib for the injected DLL itself; rlib so unit tests can link the
# library normally without needing a separate target binary.
[lib]
crate-type = ["cdylib", "rlib"]

# Windows-only: the entire crate exists to be loaded into SGW.exe.
# Targeting i686-pc-windows-msvc — the `-gnu` triple was demoted to
# Tier 2 in Rust 1.88.0 (May 2025), so MSVC is the right default for
# new 32-bit Windows DLLs.
#
# Linux CI builds this crate as a no-op (the lib compiles to an empty
# stub on non-Windows targets); the real cdylib only links on Windows.
# Workspace `default-members` excludes this crate so a stock
# `cargo build` on Linux doesn't try to produce a Windows DLL.
[dependencies]
# Minimal init/error surface. No tokio, no reqwest, no opentelemetry
# inside an injected DLL — Phase 2 ships `ureq` + plain JSON to the
# existing /api/telemetry/upload-chunk endpoint.
thiserror = { workspace = true }

# Phase 2 — Event queue + uploader. Cross-platform deps so the rlib
# builds and tests on Linux; the cdylib's network path only runs on
# Windows but the queue / serialization / batching logic is portable
# and fully unit-tested here.
#
# `crossbeam-channel` — bounded sync MPMC channel with `try_send`
# (returns the value on full, never blocks the producer). The
# producers are hook handlers running on whatever game thread
# caught the event; the consumer is the uploader thread. We
# considered `thingbuf` but its recycle-based API requires
# `Default + Clone` on the element type and a re-zero step that
# doesn't fit the build-then-stamp shape the producer uses.
#
# `ureq` (rustls-tls) — single-threaded sync HTTPS client. No tokio,
# no async, exactly one connection at a time per uploader thread.
# That's the right shape for a dedicated worker that owns its own
# OS thread inside SGW.exe.
#
# `flate2` — gzip the NDJSON payload to match the launcher's
# upload-chunk wire format. The server's gzip decoder uses the
# `flate2` crate too, so the encode/decode pair is symmetric.
#
# `serde` / `serde_json` — wire format. `ClientNativeEvent` is a
# byte-shape mirror of the launcher's type at
# `cimmeria_launcher::telemetry::events::ClientNativeEvent`. Also
# used to deserialize `current-session.json` (the launcher writes
# the token field as a plain string — no base64 today).
crossbeam-channel = "0.5"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
flate2 = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Just what DllMain + the bootstrap-thread pattern + the inline-hook
# trampolines + CME subscribe ABI need.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }

# `minhook-sys` — raw FFI bindings to the MinHook C library, built
# from source via `cc`. We use the raw `MH_*` API rather than a
# higher-level Rust wrapper (most Rust inline-hook crates require
# nightly via the `feature(unboxed_closures)` trick — see retour
# 0.3.1). MinHook handles the JMP-based trampoline + thread freeze
# coordination + restore-on-unhook for us. Tier-1 anchors at fixed
# addresses in SGW.exe (ASLR disabled via AtreaFixASLR.bat) so we
# just hand MinHook the address and our callback.
minhook-sys = "0.1"

[dev-dependencies]
tempfile = "3"
# Tiny synchronous HTTP server for uploader integration tests. Linux-
# friendly, blocking, dep-light — perfect for "spin up a fake
# /api/telemetry/upload-chunk endpoint, fire the uploader at it,
# assert the body decoded correctly."
tiny_http = "0.12"
