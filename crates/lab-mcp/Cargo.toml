[package]
name = "cimmeria-lab-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-server MCP endpoint for the Cimmeria live research lab"

[dependencies]
# MCP over streamable HTTP. `server` (default) pulls schemars + the tool
# macros; `transport-streamable-http-server` adds the tower service + local
# session manager we nest into our own axum router.
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }

tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Field paths (`missions[0].state`) in server_stage_fixture's parse errors.
# Already in the tree through axum's `json` feature.
serde_path_to_error = "0.1"
sqlx = { workspace = true }
tracing = { workspace = true }

# The running-server handles the tools reach through.
cimmeria-services = { workspace = true }
# The recent-log ring buffer (`LogBuffer`) that `server_log_tail` reads.
cimmeria-admin-api = { workspace = true }
# The NameBook the tools pair template / archetype / `name_id` names from
# (named telemetry Rule 6, NT-41).
cimmeria-names = { workspace = true }
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
# The lab chaos tools (CH-05) over cimmeria-services' `base::lab_chaos`.
# Command line only, never from a dependency entry.
lab-chaos = ["cimmeria-services/lab-chaos"]

[dev-dependencies]
# The live-DB gate (`require_db_or_skip!`) for `server_stage_fixture`'s
# guards (FX-04), re-exported from the `#[cfg(test)] mod test_support` shim
# in lib.rs. Every crate with this dev-dependency must be listed in
# tools/test-live-db.{sh,ps1}; `live_db_wrapper_lists_every_test_support_crate`
# enforces it.
cimmeria-test-support = { workspace = true }
