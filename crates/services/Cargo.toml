[package]
name = "cimmeria-services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The facade over the Cimmeria server emulator's service crates: the orchestrator, the database pool and re-exports of the services at their old module paths"

[dependencies]
# `ServerConfig`, which the orchestrator reads. Since wave C6 of the split
# (docs/architecture/services-crate-split.md) this crate is the facade: the
# orchestrator, the database pool and re-exports of the split crates at their
# old paths. Every service crate below is a dependency only for those
# re-exports (and the orchestrator's `BaseService`, `CellService`,
# `AuthService` and minigame server). `cimmeria-mercury`, `cimmeria-entity` and
# `cimmeria-content-engine` are dev-dependencies now (only the cross-track
# tests name them), and `cimmeria-observability`, `cimmeria-occluder`, `rand`,
# `quick-xml` and `serde` are gone: none of the code left here uses them.
cimmeria-common = { workspace = true }
# The auth service, login audit events and credential redaction, split out
# in wave W1a (docs/architecture/services-crate-split.md). Re-exported from
# lib.rs at the old `auth` and `audit` paths.
cimmeria-auth = { workspace = true }
# The Base<->Cell wire contract (method indices, BSF bits, payload
# serializers), split out of this crate; old paths re-export it.
cimmeria-wire = { workspace = true }
# The decoded wire-message stream (`wire.in` / `wire.out`) and the per-session
# packet tap, split out in wave W3b. Re-exported from lib.rs as `wire_log`.
cimmeria-wire-log = { workspace = true }
# Cooked-data PAK cache + Cimmeria's overrides and the CharDef table, split out
# of this crate (docs/architecture/services-crate-split.md, W1b). Re-exported
# at `base::{resources, chardef, *_overrides}`.
cimmeria-resources = { workspace = true }
# The cell's DB-backed startup catalogs (spawner loaders, ability trees, the
# respawner search), split out of this crate (W2b). Re-exported at
# `cell::{spawner, respawner_fallback}` and `ability_tree`.
cimmeria-cell-catalog = { workspace = true }
# The in-process SmartFoxServer host for the Flash minigames, split out of this
# crate (W3c). Re-exported at `minigame`.
cimmeria-minigame = { workspace = true }
# The BaseApp's per-connection session layer (session types, send helpers,
# deferred AoI, outbox, tick sync, cooked data, contact list, crafting, ...),
# split out of this crate (B1). Re-exported at the old `base::` paths.
cimmeria-base-session = { workspace = true }
# The cell's world state (SpaceManager, the NPC AI's state primitives, the ring
# FSM, the synchronous effect scripts, the GM gate, ContentEvents), split out
# of this crate (C1). Re-exported at the old `cell::…` paths.
cimmeria-cell-world = { workspace = true }
# The BaseApp service (`BaseService`, the connect loop, login, the SGWPlayer
# base-method dispatch and the character creator), split out of this crate
# (B4). Re-exported at `base::BaseService`. It owns the `chaos-testing`
# feature, which this crate forwards.
cimmeria-base = { workspace = true }

# The cell's combat (abilities, damage, death, threat, the auto-cycle, effect
# pulsing, the NPC AI's behaviour, the bandolier and reload handlers), split
# out of this crate (C2). Re-exported at the old `cell::…` paths.
cimmeria-cell-combat = { workspace = true }
# The cell's content layer (the content-chain executor and dispatchers,
# missions, the ring-transport dispatcher and entry points, the dialog
# display), split out of this crate (C3). Re-exported at `cell::{content,
# missions, ring_transport}`.
cimmeria-cell-content = { workspace = true }
# The cell's player interactions (NPC interaction dispatch, stargate travel,
# the GM space transfer, the respawn fork, trade session state, mail
# forwarding), split out of this crate (C4). Re-exported at `cell::{
# interactions, gate_travel, space_transfer, respawn, trade, mail}`.
cimmeria-cell-interactions = { workspace = true }
# The cell's GM surfaces (the `.`-console, the chat interceptor, the native
# `gm*` cell methods), split out of this crate (C5b). Re-exported at
# `cell::{console, chat}`.
cimmeria-cell-console = { workspace = true }

# The client-callable cell methods (the per-interface dispatchers and the
# SGWPlayer handlers), split out of this crate (C5a). Re-exported at
# `cell::cell_methods`.
cimmeria-cell-methods = { workspace = true }
# The CellApp service (`CellService`, the cell loop, the base-message handlers
# and the ticks) and the cell-method router, split out of this crate (C6), the
# top of the cell track. Re-exported at `cell::{CellService, dispatch}`.
cimmeria-cell = { workspace = true }
# The pets feature as a cell plugin (#962 pilot). The facade is the composition
# root: `plugins::cell_plugins` lists it in the plugin table, and nothing below
# the facade depends on it.
cimmeria-cell-pets = { workspace = true }
# Duels as a cell plugin (#962 step 2), in the plugin table beside pets.
cimmeria-cell-duel = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
# Opt-in seam for services-layer chaos integration tests that need to
# inject a `LossyTransport` in place of the real UDP socket inside a live
# `BaseService`/`Orchestrator`. The seam itself, and the feature that gates
# it, are cimmeria-base's since wave B4
# (docs/architecture/services-crate-split.md); this forwards to it, so
# external consumers (e.g. `cimmeria-wireclient`'s live-DB chaos tests) keep
# pulling it in via:
# `cimmeria-services = { path = "../services", features = ["chaos-testing"] }`.
# See docs/architecture/network-chaos-testing.md and
# `BaseService::set_transport_override`.
chaos-testing = ["cimmeria-base/chaos-testing"]

[dev-dependencies]
# Mercury with the `test-support` feature, so the cross-track tests can use
# `cimmeria_mercury::test_transport::TestTransport` (the recording UDP fake)
# in place of a real socket. Only the tests name mercury since wave C6, so it
# is no longer a normal dependency; the chaos integration test that used its
# lossy transport is mercury's own since wave F. See
# docs/architecture/transport-trait.md.
cimmeria-mercury = { path = "../mercury", features = ["test-support"] }

# Generic test helpers: the live-DB gate (`require_db_or_skip!`),
# `LogCapture` and the `TestTransport` re-export. Re-exported from the
# `#[cfg(test)] mod test_support` shim, so tests import them from
# `crate::test_support`. Every crate with this dev-dependency must be listed
# in tools/test-live-db.{sh,ps1}; `live_db_wrapper_lists_every_test_support_crate`
# enforces it.
cimmeria-test-support = { workspace = true }

# `test_default_connected_client_state`, re-exported from the `test_support`
# shim, for the gate round trips that stay here (`gate_round_trip_tests`).
cimmeria-base-session = { workspace = true, features = ["test-support"] }

# The chain engine and the entity types the cross-track tests build their
# fixtures from (the gate dial's engine, the mission round trips' missions).
cimmeria-content-engine = { workspace = true }
cimmeria-entity = { workspace = true }

# World entry, which only this crate's tests name since wave B4 moved its
# production users to cimmeria-base: the gate round trips
# (`gate_round_trip_tests`) and the mission round trips
# (`mission_round_trip_tests`). The feature exposes
# `world_entry::{handle_gate_travel, persist_arrival}`, which the gate round
# trips drive after the cell's dial handler.
cimmeria-base-world-entry = { workspace = true, features = ["test-support"] }

# `gate_travel::send_gate_sequence` for the gate fan-out byte test in
# `gate_round_trip_tests`, which stays here because it drives the base's world
# entry after the cell's emitter.
cimmeria-cell-interactions = { workspace = true, features = ["test-support"] }

