[package]
name = "cimmeria-services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Server service implementations for the Cimmeria server emulator"

[dependencies]
cimmeria-common = { workspace = true }
cimmeria-mercury = { workspace = true }
cimmeria-entity = { workspace = true }
cimmeria-game = { workspace = true }
cimmeria-content-engine = { workspace = true }
cimmeria-commands = { workspace = true }
cimmeria-observability = { workspace = true }
# Discord notification emits at semantic seams (login/world-entry/disconnect/
# errors/…). The crate's global-singleton `emit_*` API means no handle
# threading — calls are no-ops until the server bin runs `cimmeria_discord::init`.
cimmeria-discord = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
# Auth TLS termination. `tokio-rustls` re-exports `rustls`;
# `rustls-pemfile` loads the PEM cert chain + private key; `arc-swap` holds the
# live `rustls::ServerConfig` so `reload_certs()` can hot-swap it per-connection
# without dropping the listener.
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
arc-swap = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rand_chacha = { workspace = true }
quick-xml = { workspace = true }
# Password storage: argon2id for stored hashes, sha1 to recompute the legacy
# client hash during opportunistic on-login migration.
argon2 = { workspace = true }
sha1 = { workspace = true }
sqlx = { workspace = true }
zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Re-pull mercury with the `test-support` feature so handler unit tests can
# use `cimmeria_mercury::test_transport::TestTransport` (the recording UDP
# fake) in place of a real socket. Additive over the `[dependencies]` entry
# above — it only activates the extra feature for the test build. See
# docs/architecture/transport-trait.md.
cimmeria-mercury = { path = "../mercury", features = ["test-support"] }

# HTTP client for the login smoke (drives the auth Phase 1 / Phase 2
# endpoints in-process). Already used elsewhere in the workspace, so
# version comes from the workspace lock.
reqwest = { workspace = true }

# Property-based testing — used by the AoI differential test to drive
# random entity walks across many ticks and verify that the per-event
# diff-accumulated witness set always equals the actual witness set.
proptest = { workspace = true }

# Implement the `Transport` trait in tests that need send-failure
# injection (e.g. partial-fragment recovery guard). Mercury's trait
# uses `#[async_trait]`, so any implementor must also pull it in.
async-trait = { workspace = true }

# Log-capture for negative-logging regression guards.
# Tests install a custom `Layer` to assert that a specific WARN/ERROR
# event fired with the expected structured fields. Without this, a
# reverted log change goes undetected. See `test_support::LogCapture`.
tracing-subscriber = { workspace = true }

# Self-signed cert generation for the auth-TLS integration test. Crate-local
# dev-dependency (not a workspace dep) so it stays out of the production
# dependency graph. Emits PEM, which the same `rustls-pemfile` path the
# production loader uses then parses.
rcgen = "0.14"

# `ServiceExt::oneshot` for driving the HSTS middleware through a Router in a
# unit test without standing up a socket.
tower = { workspace = true }
