[package]
name = "cimmeria-services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Server service implementations for the Cimmeria server emulator"

[dependencies]
cimmeria-common = { workspace = true }
cimmeria-mercury = { workspace = true }
cimmeria-entity = { workspace = true }
cimmeria-game = { workspace = true }
cimmeria-content-engine = { workspace = true }
cimmeria-observability = { workspace = true }
cimmeria-occluder = { workspace = true }
# The auth service, login audit events and credential redaction, split out
# in wave W1a (docs/architecture/services-crate-split.md). Re-exported from
# lib.rs at the old `auth`, `audit` and `credential_redaction` paths.
cimmeria-auth = { workspace = true }
# The Base<->Cell wire contract (method indices, BSF bits, payload
# serializers), split out of this crate; old paths re-export it.
cimmeria-wire = { workspace = true }
# The decoded wire-message stream (`wire.in` / `wire.out`) and the per-session
# packet tap, split out in wave W3b. Re-exported from lib.rs as `wire_log`.
cimmeria-wire-log = { workspace = true }
# Discord notification emits at semantic seams (login/world-entry/disconnect/
# errors/…). The crate's global-singleton `emit_*` API means no handle
# threading — calls are no-ops until the server bin runs `cimmeria_discord::init`.
cimmeria-discord = { workspace = true }
# Cooked-data PAK cache + Cimmeria's overrides and the CharDef table, split out
# of this crate (docs/architecture/services-crate-split.md, W1b). Re-exported
# at `base::{resources, chardef, *_overrides}`.
cimmeria-resources = { workspace = true }
# The cell's DB-backed startup catalogs (spawner loaders, ability trees, the
# respawner search), split out of this crate (W2b). Re-exported at
# `cell::{spawner, respawner_fallback}` and `ability_tree`.
cimmeria-cell-catalog = { workspace = true }
# The in-process SmartFoxServer host for the Flash minigames, split out of this
# crate (W3c). Re-exported at `minigame`.
cimmeria-minigame = { workspace = true }
# The BaseApp's per-connection session layer (session types, send helpers,
# deferred AoI, outbox, tick sync, cooked data, contact list, crafting, ...),
# split out of this crate (B1). Re-exported at the old `base::` paths.
cimmeria-base-session = { workspace = true }
# The cell's world state (SpaceManager, the NPC AI's state primitives, the ring
# FSM, the synchronous effect scripts, the GM gate, ContentEvents), split out
# of this crate (C1). Re-exported at the old `cell::…` paths.
cimmeria-cell-world = { workspace = true }
# The cell's combat (abilities, damage, death, threat, the auto-cycle, effect
# pulsing, the NPC AI's behaviour, the bandolier and reload handlers), split
# out of this crate (C2). Re-exported at the old `cell::…` paths.
cimmeria-cell-combat = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
quick-xml = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[features]
# Opt-in seam for services-layer chaos integration tests that need to
# inject a `LossyTransport` in place of the real UDP socket inside a live
# `BaseService`/`Orchestrator` (as opposed to the in-process handler unit
# tests, which use `TestTransport` via `[dev-dependencies]`'s own
# `test-support` re-pull below). Off by default so production builds never
# link `lossy_transport` or its RNG state. External consumers (e.g.
# `cimmeria-wireclient`'s live-DB chaos tests) pull it in via:
# `cimmeria-services = { path = "../services", features = ["chaos-testing"] }`.
# See docs/architecture/network-chaos-testing.md and
# `BaseService::set_transport_override`.
chaos-testing = ["cimmeria-mercury/test-support"]

[dev-dependencies]
# Re-pull tokio with `test-util` so time-dependent tests can freeze and
# advance the clock (`#[tokio::test(start_paused = true)]` +
# `tokio::time::advance`). Used by the cinematic AoI hold tests. Additive
# over the `[dependencies]` entry — the feature only reaches test targets,
# not the server binary.
tokio = { workspace = true, features = ["test-util"] }

# Re-pull mercury with the `test-support` feature so handler unit tests can
# use `cimmeria_mercury::test_transport::TestTransport` (the recording UDP
# fake) in place of a real socket. Additive over the `[dependencies]` entry
# above — it only activates the extra feature for the test build. See
# docs/architecture/transport-trait.md.
cimmeria-mercury = { path = "../mercury", features = ["test-support"] }

# Implement the `Transport` trait in tests that need send-failure
# injection (e.g. partial-fragment recovery guard). Mercury's trait
# uses `#[async_trait]`, so any implementor must also pull it in.
async-trait = { workspace = true }

# Generic test helpers: the live-DB gate (`require_db_or_skip!`),
# `LogCapture` and the `TestTransport` re-export. Re-exported from the
# `#[cfg(test)] mod test_support` shim, so tests import them from
# `crate::test_support`. Every crate with this dev-dependency must be listed
# in tools/test-live-db.{sh,ps1}; `live_db_wrapper_lists_every_test_support_crate`
# enforces it.
cimmeria-test-support = { workspace = true }

# `test_default_connected_client_state`, re-exported from the `test_support`
# shim, for the base tests that stay here.
cimmeria-base-session = { workspace = true, features = ["test-support"] }
# The world fixtures (`test_fixtures`: `make_space_manager*`, the occluder and
# arrival-mesh helpers, the `ContentEvents` fakes) and the test-only hooks
# (`force_ai_state`, `StepRegionReplayGuard::is_idle`, `resolve_use_cover`),
# re-exported from the `test_support` shim. Its feature also turns on
# `cell::cover::TEST_WORLD_ID` (cimmeria-cell-cover's `test-support`) for the
# cover tests that stay here because they drive the NPC AI (npc_ai_cover*,
# ticks/cover).
cimmeria-cell-world = { workspace = true, features = ["test-support"] }
# The combat test hooks (`resolve_death_for_test`, `npc_ai_tick_for_test`,
# `npc_ai_follow_for_test`, `force_ai_state` through `npc_ai`, ...) for the
# tests that stay here because they drive the service loop or the content
# engine.
cimmeria-cell-combat = { workspace = true, features = ["test-support"] }
