[package]
name = "cimmeria-mercury"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mercury network protocol — reliable UDP and TCP inter-service framing for Cimmeria"

[dependencies]
cimmeria-common = { workspace = true }

tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }

# Cryptography (AES-256-CBC + HMAC-MD5 — must be byte-identical to C++ implementation)
aes = { workspace = true }
cbc = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }

# Codec / framing
tokio-util = { version = "0.7", features = ["codec"] }
cipher = "0.5"
digest = "0.10"

[features]
# Exposes `test_transport::TestTransport`, a recording `Transport` impl for
# byte-exact fan-out assertions. Consumer crates pull it in via a
# dev-dependency: `cimmeria-mercury = { path = "../mercury", features =
# ["test-support"] }`. Kept off by default so production builds never include
# the recorder. See docs/architecture/transport-trait.md.
test-support = []

# Exposes `test_harness`, the Tier 2 loopback Mercury session harness for
# end-to-end paired-channel tests (reliable delivery under simulated loss,
# fragment reassembly, keepalive cadence, encryption round-trip, handshake,
# ack aggregation, RTO convergence). Consumer crates pull it in via a
# dev-dependency: `cimmeria-mercury = { path = "../mercury", features =
# ["test-harness"] }`. Kept off by default so production builds never include
# the harness, its `TestClock`, or its `tokio::net::UdpSocket` recv pumps.
# See docs/architecture/mercury-loopback-harness.md.
test-harness = []

[dev-dependencies]
# Property-based round-trip tests for the wire-format codec. The
# packet builders + parse_incoming are example-tested in
# packet/replay_smoke.rs; proptest widens that coverage to the full
# valid input space.
proptest = { workspace = true }
