[package]
name = "cimmeria-mercury"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mercury network protocol — reliable UDP and TCP inter-service framing for Cimmeria"

[dependencies]
cimmeria-common = { workspace = true }

tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
# ChaCha20 RNG — bitwise-deterministic across platforms (unlike StdRng).
# Used by `test_harness::policy::DropProbability` and by
# `lossy_transport::LossyTransport`. Kept as a regular dependency
# (not optional) so the bare `cargo test -p cimmeria-mercury`
# invocation works without `--features` plumbing. The modules
# themselves are `#[cfg(any(test, feature = "..."))]`-gated, so
# `rand_chacha` is only linked into binaries that actually need it
# (test executables + consumer crates that opt into the chaos
# features); production builds exclude both the modules and the
# dep's code via dead-code elimination.
rand_chacha = { workspace = true }
async-trait = { workspace = true }

# Cryptography
#  - v1 (legacy, byte-identical to the C++ client): AES-256-CBC + HMAC-MD5.
#  - v2: AES-256-CBC + HMAC-SHA256 (truncated to 16 bytes),
#    per-packet random IV, HKDF-SHA256 key separation.
aes = { workspace = true }
cbc = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
# v2 key separation (HKDF-SHA256) + integrity (HMAC-SHA256 via sha2).
hkdf = { workspace = true }
sha2 = { workspace = true }

# Codec / framing
tokio-util = { version = "0.7", features = ["codec"] }
cipher = "0.5"
digest = "0.11"

[features]
# Exposes `test_transport::TestTransport`, a recording `Transport` impl for
# byte-exact fan-out assertions, and `lossy_transport::LossyTransport`, the
# chaos-testing wrapper. Both pull in `rand_chacha` for seeded determinism.
# Consumer crates pull it in via a dev-dependency: `cimmeria-mercury = {
# path = "../mercury", features = ["test-support"] }`. Kept off by default
# so production builds never include the recorder or the RNG state. See
# docs/architecture/transport-trait.md and
# docs/architecture/network-chaos-testing.md.
test-support = []

# Exposes `test_harness`, the Tier 2 loopback Mercury session harness for
# end-to-end paired-channel tests (reliable delivery under simulated loss,
# fragment reassembly, keepalive cadence, encryption round-trip, handshake,
# ack aggregation, RTO convergence). Pulls in `rand_chacha` for the
# chaos-primitives' seeded RNG. Consumer crates pull it in via a
# dev-dependency: `cimmeria-mercury = { path = "../mercury", features =
# ["test-harness"] }`. Kept off by default so production builds never include
# the harness, its `TestClock`, or its `tokio::net::UdpSocket` recv pumps.
# See docs/architecture/mercury-loopback-harness.md.
test-harness = []

[dev-dependencies]
# Property-based round-trip tests for the wire-format codec. The
# packet builders + parse_incoming are example-tested in
# packet/replay_smoke.rs; proptest widens that coverage to the full
# valid input space.
proptest = { workspace = true }
# Pcap file parsing for the network-chaos pcap-replay regression
# harness. Pure-Rust, supports both classic pcap and pcap-ng.
# Used by `test_harness::pcap_replay` to load the lomiada fixture
# from debug/lomiada-broke-in-hallway02/ and replay it against a
# synthetic Channel for the deterministic regression test.
pcap-file = "2.0"
# Ethernet + IPv4 + UDP frame parser used to extract Mercury UDP
# payloads from pcap records. Cross-platform, no system libpcap
# needed.
etherparse = "0.20"
