[package]
name = "cimmeria-supervisor"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }

# No tests in this binary: `test = false` stops cargo building a test harness for it
# (an uncacheable compile and link on every CI run). Remove it if you add a test.
[[bin]]
name = "cimmeria-supervisor"
path = "src/main.rs"
test = false
