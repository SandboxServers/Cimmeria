[package]
name = "cimmeria-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cimmeria server binary — starts Auth, Base, and Cell services"

[[bin]]
name = "cimmeria-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
cimmeria-admin-api = { workspace = true }
cimmeria-common = { workspace = true }
cimmeria-discord = { workspace = true }
cimmeria-services = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
# OpenTelemetry exporter — ships logs/traces/metrics to SigNoz (or any
# OTLP collector) via gRPC. The integration is opt-in via the standard
# `OTEL_EXPORTER_OTLP_ENDPOINT` env var; with it unset the exporter is
# a no-op and these crates' code never executes.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "logs"] }
# Bridges root-level `tracing::*` events (those NOT inside an active span)
# into OpenTelemetry log records. `tracing-opentelemetry` alone only handles
# spans and span-events; without this appender, every `tracing::info!` that
# fires outside a span (including the entire mercury.packet stream) is
# silently dropped by the OTLP exporter and never reaches SigNoz.
opentelemetry-appender-tracing = "0.27"
tracing-opentelemetry = "0.28"
