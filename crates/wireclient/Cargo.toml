[package]
name = "cimmeria-wireclient"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless wire-level test client for the Cimmeria SGW server — drives the SOAP auth, Mercury handshake, and replays captured Castle Cellblock sessions for end-to-end validation"

[dependencies]
cimmeria-common = { workspace = true }
cimmeria-mercury = { workspace = true }

tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SOAP/HTTP — auth Phase 1+2.
reqwest = { workspace = true }

# XML response parsing (Phase 1 + Phase 2 responses use the same XML shape
# already exercised by cimmeria-services' auth handlers).
quick-xml = { workspace = true }

# Hex-encoded session keys come down from the auth server as 64-char strings;
# decode here before handing to `cimmeria_mercury::MercuryEncryption`.
hex = "0.4"

[dev-dependencies]
# Drive the in-process AuthService for the auth-smoke; mirrors the
# `cimmeria-services::auth::login_smoke` pattern so wireclient covers the
# client side of the same handshake the server side already pins.
cimmeria-services = { path = "../services" }
