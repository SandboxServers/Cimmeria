[package]
name = "cimmeria-wireclient"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless wire-level test client for the Cimmeria SGW server — drives the SOAP auth, Mercury handshake, and replays captured Castle Cellblock sessions for end-to-end validation"

[dependencies]
cimmeria-common = { workspace = true }
# `test-harness` pulls in the Tier 2 loopback Channel driver
# (`LoopbackPeer`/`TestClock`/`NetworkPolicy`). Wireclient is itself a
# testing crate with no production consumers, so it always enables this —
# `session.rs` reuses `LoopbackPeer` as the client-side Channel state
# machine (reassembly, ACK piggyback, retransmit bookkeeping) against a
# REAL BaseApp socket instead of a paired loopback peer. See
# `docs/architecture/wireclient.md` Phase 1.5.
# `test-support` pulls in `lossy_transport::{LossyTransport, LossyConfig,
# LossyProfile}` -- the network-chaos wrapper the lossy-network E2E test
# installs on the server side via `cimmeria-services`'s `chaos-testing`
# feature (see the dev-dependency below).
cimmeria-mercury = { workspace = true, features = ["test-harness", "test-support"] }

tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SOAP/HTTP — auth Phase 1+2.
reqwest = { workspace = true }

# Hex-encoded session keys come down from the auth server as 64-char strings;
# decode here before handing to `cimmeria_mercury::MercuryEncryption`.
hex = "0.4"

[dev-dependencies]
# Drive the in-process AuthService for the auth-smoke, and the full
# Orchestrator (auth+base+cell) for the two-client Castle visibility
# end-to-end test (NA37). Mirrors the `cimmeria-services::auth::login_smoke`
# pattern so wireclient covers the client side of the same handshake the
# server side already pins. `chaos-testing` additionally exposes
# `BaseService::set_transport_override` for the lossy-network E2E variant
# (NA37 round 2).
cimmeria-services = { path = "../services", features = ["chaos-testing"] }

# Sentinel account/character rows for the live-DB two-client test --
# same insert-and-clean-up-by-exact-sentinel convention as
# `crates/services/src/test_support.rs`'s live-DB guards.
sqlx = { workspace = true }
tracing-subscriber = { workspace = true }
