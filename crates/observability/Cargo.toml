[package]
name = "cimmeria-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metrics facade — thin macro layer over the OpenTelemetry SDK's metrics API. counter!, histogram!, gauge! emit through the same OTLP exporter as tracing spans, ship to SigNoz."

[dependencies]
# Tracks the same major as crates/server's OTel stack — re-vendor in
# lockstep when bumping (the SDK's Meter type is the API we expose).
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"] }

[dev-dependencies]
tokio = { workspace = true }
