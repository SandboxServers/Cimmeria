[package]
name = "cimmeria-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metrics facade — thin macro layer over the OpenTelemetry SDK's metrics API. counter!, histogram!, gauge! emit through the same OTLP exporter as tracing spans, ship to SigNoz."

[dependencies]
# Tracks the same major as crates/server's OTel stack — re-vendor in
# lockstep when bumping (the API crate's `Meter` is the type we expose).
# The SDK and OTLP exporter are wired up only in crates/server; this facade
# needs just the API, which keeps tonic/prost out of cimmeria-services'
# dependency graph.
opentelemetry = "0.32"
