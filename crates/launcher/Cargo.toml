[package]
name = "sgw-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stargate Worlds launcher — installs the game from a seed + patch manifest, launches SGW.exe or the Atera debug bat, and uploads debug logs to Azure Blob."

[dependencies]
# Native window + immediate-mode UI. Default-features off so we don't pull in
# `persistence` (we manage our own JSON state file) or accesskit.
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"

# HTTP. Declared directly (not via `workspace = true`) so we can disable
# the default native-tls feature — cargo currently warns when overriding
# `default-features` on a workspace dep that didn't explicitly set it.
# rustls-tls keeps the binary independent of system OpenSSL / Schannel.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }

tokio = { workspace = true }
tokio-util = "0.7"
futures-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

sha2 = { workspace = true }
zip = { workspace = true }

# Per-install UUID for the telemetry identity. `v4` only — no parsing
# of externally-supplied UUIDs.
uuid = { version = "1", features = ["v4", "serde"] }

# Gzip compression for telemetry chunk uploads.
flate2 = "1"

walkdir = "2"
gethostname = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Maintained fork of `fs2`. Used for the single-instance file lock — a
# second launcher process opening the same lock fails `try_lock_exclusive`
# instead of stomping shared state.
fs4 = "0.13"
# Ed25519 detached signature verification on the manifest. Defaults off
# bring the dep down to just what we need (no rand for signing — the
# launcher only verifies — and no PEM/PKCS#8 parsing).
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

thiserror = { workspace = true }

# Direct Win32 calls. Currently used for a `MessageBoxW` on fatal startup
# errors — with `windows_subsystem = "windows"` (release builds), `stderr`
# isn't attached to anything on a double-click, so an `eprintln!` + exit
# becomes a silent crash for end users. Version aligned with the highest
# windows-sys already in the workspace lockfile to avoid pulling a 5th
# copy of the sys bindings.
[target.'cfg(windows)'.dependencies]
# Win32_System_Registry: read MachineGuid for the telemetry machine_id.
# Win32_System_Threading + Win32_System_Memory + Win32_System_Diagnostics_Debug + Win32_System_LibraryLoader:
# CreateProcess(SUSPENDED) -> VirtualAllocEx -> WriteProcessMemory ->
# CreateRemoteThread(LoadLibraryW) -> ResumeThread, the DLL-injection
# path used by `inject.rs` to side-load cimmeria-client-telemetry.dll
# into SGW.exe at game start (issue #417).
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
# Embeds icons/icon.ico into the .exe as a Win32 resource when targeting
# Windows. No-op on non-Windows targets — see build.rs.
winres = "0.1"

[dev-dependencies]
tempfile = "3"
# Mock HTTP server for the install / download pipeline tests. Lets us assert
# Range-header resume, status-code branches, and call-count expectations
# (e.g. "second pass over an idempotent install hits the server zero times").
wiremock = "0.6"
