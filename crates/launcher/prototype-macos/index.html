<!doctype html>
<!-- THROWAWAY: Three Mac launcher experiences, ?variant=A/B/C. No real installation. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cimmeria · Mac launcher concepts</title>
<style>
:root{color-scheme:dark;--bg:#15191e;--panel:#22272e;--muted:#a4aebc;--line:#ffffff18;--accent:#87d5e7;--ink:#f4f5f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#233644 0%,#10151a 65%);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:58px 28px 152px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 17px;background:#ffffff09;color:inherit}button:hover{filter:brightness(1.18);background-color:#ffffff15}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);border:0;color:#10262e;font-weight:650;padding:13px 24px}.primary:hover{background:var(--accent)}.secondary{background:transparent}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700;color:var(--accent)}h1{font-size:42px;font-weight:560;letter-spacing:-1.7px;line-height:1.1;margin:15px 0}h2{font-size:25px;letter-spacing:-.6px;font-weight:560;margin:10px 0}p{line-height:1.65}small{font-size:12px}.window{border:1px solid #ffffff25;border-radius:16px;background:var(--bg);box-shadow:0 30px 90px #0007;overflow:hidden;margin:auto;max-width:1030px}.titlebar{height:43px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:7px;font-size:12px;color:var(--muted)}.dot{width:11px;height:11px;border-radius:100%;background:#ff6158}.dot:nth-child(2){background:#ffbd2e}.dot:nth-child(3){background:#28c840}.titlebar span:last-child{margin:auto;padding-right:44px}.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;border:1px solid var(--line);padding:6px 10px;border-radius:30px}.green{color:#a6dec0}.pip{height:6px;width:6px;border-radius:50%;background:currentColor}.gate{width:250px;height:250px;border:15px solid #304e5c;border-radius:50%;position:relative;box-shadow:0 0 0 2px #88d3de55,inset 0 0 0 5px #15272f,inset 0 0 45px #6cdaee88,0 0 60px #42aecb22;background:radial-gradient(ellipse at 40% 40%,#a5e2e550,#256f8330 40%,#10252e);margin:25px auto}.gate:before{content:'';position:absolute;inset:-23px;border:2px dashed #7396a1;border-radius:50%;transform:rotate(15deg)}.gate:after{content:'⌃';position:absolute;top:-34px;left:86px;color:#ffc78e;font-size:50px;text-shadow:0 0 20px #ffa769}.gate-label{text-align:center;letter-spacing:4px;font-size:10px;color:#9fc0c9;margin-top:34px}.row{display:flex;align-items:center;gap:12px}.space{justify-content:space-between}.status{border:1px solid var(--line);border-radius:11px;background:#ffffff04;padding:17px;margin:20px 0}.progress{height:5px;background:#ffffff12;border-radius:5px;margin:16px 0 9px;overflow:hidden}.progress i{height:100%;display:block;background:var(--accent);transition:width .4s}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}.choice{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:12px;line-height:1.5;margin:18px 0}.choice input{accent-color:var(--accent);margin-top:3px}.details{font-size:12px;line-height:1.7;color:var(--muted);padding:12px 0}.details code{color:var(--accent)}.assistant{display:grid;grid-template-columns:36% 1fr;min-height:570px}.assistant aside{background:linear-gradient(165deg,#203744,#16242d);padding:35px 30px;border-right:1px solid var(--line)}.assistant .gate{width:174px;height:174px;border-width:12px;margin:62px auto 32px}.assistant .gate:after{left:50px}.assistant main{padding:48px 45px}.steps{list-style:none;padding:0;margin-top:36px;color:#89a3b0;font-size:12px}.steps li{display:flex;gap:12px;margin:20px 0}.steps b{border:1px solid #ffffff24;border-radius:50%;width:20px;height:20px;text-align:center;font-size:10px;line-height:18px}.steps .active{color:white}.game-home{min-height:570px;max-width:800px;margin:auto}.game-home main{position:relative;padding:35px 38px}.game-home .hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;min-height:270px}.game-home .hero h1{font-size:45px}.game-home .gate{width:190px;height:190px;margin:20px}.game-home .gate:after{left:57px}.game-home .status{margin:10px 0}.game-home .bottom{display:flex;gap:25px;border-top:1px solid var(--line);padding-top:20px;margin-top:26px;font-size:12px}.compact{max-width:480px}.compact main{padding:29px 32px}.compact .gate{width:118px;height:118px;border-width:8px;margin:24px auto}.compact .gate:before{inset:-15px}.compact .gate:after{left:30px;top:-27px;font-size:37px}.compact h1{font-size:29px;letter-spacing:-.8px}.compact .primary{width:100%}.compact .actions{display:block}.compact .actions .secondary{display:block;margin:12px auto 0}.compact .intro{text-align:center}.notice{font-size:12px;color:#e6c594}.prototype-top{position:fixed;top:14px;left:0;right:0;text-align:center;color:#a7b5c3;font-size:11px;letter-spacing:.4px}.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(830px,calc(100% - 28px));padding:13px 16px;background:#0c1016ed;border:1px solid #ffffff30;box-shadow:0 8px 25px #0009;border-radius:14px;backdrop-filter:blur(20px)}.controls .row{flex-wrap:wrap;justify-content:center;gap:8px}.controls button{padding:7px 11px;font-size:12px}.controls strong{min-width:195px;text-align:center;font-size:12px}.state{font:10px ui-monospace,monospace;text-align:center;color:#8e9eae;margin-top:10px}.toolbar-label{color:#899aaa;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-right:6px}@media(max-width:760px){body{padding:52px 12px 180px}.assistant{grid-template-columns:1fr}.assistant aside{display:none}.assistant main{padding:28px}.game-home{grid-template-columns:1fr}.game-home main{padding:25px}.game-home .hero{grid-template-columns:1fr}.game-home .hero .art{display:none}h1{font-size:32px}.controls{bottom:8px}.game-home .bottom{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:0 0 25px;padding-bottom:8px}.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 16px}.tabs button[aria-pressed="true"]{background:#87d5e714;color:var(--accent)}.telemetry-footer{border-top:1px solid var(--line);margin-top:27px;padding-top:3px}.telemetry-footer .choice{color:var(--ink)}.telemetry-footer small{color:var(--muted)}.notes article{border-bottom:1px solid var(--line);padding:14px 0}.notes h3{font-size:17px;font-weight:550;margin:9px 0}.notes li{color:var(--muted);line-height:1.65;margin:7px 0}.notes ul{padding-left:19px}.notes .sample{font-size:11px;color:#e6c594}.assistant aside .aside-copy{margin-top:40px;font-size:12px;line-height:1.8;color:#a4bac6}
.tabs .gear{margin-left:auto;font-size:20px;line-height:18px;padding:8px 12px}.settings-panel{border:1px solid var(--line);border-radius:12px;background:#1b222b;padding:20px;margin-bottom:22px}.settings-panel h2{font-size:19px}.install-path{overflow-wrap:anywhere;font:12px ui-monospace,monospace;color:var(--muted);line-height:1.7;margin:12px 0}.settings-panel .actions{margin-top:15px}.danger{color:#ffaaa5;border-color:#ffaaa540}.settings-panel .explain{font-size:12px;color:var(--muted);line-height:1.6}.confirm-box{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.settings-panel [role="status"]{font-size:12px;color:var(--accent);margin-top:12px}
</style></head><body><div class="prototype-top">INTERACTIVE CONCEPT · Simulated installation and gameplay · Nothing is downloaded or changed</div><div id="app"></div><div class="controls"><div class="row"><button id="prev" aria-label="Previous concept">←</button><strong id="variant-label"></strong><button id="next" aria-label="Next concept">→</button><button data-action="reset">Start over</button></div><div class="row" style="margin-top:10px"><span class="toolbar-label">Try a scenario</span><button id="ready">Ready to play</button><button data-action="fail">Missing prerequisite</button><button data-action="advance">Next install step</button></div><div class="state" id="state"></div></div>
<script type="module">
import {initial,transition,steps} from './state.mjs';
let state=initial();let variant=new URL(location.href).searchParams.get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';
let manifest=null; let manifestError=false;
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={A:'A — Split layout',B:'B — Stargate home',C:'C — Compact launcher'};
const titlebar=()=>'<div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>Stargate Worlds</span></div>';
const gate=()=>'<div class="gate" aria-hidden="true"></div>';
const info=()=>state.details?'<div class="details">Compatibility: managed WoWSilicon runtime (proposed)<br>Game: original Windows client · client patches enabled<br>Location: Application Support / Cimmeria (proposed)<br>Diagnostics: '+(state.telemetry?'opted in':'off')+'<br><strong>Prototype only:</strong> no runtime, disk, server, or game checks performed.</div>':'';
function status(){const p=state.phase;if(p==='welcome')return '<div class="status"><div class="row space"><span>One setup. Then just Play.</span><span class="pill">Apple Silicon</span></div><p class="muted" style="margin-bottom:0;font-size:12px">We’ll prepare compatibility, install the original game, and apply Cimmeria patches. You won’t need to configure Wine.</p></div>';if(p==='installing')return '<div class="status" role="status"><div class="row space"><strong>'+steps[state.step]+'</strong><span class="muted">'+(state.step+1)+' / 5</span></div><div class="progress"><i style="width:'+((state.step+1)*20)+'%"></i></div><small class="muted">Demo progress · use “Next install step” below.</small></div>';if(p==='ready')return '<div class="status"><div class="row space"><span class="green">● Ready to play</span><small class="muted">Example state</small></div><p class="muted" style="font-size:12px;margin-bottom:0">Game files and compatibility checks complete. Client patches enabled.</p></div>';if(p==='repair')return '<div class="status"><strong class="notice">One more step before you play</strong><p class="muted" style="font-size:12px">A required game component is missing. We can retry its installation. Your game files and settings will be kept.</p><small class="muted">Example: legacy PhysX runtime not detected.</small></div>';return '<div class="status"><span class="green">● Game running</span><p class="muted" style="font-size:12px;margin-bottom:0">Sign in inside Stargate Worlds. The launcher stays available when you return.</p><small class="muted">Simulation only; no game was started.</small></div>';}
function actions(){const p=state.phase;const a={welcome:['install','Install Stargate Worlds'],repair:['repair','Repair & continue'],ready:['play','Play'],playing:['return','Return to launcher']}[p];return '<div class="actions">'+(a?'<button class="primary" data-action="'+a[0]+'">'+a[1]+'</button>':'<span class="muted">Preparing your game…</span>')+'<button class="secondary" data-action="details">'+(state.details?'Hide details':'View details')+'</button></div>'+info();}
function consent(){return '<div class="telemetry-footer"><label class="choice"><input type="checkbox" data-action="telemetry" '+(state.telemetry?'checked':'')+'><span>Share diagnostic logs <strong>· '+(state.telemetry?'On':'Off')+'</strong><br><small>Optional. Help diagnose crashes and game issues. Change this anytime.</small><br><small>'+(state.phase==='playing'?'This change applies on your next game launch.':'Your choice applies when you next launch the game.')+'</small></span></label></div>';}
function tabs(){return '<div class="tabs" aria-label="Launcher sections"><button data-action="tab-play" aria-pressed="'+(state.tab==='play')+'">Play</button><button data-action="tab-notes" aria-pressed="'+(state.tab==='notes')+'">Patch Notes</button><button class="gear" data-action="settings" aria-label="Game settings" title="Game settings" aria-expanded="'+state.settings+'">⚙</button></div>';}
function settings(){if(!state.settings)return '';const allowed=['ready','repair'].includes(state.phase);return '<section class="settings-panel" aria-label="Game settings"><h2>Game settings</h2><small class="muted">Local install directory · proposed default</small><div class="install-path">~/Library/Application Support/Cimmeria/Game</div><button data-action="open-folder">Open in Finder ↗</button><p class="explain">Repair checks game files and replaces missing or damaged files. Your preferences are kept.</p><div class="actions"><button data-action="repair-game" '+(!allowed?'disabled':'')+'>Repair game</button><button class="danger" data-action="uninstall" '+(!allowed?'disabled':'')+'>Uninstall…</button></div>'+(!allowed?'<p class="explain">'+(state.phase==='playing'?'Quit the game to repair or uninstall it.':state.phase==='installing'?'Finish installation before repairing or uninstalling.':'Install the game to enable repair and uninstall.')+'</p>':'')+(state.confirmUninstall?'<div class="confirm-box"><strong>Uninstall Stargate Worlds?</strong><p class="explain">This would remove downloaded game files. Launcher preferences and your server characters would be kept. You can reinstall later.</p><p class="notice">Prototype only. No files will be removed.</p><div class="actions"><button data-action="cancel-uninstall">Keep game</button><button class="danger" data-action="confirm-uninstall">Uninstall game</button></div></div>':'')+(state.notice?'<div role="status">'+state.notice+'</div>':'')+'</section>';}
function notes(){const source='<p class="muted" style="font-size:12px">From the <a style="color:var(--accent)" href="https://github.com/SandboxServers/Cimmeria/releases/tag/content-current" target="_blank" rel="noopener noreferrer">launcher content manifest ↗</a><br>Release snapshot fetched for this prototype · not an installed-patch list.</p>';if(!manifest)return '<section class="notes"><h2>Patch notes</h2>'+source+'<p class="muted">'+(manifestError?'Could not load the manifest snapshot. Open the source release above.':'Loading patch information…')+'</p></section>';return '<section class="notes"><span class="eyebrow">CURRENT CLIENT PATCHES · '+manifest.patches.length+'</span><h2>Patch notes</h2>'+source+manifest.patches.map(p=>'<article><small class="muted">'+escapeHtml(p.id)+'</small><h3>'+escapeHtml(p.title||p.id)+'</h3><p class="muted">'+escapeHtml(p.description||'No description provided in the manifest.')+'</p></article>').join('')+'</section>';}
function content(){return tabs()+settings()+(state.tab==='notes'?notes():status()+actions()+(state.phase==='welcome'?'<p class="muted" style="font-size:11px;margin-top:20px">First installation downloads about 4.1 GB. A server account is needed to sign in inside the game.</p>':''))+consent();}
function heading(){return {welcome:['Your next adventure,<br>without the setup.','A familiar Mac app. The original Stargate Worlds.'],installing:['We’ll take it<br>from here.','Everything your game needs, in one place.'],ready:['The gate is ready.','Continue your journey on Cimmeria.'],repair:['Let’s get you<br>back on track.','A fixable setup issue. No need to start over.'],playing:['See you on<br>the other side.','Your adventure is running.']}[state.phase];}
function render(){const [h,sub]=heading();let inner='';if(variant==='A'){inner='<div class="window">'+titlebar()+'<div class="assistant"><aside><div class="eyebrow">Cimmeria · for Mac</div>'+gate()+'<div class="gate-label">A WORLD BEYOND</div><p class="aside-copy">Stargate Worlds.<br>Install once. Step through the gate.</p></aside><main><span class="pill">STARGATE WORLDS</span><h1>'+(state.tab==='notes'?'Your next adventure.':h)+'</h1><p class="muted">'+sub+'</p>'+content()+'</main></div></div>';}else if(variant==='B'){inner='<div class="window">'+titlebar()+'<div class="game-home"><main><div class="row space"><span class="eyebrow">Cimmeria · for Mac</span><span class="pill">Cimmeria server</span></div><div class="hero"><div><p class="muted" style="font-size:11px;letter-spacing:3px">STEP INTO ANOTHER WORLD</p><h1>STARGATE<br>WORLDS</h1><p class="muted">'+sub+'</p></div><div class="art">'+gate()+'</div></div>'+content()+'</main></div></div>';}else{inner='<div class="window compact">'+titlebar()+'<main><div class="intro"><span class="eyebrow">Cimmeria for Mac</span>'+gate()+'<h1>Stargate Worlds</h1><p class="muted">'+sub+'</p></div>'+content()+'</main></div>';}
document.querySelector('#app').innerHTML=inner;document.querySelector('#variant-label').textContent=names[variant];document.querySelector('#state').textContent='SIMULATED STATE  '+JSON.stringify(state);document.querySelector('[data-action="advance"]').disabled=state.phase!=='installing';document.querySelector('[data-action="fail"]').disabled=!['installing','ready'].includes(state.phase);}
function switchVariant(dir){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+dir+3)%3];const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState({},'',u);render();}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a){state=transition(state,a);render();}});
document.querySelector('#prev').onclick=()=>switchVariant(-1);document.querySelector('#next').onclick=()=>switchVariant(1);document.querySelector('#ready').onclick=()=>{state={...state,phase:'ready',step:4};render();};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')switchVariant(-1);if(e.key==='ArrowRight')switchVariant(1);});render();
fetch('./manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Manifest unavailable');return r.json();}).then(m=>{if(m.schema!==1||!Array.isArray(m.patches))throw new Error('Invalid manifest');manifest=m;render();}).catch(()=>{manifestError=true;render();});
</script></body></html>
