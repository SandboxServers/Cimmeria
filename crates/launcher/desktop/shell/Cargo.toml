[package]
name = "cimmeria-launcher-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
cimmeria-launcher-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
cimmeria-launcher-engine = { path = "../engine", features = ["test-support"] }
wiremock = "0.6"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
serde_json = "1"
tempfile = "3"
