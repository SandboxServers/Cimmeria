[package]
name = "cimmeria-launcher-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }
# build.rs checks CIMMERIA_LAUNCHER_VERSION (src/release_version.rs).
semver = "=1.0.28"
serde_json = "1"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
cimmeria-launcher-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "std"] }
tracing-appender = "0.2"
serde_json = "1"
# The self-test (`--self-test-rar`) hands the unpack pipeline a cancel token.
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
# The engine's HTTP client (same version and TLS), used before Tauri starts to
# fetch the WebView2 bootstrapper (PD-41); no new crate in Cargo.lock.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
minisign = "=0.8.0"
base64 = "=0.22.1"
cimmeria-launcher-engine = { path = "../engine", features = ["test-support"] }
wiremock = "0.6"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
serde_json = "1"
semver = "=1.0.28"
tempfile = "3"
sha2 = "0.10"
cimmeria-runtime-probe = { path = "../runtime-probe" }
