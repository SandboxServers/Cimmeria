[package]
name = "cimmeria-launcher-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cimmeria-launcher-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
