[package]
name = "cimmeria-runtime-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Diagnostics_Debug", "Win32_System_WindowsProgramming"] }
