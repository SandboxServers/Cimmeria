[package]
name = "cimmeria-defs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Entity definitions parsed from .def XML files at compile time"
build = "build/main.rs"

[dependencies]
# Referenced only by the build-script-generated code pulled in with
# `include!` (VECTOR3 -> `cimmeria_common::math::Vector3`), so a source-only
# unused-dependency scan such as cargo-machete wrongly reports it as unused.
cimmeria-common = { workspace = true }

[build-dependencies]
quick-xml = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["cimmeria-common"]
