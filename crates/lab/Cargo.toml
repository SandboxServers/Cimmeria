[package]
name = "cimmeria-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live Research Lab supervisor + stdio MCP server. Phase 1: a thin proxy exposing client_lua_eval / client_module_info / client_mem_read over the injected client bridge's framed JSON-RPC TCP channel."

# Windows-only: it drives a running SGW.exe on the owner's dev box.
# Excluded from the workspace default build and CI's workspace jobs
# (mirrors how sgw-launcher is excluded) so Linux dev hosts don't try
# to build it. It is a normal x86_64-pc-windows-msvc host binary.
[[bin]]
name = "cimmeria-lab"
path = "src/main.rs"

[dependencies]
# Official Rust MCP SDK. `server` + `transport-io` for a stdio MCP
# server; `macros` for #[tool]/#[tool_router]/#[tool_handler].
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
