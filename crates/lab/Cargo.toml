[package]
name = "cimmeria-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live Research Lab supervisor: an MCP server (stdio per session, or one shared token-gated loopback HTTP daemon) that owns the SGW.exe lab client and proxies probes to the injected client bridge."

# Windows-only: it drives a running SGW.exe on the owner's dev box.
# Excluded from the workspace default build and CI's workspace jobs
# (mirrors how sgw-launcher is excluded) so Linux dev hosts don't try
# to build it. It is a normal x86_64-pc-windows-msvc host binary.
[[bin]]
name = "cimmeria-lab"
path = "src/main.rs"

[dependencies]
# Official Rust MCP SDK. `server` + `transport-io` for a stdio MCP
# server; `macros` for #[tool]/#[tool_router]/#[tool_handler];
# `transport-streamable-http-server` for the shared daemon (`--http`).
rmcp = { version = "3.4", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
# The daemon's HTTP edge (bearer middleware in front of the rmcp service),
# and its non-blocking log writer.
axum = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Shared suspended-launch + inject pipeline (issue #685) — the same code
# path sgw-launcher uses.
cimmeria-client-launch = { path = "../client-launch" }

# Per-launch lab token = two v4 UUIDs (32 random bytes → 64 hex). Reuses
# the workspace's existing uuid dep rather than adding an RNG crate.
uuid = { version = "1", features = ["v4"] }

# Screenshot: PNG encode + base64 for the MCP image content block.
png = "0.18"
base64 = "0.23"

# HTTP client for `lab_timeline`: the supervisor is an MCP *client* of
# the in-server `cimmeria-lab-mcp` endpoint (server_packet_tap_read),
# reached over the network (WireGuard on the colo). It does not link
# lab-mcp — it POSTs a JSON-RPC tools/call. Workspace reqwest.
reqwest = { workspace = true }

# UAT runner (`src/uat/`): TOML row specs, regex clauses and captures,
# UTC timestamps for the evidence bundle, SHA-256 build fingerprints.
toml = { workspace = true }
regex = "1"
chrono = { workspace = true }
sha2 = { workspace = true }

# Process lifecycle, window enumeration, and GDI capture on the host
# (x86_64-pc-windows-msvc). The supervisor is a 64-bit host binary
# driving the 32-bit SGW.exe child.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    # display.rs: keep the display awake (SetThreadExecutionState) and
    # probe Direct3D 9 before a launch.
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    # daemon/single_instance.rs: CreateMutexW takes SECURITY_ATTRIBUTES.
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
# Paused time for the UAT keep-alive tests (lease::tests).
tokio = { workspace = true, features = ["test-util"] }
