[package]
name = "cimmeria-lab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "lab.exe, the Cimmeria Live Research Lab command-line tool (lab-cli-rust campaign)."

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
anstyle = "1"
anstream = "0.6"
crossterm = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
chrono = { workspace = true }
regex = "1"
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
