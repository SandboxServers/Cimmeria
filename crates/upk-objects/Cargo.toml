[package]
name = "cimmeria-upk-objects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UE3 object deserializers for SGW package files"

[dependencies]
cimmeria-upk = { workspace = true }
byteorder = "1"
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# `serde` for the serde-backed codec (bincode 2 gates it behind a feature);
# `std` for io/alloc. `derive` (a default feature) is deliberately off — the
# index types derive serde's traits, not bincode's own.
bincode = { version = "2", default-features = false, features = [
    "std",
    "serde",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "build-package-index"
path = "src/bin/build_package_index.rs"

[[bin]]
name = "inspect-export"
path = "src/bin/inspect_export.rs"
