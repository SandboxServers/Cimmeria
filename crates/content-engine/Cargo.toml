[package]
name = "cimmeria-content-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Data-driven content system: trigger/condition/action chains replacing hand-written scripts"

[dependencies]
cimmeria-common = { workspace = true }
cimmeria-entity = { workspace = true }
# Seed names for loader warnings (`chain_name`, `template_name`, `world`;
# Rule 6, NT-21).
cimmeria-names = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `LogCapture` for the `content.resolve` log assertions in `chain/tests.rs`.
cimmeria-test-support = { workspace = true }
# The PP-11 schema snapshot test reads the live catalog (`tests/it/persistent_schema_snapshot.rs`).
sqlx = { workspace = true }
tokio = { workspace = true }
