[package]
name = "cimmeria-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Identity providers for the Cimmeria server emulator: the provider types (Discord, generic OIDC, dev mock), the shared provider HTTP client and the auth-providers.toml loader"

# Sits above cimmeria-auth: it may depend on the auth crate and on common, and
# nothing below it may depend on this crate. See docs/analysis/client-tls-oidc/
# (contract C3, C4 and C12).
[dependencies]
cimmeria-auth = { workspace = true }
cimmeria-common = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
# The sign-in routes (`routes/`): the `/auth/v1` router the auth crate nests.
axum = { workspace = true }
# The reaper task `wiring::install` spawns (every 60 s).
tokio = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# The refresh-token repository: the expiry clock (`repo/refresh.rs`) and the
# SHA-256 of a token (C6, C5).
chrono = { workspace = true }
sha2 = { workspace = true }
# The constant-time PKCE and link-code compares (`stores.rs`, `link_code.rs`).
subtle = "2"
# The identity repositories (`repo/`) run runtime-checked queries on the
# account database, as cimmeria-auth does.
sqlx = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
cimmeria-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The local listener for the `read_capped` test in http.rs.
tokio = { workspace = true }
# The live-DB gate (`require_db_or_skip!`) for the `repo` tests. Listed in
# tools/test-live-db.ps1 already.
cimmeria-test-support = { workspace = true }
# The OIDC tests: an ES256 key per test (rcgen, as crates/auth uses it), the
# base64url of the JWK, and the wiremock issuer. base64 is a normal dependency
# above, so the tests see it without a dev entry.
rcgen = "0.14"
# Stubs Discord's endpoints in the provider tests.
wiremock = { workspace = true }
# Drives the route tests with `oneshot`.
tower = { workspace = true }
