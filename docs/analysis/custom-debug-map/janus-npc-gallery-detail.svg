<text x="688" y="599" class="roomTitle">SAFE INSPECTION CORRIDOR</text>
<text x="645" y="630" class="detail">Full walls + ceilings · offset entries · independent activate / clear controls</text>
<path d="M1600 754H1650" class="door"/>

<rect x="66" y="1117" width="1668" height="44" fill="#e7ebdf" stroke="#566b69" stroke-width="2"/>
<text x="85" y="1145" class="micro">One active set is the proven baseline. Occlusion breaks sightlines; it does not stop nearby active NPCs from entering client AoI. Raise concurrent load after measured server/client tests.</text>
