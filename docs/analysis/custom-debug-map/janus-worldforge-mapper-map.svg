<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Janus Worldforge mapper overview</title>
<desc id="desc">Illustrated top-down game-map style concept of the Ancient research annex. Five isolated NPC lineup rooms have NPC capacities 42, 44, 30, 28 and 17, matching the Ihpet appearance groups; these counts are room sizing targets, not fixture counts. They have independent activation, with one group active as the proven initial limit. The gate court and transfer terrace sit west, garden and river north, and the Index hub, cover, encounter, fabrication, archive, and observation spaces elsewhere. Paths, landmarks, reset points and safe routes are marked.</desc>
<defs>
