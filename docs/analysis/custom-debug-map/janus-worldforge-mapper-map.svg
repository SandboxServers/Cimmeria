  <g id="star"><path d="M0-17L5-6L17-5L8 3L11 16L0 9L-11 16L-8 3L-17-5L-5-6Z" fill="#ffc857" stroke="#935a24" stroke-width="2"/></g>
  <g id="reset"><circle r="16" fill="#39b8c5" stroke="white" stroke-width="3"/><text y="6" text-anchor="middle" class="iconText">R</text></g>
  <g id="ring"><circle r="21" fill="#b5e7e7" stroke="#386f82" stroke-width="5"/><text y="6" text-anchor="middle" font-size="14" font-weight="800" fill="#245666">RT</text></g>
