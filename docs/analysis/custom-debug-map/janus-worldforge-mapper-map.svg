  <linearGradient id="stone" x2=".1" y2="1"><stop stop-color="#aeb9a9"/><stop offset="1" stop-color="#717f77"/></linearGradient>
  <pattern id="grass" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="2" fill="#a7cd79" opacity=".5"/><path d="M23 28l4-7 3 7" fill="none" stroke="#56884b" opacity=".4"/></pattern>
  <pattern id="floor" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H48V48H0Z" fill="none" stroke="#536a6d" stroke-width="2" opacity=".4"/></pattern>
  <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity=".28"/></filter>
  <g id="tree"><path d="M0 16V36" stroke="#5d452c" stroke-width="5"/><circle cy="9" r="14" fill="#2e7645" stroke="#194f36" stroke-width="3"/><circle cx="-5" cy="4" r="5" fill="#62a95a" opacity=".7"/></g>
