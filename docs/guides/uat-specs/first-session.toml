[[row]]
id = "FS-S4"
title = "Teal'c"
expected = "Right-click Teal'c: dialog 5355; finishing it advances 1559 to step 4614."
state = "any"
setup = [
  { chat = "/gmgotoxyz 177.3 1.4 46.7", tier = "G" },
  { wait_ms = 2500 },
