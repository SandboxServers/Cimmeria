[[row]]
id = "FS-P5"
title = "Equip the looted pistol: 622 completes"
expected = "Equipping the pistol from the backpack plays the door sequence and completes mission 622."
state = "any"
setup = [
  { tool = "@finish_dialog", args = {}, optional = true },
]
step = [
  { tool = "@inventory", args = { containers = ["Main"] }, label = "read-pack" },
  { tool = "@item_action", args = { action = "equip", name = "SI 3 9mm Pistol" }, label = "equip" },
  # Lets the equip and its door sequence settle before the bag key; kept
  # until SV-15 proves it removable.
  { wait_ms = 3000 },
  # item_action opened the bag; close it so the next row starts clean.
  { tool = "@key", args = { key = "b" }, label = "close-bag" },
  { tool = "@wait_for", args = { lua_condition = "InventoryWin == nil or not InventoryWin:isVisible()", timeout_ms = 3000 } },
]
