# ================================================================ Cleanup

[[row]]
id = "FS-99"
title = "Delete both smoke characters"
expected = "Back at character select, both Px and Sx characters are deleted."
state = "any"
setup = [
  { tool = "@logout", args = {}, optional = true },
]
step = [
  { tool = "lab_delete_character", args = { name = "Px${run_id}" }, tier = "N1", optional = true },
  { tool = "lab_delete_character", args = { name = "Sx${run_id}" }, tier = "N1", optional = true },
]
[[row.expect]]
id = "gone"
text = "sgw_player holds neither character"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT count(*) AS n FROM sgw_player WHERE player_name ILIKE '%x${run_id}%'" }
pointer = "/rows/0/n"
op = "eq"
value = 0
