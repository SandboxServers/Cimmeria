# ================================================================ SGU

[[row]]
id = "FS-S1"
title = "Create an SGU Soldier"
expected = "The character is created and listed; the server stores it as SGU in SGC_W1."
state = "any"
setup = [
  { tool = "@logout", args = {} },
  { tool = "lab_ensure_character_slot", args = { free_slots = 1, protect = ["${character}", "Px${run_id}"] } },
]
step = [
  { tool = "lab_create_character", args = { first = "Uat", last = "Sx${run_id}", alignment = "sgu", archetype = "Soldier", gender = "male" }, tier = "N1", label = "create" },
]
[[row.expect]]
id = "stored"
text = "sgw_player holds the character as SGU (2) in SGC_W1"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT count(*) AS n FROM sgw_player WHERE player_name ILIKE '%sx${run_id}%' AND alignment = 2 AND world_location = 'SGC_W1'" }
pointer = "/rows/0/n"
op = "eq"
value = 1

[[row]]
id = "FS-S2"
title = "The SGU character enters SGC_W1"
expected = "Play loads world 58; the HUD is up; mission 1559 is active on step 4612."
state = "any"
step = [
