# Unified UAT, section "First session" (the smoke run).
# Guide: docs/guides/unified-uat.md#first-session-smoke
#
# What a brand-new player does in their first ten minutes, once per
# faction: boot the client, log in, pick the server, create a character,
# enter the world, and finish the first quest. Nothing here depends on
# NPC movement, combat, abilities or AI, so every row should pass on any
# healthy build. A failure here means the build is broken for every new
# player; the subsystem sections take over from there.
#
#   Praxis: Castle_CellBlock (world 12), mission 622 "Arm Yourself!":
#     search Cpl. Frost (step 2113 -> 80623), search the NID Guard
#     (80623 -> 80622, pistol to the backpack), equip the pistol (complete).
#     Chains 1001-1005 in db/resources/Content/Seed/castle_cellblock_chains.sql.
#   SGU: SGC_W1 (world 58), mission 1559 "Orientation": General Hammond
#     (4612 -> 4613), Teal'c (-> 4614), the elevator controls (dialog 5357
#     moves you to the armory), the firearm body (complete).
#     Chains 3001-3008 in db/resources/Content/Seed/sgc_w1_chains.sql.
#
# How the rows are built:
# - FS-01, FS-02, FS-P1 and FS-P2 are a chain (FS-P2 is the fresh-login
#   row). FS-P3, FS-P4 and FS-P5 carry fixtures: in a full run they
#   continue the chain and check parity, and run alone (or after a failed
#   row) they start from their fixture in their own session on the
#   instance's reusable `Fxpraxis...` character (`lab uat first-session
#   -Rows FS-P4 -RunsPerLease 20`). The SGU rows are still a chain.
# - The rows make their own characters (Px<run id> and Sx<run id>) rather
#   than using `character = "fresh"`: the runner names a fresh character
#   from the run id alone, so two fresh sections in one run would collide.
#   Every row is therefore `state = "any"` and drives login and play
#   itself; there is no `.bug` anchor (it needs `state = "in_world"`).
# - The graded proof of progress is the server's own record, sgw_mission
#   and sgw_player, read with server_db_query (status 1 active, 2
#   completed). That needs CIMMERIA_LAB_MCP_URL/_TOKEN. Without them the
#   pose and wait_server rows (FS-P2, FS-P3, FS-P4, FS-S2 to FS-S6) are
#   BLOCKED naming the server lab MCP, since their tags and the hold-release
#   line live on the server; the other rows run, and their server clauses
#   are UNVERIFIED, never a false PASS.
# - Each interaction row names its target by spawn tag in a `pose` line
#   (one line per pose; `lab calibrate` rewrites those lines and nothing
#   else). Setup makes the player immune with /gmsetgodmode 1 and `@stand`s
#   at the pose: a /gmgotoxyz (tier G) to the stand point, then a poll of
#   the client's own reported server position until it is there (5 s at
#   most), so no teleport sleep. Nothing waits on the target entity
#   reaching the client, though, and no tool can wait on an entity id yet,
#   so a 1500 ms sleep follows each `@stand` before the camera and the
#   click address the target by entity id.
#   `@camera { pose }` faces the target and sets the pose's absolute pitch,
#   yaw and zoom; `@world_click { pose }` clicks it with rotate_camera =
#   false. The step is one real click: no player walking, no NPC pathing.
#   The SGU rows pass rotate_camera = true (an explicit argument beats the
#   pose's default) and keep the click tool's own rotation until SV-15
#   calibrates their poses: with no pitch or yaw the target may sit behind
#   the avatar, and an unrotated click would hit the player.
#   The interact range is 5 m and every stand point is 3.3-4.5 m off.
# - The stand point is D-SV3: the target's live server position plus
#   radius_m along bearing_deg (0 = +x, 90 = +z) and dy_m up. Each one
#   equals the /gmgotoxyz point this file used before, to 0.01 m.
# - Bodies that never answer an entity hover (the Guard, the SGC firearm
#   body) are point-aimed: `aim = "point"` clicks aim_dy_m above the
#   target's origin. Everything else is hover-verified on the entity.
# - The FS-P3 to FS-P5 fixtures set no `position`, and in a full run the
#   rows continue the chain without their fixture, so `@stand` stays in
#   every interaction row: it is what puts the player at the pose either
#   way.
# - #1341 (the client drops the first-login entity batch): a real #1341
#   still logs the hold release, so FS-P2/FS-S2 fail on the `movie-over`
#   clause and `lab uat` tags the run #1341 as before. A wait that expires
#   instead (no release line, or one for another witness_id) fails the
#   `movie-over` step, which the known-issue table does not match: that is
#   reported untagged on purpose, since it is not #1341.
# - FS-P5's 3000 ms after the equip and FS-S6's 3000 ms before the teardown
#   dialog close guard UI flows nothing polls yet; they stay until SV-15
#   proves them removable.
# - The server's own records are read with `timeout_ms`: the clause is
#   re-read every 250 ms until it passes, instead of sleeping first.
# - FS-99 deletes both characters.
#
# Calibration. The Praxis poses (frost, guard) are the hand calibration of
# 2026-10-10 on the colo (client window 1280x720), converted to poses
# exactly; SV-15 re-measures them with `lab calibrate`. The SGU poses
# (hammond, tealc, elevator, firearm) are geometric guesses from the spawn
# rows with no pitch, yaw or zoom (the camera only faces) until SV-15
# calibrates them. Nothing here has been run live in this form yet.
#
#   What                     Value                    Why / what breaks without it
#   first-login wait         the server's release     server HOLD_DURATION 16 s from onClientReady
#                            line (aoi.cinematic_hold (or cancelMovie, whichever first); before it,
#                            "Cinematic AoI hold:     no NPCs exist and clicks and chat are
#                            released", witness_id =  swallowed. MoviePlayerWin is NOT the signal
#                            the player), 30 s max    (it hides after ~2 s).
#   frost pose               radius 4.16 m, bearing   stands at (-325.0, 73.6, -212.8), to the side
#                            322.5, dy 0.13           of Frost; straight behind (the first guess)
#                                                     put him under the HUD ring.
#   guard pose               radius 4.41 m, bearing   stands at (-319.0, 73.6, -212.5); straight
#                            322.7, dy 0.13           behind, the avatar eats the click (hover =
#                                                     own entity 2).
#   Praxis camera pitch      -28.8 deg absolute       a floor body clears the avatar and the HUD
#                                                     ring; every passing click of 2026-10-10 ran
#                                                     at it. Set, not a by-product of the face, so
#                                                     it no longer depends on the camera's start.
#                                                     Graded (`aim-pitch`, FS-P4 `pitch`).
#   Praxis camera yaw        +25.3 deg after facing   facing puts the target behind the avatar's
#                            (the old +230 counts)    head; +25 deg moves it to screen x ~430.
#   zoom                     250 (the default)        the value every calibration click ran at.
#   Guard aim point          origin +0.28 m (y 73.75) the body never answers an entity hover; a
#                                                     point click on its torso does.
#   order after the Guard    tutorial X, then dialog  TutorialWin (dialog 5882, 3 pages) opens on
#                                                     top of DialogWin, sometimes seconds later, and
#                                                     a Done click on the dialog lands on the
#                                                     tutorial's Next. Its title-bar X closes it
#                                                     from any page.
#   equip                    by name                  the item id is only known at grading time.

schema = 1

[section]
id = "first-session"
system = "First session smoke (boot to first quest, Praxis and SGU)"
guide = "docs/guides/unified-uat.md#first-session-smoke"
ledger = "docs/guides/automated-uat.md#spec-coverage"
account = "gm"
character = "lab"

# The fixture character for FS-P3, FS-P4 and FS-P5 (see the header).
[section.profiles.praxis]
alignment = "praxis"
archetype = "Soldier"
gender = "male"
first = "Uat"

# ================================================================ Boot and login

[[row]]
id = "FS-01"
title = "The client boots with the lab bridge alive"
expected = "SGW.exe starts, the lab telemetry DLL is injected and its heartbeat is alive."
state = "client_stopped"
step = [
  { tool = "lab_client_start", args = {}, tier = "N1", label = "boot" },
  { wait_ms = 5000 },
]
[[row.expect]]
id = "running"
text = "the client process is running"
source = "tool"
tool = "lab_client_status"
pointer = "/running"
op = "truthy"
[[row.expect]]
id = "heartbeat"
text = "the bridge heartbeat is alive"
source = "tool"
tool = "lab_client_status"
pointer = "/heartbeat/state"
op = "eq"
value = "alive"
# SV-15 (2026-10-11): the bridge can come up after lab_client_start returns
# (it read "unreachable" 5 s later, then "alive"), so poll for it (SV-08).
timeout_ms = 60000

[[row]]
id = "FS-02"
title = "Login and server select reach character select"
expected = "Intro movies skip; the account logs in; the server row is picked and Select reaches character select."
state = "any"
step = [
  { tool = "@login", args = {}, label = "login" },
]
[[row.expect]]
id = "char-select"
text = "the supervisor saw character select"
source = "tool"
tool = "lab_client_status"
pointer = "/login_state"
op = "eq"
value = "character_select"
[[row.expect]]
id = "char-select-win"
text = "the character select window is up"
source = "lua"
chunk = "return CharSelectWin ~= nil and CharSelectWin:isVisible()"
op = "truthy"
[[row.expect]]
id = "list-read"
text = "the character list reads"
source = "tool"
tool = "lab_characters"
pointer = "/count"
op = "gte"
value = 0
[[row.expect]]
id = "timing"
text = "boot-to-character-select login takes under two minutes"
source = "timing"
action = "login"
max_ms = 120000
required = false

# ================================================================ Praxis

[[row]]
id = "FS-P1"
title = "Create a Praxis Soldier"
expected = "The character is created and listed; the server stores it as Praxis in Castle_CellBlock."
state = "any"
setup = [
  { tool = "lab_ensure_character_slot", args = { free_slots = 1, protect = ["${character}"] } },
]
step = [
  { tool = "lab_create_character", args = { first = "Uat", last = "Px${run_id}", alignment = "praxis", archetype = "Soldier", gender = "male" }, tier = "N1", label = "create" },
]
[[row.expect]]
id = "stored"
text = "sgw_player holds the character as Praxis (1) in Castle_CellBlock"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT count(*) AS n FROM sgw_player WHERE player_name ILIKE '%px${run_id}%' AND alignment = 1 AND world_location = 'Castle_CellBlock'" }
pointer = "/rows/0/n"
op = "eq"
value = 1

[[row]]
id = "FS-P2"
title = "The Praxis character enters Castle_CellBlock"
expected = "Play loads world 12; the HUD is up; dialog 2982 (\"The last thing you remember...\") is open; mission 622 is active on step 2113."
state = "any"
step = [
  { tool = "@play", args = { name = "Px${run_id}" }, label = "play" },
  # First login plays the 13 s logo movie (Cine-SGWLogo). The server holds
  # every entity introduction until cancelMovie or HOLD_DURATION = 16 s
  # from onClientReady, whichever comes first, and until then dialog clicks
  # do nothing and chat commands are swallowed. MoviePlayerWin hides within
  # ~2 s, so no client signal marks the end; the server's release line
  # (crates/base-world-entry/.../cinematic_aoi_hold, INFO on
  # aoi.cinematic_hold, event "hold_released") is the signal either way.
  # The watermark is read before Play, so a release during Play counts.
  # The `movie-over` clause proves the world was introduced.
  { wait_server = { log = "Cinematic AoI hold: released", target = "aoi.cinematic_hold", fields = { witness_id = "${player_entity_id}" }, timeout_ms = 30000 }, label = "movie-over" },
]
[[row.expect]]
id = "world"
text = "the client is in world 12 (Castle_CellBlock)"
source = "tool"
tool = "@player_state"
args = { stats = false, effects = false }
pointer = "/world_id"
op = "eq"
value = 12
[[row.expect]]
id = "who"
text = "the client plays the new character"
source = "tool"
tool = "@player_state"
args = { stats = false, effects = false }
pointer = "/name"
op = "contains"
value = "${run_id}"
[[row.expect]]
id = "movie-over"
text = "the first-login movie has ended and the world is introduced (Corporal Frost is known)"
source = "tool"
tool = "@entity_find"
args = { name = "Corporal Frost" }
pointer = "/count"
op = "gte"
value = 1
[[row.expect]]
id = "dialog-2982"
text = "the arrival dialog is 2982"
source = "tool"
tool = "client_ui_state"
pointer = "/dialog/text"
op = "contains"
value = "The last thing you remember"
[[row.expect]]
id = "mission-622"
text = "sgw_mission: 622 active on step 2113"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT m.status, m.current_step_id FROM sgw_mission m JOIN sgw_player p ON p.player_id = m.player_id WHERE p.player_name ILIKE '%px${run_id}%' AND m.mission_id = 622" }
pointer = "/rows/0/current_step_id"
op = "eq"
value = 2113
[[row.expect]]
id = "timing"
text = "Play to HUD in under 90 s"
source = "timing"
action = "play"
max_ms = 90000
required = false

[[row]]
id = "FS-P3"
title = "Search Cpl. Frost's corpse"
expected = "Dialog 3995 opens; Frost's Letter is granted (mission 1360 accepted); 622 advances to step 80623."
state = "any"
pose = [
  { id = "frost", tag = "ArmYourself_FrostBody", radius_m = 4.16, bearing_deg = 322.5, dy_m = 0.13, pitch_deg = -28.8, yaw_offset_deg = 25.3, zoom = 250.0, calibrated = "2026-10-10 hand" },
]
setup = [
  { tool = "@finish_dialog", args = {}, optional = true },
  { chat = "/gmsetgodmode 1", tier = "G" },
  { tool = "@stand", args = { pose = "frost" } },
  # @stand waits for the player only; give the client time to introduce
  # Frost before the camera and the click address him by entity id (no tool
  # waits on an entity id yet).
  { wait_ms = 1500 },
]
step = [
  # Face Frost, then the pose's absolute pitch (-28.8), yaw (+25.3 from the
  # face, so he sits left of the avatar instead of behind it) and zoom.
  # Absolute, so the result does not depend on the camera's start.
  { tool = "@camera", args = { pose = "frost" }, label = "aim" },
  { tool = "@world_click", args = { pose = "frost", button = "right", expect = "window" }, label = "frost" },
  { tool = "@finish_dialog", args = {}, label = "close" },
]
[row.fixture]
character = "praxis"
world = "Castle_CellBlock"
missions = [{ id = 622, step = 2113 }, { id = 1360, state = "not_active" }]
items = [{ id = 3730, count = 0, container = "mission" }, { id = 55, count = 0 }]
[[row.expect]]
id = "aim"
text = "Corporal Frost is on screen left of the avatar (screen x below 560 of 1280)"
source = "tool"
at = "aim"
tool = "@entity_find"
args = { name = "Corporal Frost" }
pointer = "/matches/0/screen/0"
op = "lt"
value = 560
[[row.expect]]
id = "aim-on-screen"
text = "Corporal Frost projects inside the window (screen x above 0)"
source = "tool"
at = "aim"
tool = "@entity_find"
args = { name = "Corporal Frost" }
pointer = "/matches/0/screen/0"
op = "gt"
value = 0
[[row.expect]]
id = "aim-near"
text = "the stand landed: Corporal Frost is within interact range (5 m)"
source = "tool"
at = "aim"
tool = "@entity_find"
args = { name = "Corporal Frost" }
pointer = "/matches/0/distance_m"
op = "lt"
value = 5
[[row.expect]]
id = "aim-pitch"
text = "after facing Frost the camera is at the pose's pitch (-28.8 deg)"
source = "tool"
at = "aim"
tool = "@camera"
args = { pitch_counts = 0 }
pointer = "/view_after/pitch_offset_deg"
op = "approx"
value = -28.8
tolerance = 1.0
[[row.expect]]
id = "zoom"
text = "the camera is at the pose's zoom (250)"
source = "tool"
at = "aim"
tool = "@camera"
args = { pitch_counts = 0 }
pointer = "/view_after/zoom"
op = "approx"
value = 250.0
tolerance = 1.0
[[row.expect]]
id = "step-80623"
text = "sgw_mission: 622 on step 80623"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT m.current_step_id FROM sgw_mission m JOIN sgw_player p ON p.player_id = m.player_id WHERE p.player_name ILIKE '% ${fixture_character}' AND m.mission_id = 622" }
pointer = "/rows/0/current_step_id"
op = "eq"
value = 80623
timeout_ms = 5000
[[row.expect]]
id = "letter-1360"
text = "sgw_mission: 1360 (Frost's Letter) active"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT m.status FROM sgw_mission m JOIN sgw_player p ON p.player_id = m.player_id WHERE p.player_name ILIKE '% ${fixture_character}' AND m.mission_id = 1360" }
pointer = "/rows/0/status"
op = "eq"
value = 1
timeout_ms = 5000

[[row]]
id = "FS-P4"
title = "Search the NID Guard's corpse"
expected = "Dialog 3996 opens; a SI 3 9mm Pistol lands in the backpack; 622 advances to step 80622."
state = "any"
known_issues = ["K5"]
notes = "The Guard body never answers an entity hover, so the pose is point-aimed: the click goes 0.28 m above its origin, on the torso. K5: if it is invisible, the click finds nothing and the row fails on step-80622."
pose = [
  { id = "guard", tag = "ArmYourself_GuardBody", radius_m = 4.41, bearing_deg = 322.7, dy_m = 0.13, pitch_deg = -28.8, yaw_offset_deg = 25.3, zoom = 250.0, aim = "point", aim_dy_m = 0.28, calibrated = "2026-10-10 hand" },
]
setup = [
  { chat = "/gmsetgodmode 1", tier = "G" },
  { tool = "@stand", args = { pose = "guard" } },
  # The target's introduction, as in FS-P3.
  { wait_ms = 1500 },
]
step = [
  # Same aim as FS-P3, on the body's aim point.
  { tool = "@camera", args = { pose = "guard" }, label = "aim" },
  { tool = "@world_click", args = { pose = "guard", button = "right", expect = "window" }, label = "guard" },
  # The click also opens the "Equipping a Weapon" tutorial (dialog 5882),
  # sometimes a few seconds later. It sits exactly on top of DialogWin, so
  # a Done click on the dialog lands on the tutorial's Next arrow instead.
  # Close the tutorial first with its title-bar X (works from any of its
  # three pages; Done shows only on the last), then finish the dialog.
  { tool = "@wait_for", args = { lua_condition = "TutorialWin ~= nil and TutorialWin:isVisible()", timeout_ms = 10000 } },
  { tool = "@window_click", args = { target = "TutorialWin__auto_closebutton__" }, label = "tutorial-x" },
  { wait_ms = 500 },
  { tool = "@finish_dialog", args = {}, label = "close" },
]
[row.fixture]
character = "praxis"
world = "Castle_CellBlock"
missions = [{ id = 622, step = 80623 }, { id = 1360, step = 4037 }]
items = [{ id = 55, count = 0 }]
tutorials_unseen = [5882]
[[row.expect]]
id = "pitch"
text = "after facing the body the camera is at the pose's pitch (-28.8 deg), set absolutely, so the same from a fixture session's level start as from FS-P3's camera"
source = "tool"
at = "aim"
tool = "@camera"
args = { pitch_counts = 0 }
pointer = "/view_after/pitch_offset_deg"
op = "approx"
value = -28.8
tolerance = 1.0
[[row.expect]]
id = "landed"
text = "the stand landed at the guard pose's stand point (server x -319.0)"
source = "tool"
at = "aim"
tool = "@entity_find"
args = { include_player = true, limit = 1 }
pointer = "/player/position/server/x"
op = "approx"
value = -319.0
tolerance = 0.5
[[row.expect]]
id = "step-80622"
text = "sgw_mission: 622 on step 80622 (equip the pistol)"
source = "server"
tool = "server_db_query"
args = { sql = "SELECT m.current_step_id FROM sgw_mission m JOIN sgw_player p ON p.player_id = m.player_id WHERE p.player_name ILIKE '% ${fixture_character}' AND m.mission_id = 622" }
pointer = "/rows/0/current_step_id"
op = "eq"
value = 80622
timeout_ms = 5000
[[row.expect]]
id = "pistol-in-pack"
text = "the client's backpack holds a pistol"
source = "tool"
tool = "@inventory"
args = { containers = ["Main"] }
pointer = "/containers[name=Main]/slots[name=SI 3 9mm Pistol]/item_id"
op = "exists"
[[row.expect]]
id = "tutorial-closed"
text = "the weapon tutorial and the search dialog were shown and closed"
source = "tool"
tool = "@wait_for"
args = { lua_condition = "TutorialWin ~= nil and not TutorialWin:isVisible() and not DialogWin:isVisible()", timeout_ms = 2000 }
