# One file is one run on its own fresh character: at most 30 rows, so its grants fit the 40-slot main bag. Never merge split files into one run.

schema = 1

[section]
id = "armory-gear-weapons-3"
system = "Debug Area Armory gear (weapons)"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"
finish_intro = false

[[row]]
id = "GW-3753"
title = "Cobra Staff fires its ranged ability on a right-click"
expected = "The right-click leaves the client as ability 584."
setup = [
  { wait_ms = 17000 },
  { tool = "@item_action", args = { action = "unequip", container = "Bandolier", slot = 1 }, label = "reset-slot1", optional = true },
  { tool = "@window_click", args = { target = "CharacterWin__auto_closebutton__" }, label = "close-sheet", optional = true },
  { chat = "/gmgiveitem 3753 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "Cobra Staff" } },
  { tool = "@window_click", args = { target = "InventoryWin__auto_closebutton__" }, label = "close-bag" },
  { tool = "@key", args = { key = "F1" }, label = "select-slot1" },
  { tool = "@dummy", args = { disposition = "hostile", template_id = 1310 } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@camera", args = { face_entity_id = "${dummy_id}", zoom_to = 400 }, label = "face" },
  { tool = "@camera", args = { yaw_counts = -300, pitch_deg = -15 }, label = "offset" },
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@world_click", args = { entity_id = "${dummy_id}", button = "right" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
  { tool = "@dummy", args = { disposition = "clear" } },
]
[[row.expect]]
id = "sent"
text = "the right-click sends ability 584 (RANGED binding)"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 584 }
since = "press"
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is Cobra Staff before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon"
op = "eq"
value = "Cobra Staff"

