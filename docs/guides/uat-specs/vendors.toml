source = "signoz"
filter = "scope_name = 'vendor' AND event = 'transaction' AND vendor_template_id = 300 AND action = 'sell'"
field = "price"
op = "eq"
value = 300
[[row.expect]]
id = "cash"
text = "the naquadah count rose by 300"
source = "tool"
tool = "client_inventory"
args = { containers = ["Main"] }
pointer = "/cash"
op = "delta"
baseline = "${cash_before}"
