# Unified UAT, section "vendors" (starter-world shops, rows V1 to V7).
# Campaign: docs/analysis/starter-uat-shops/README.md (packet SS-03a).
# Scope: open, buy, sell, buyback and the refusal lines of the vendors a new
# character meets first. The rows run in the Debug Area plaza (world 1300),
# where the same templates stand, as the debug-area.toml rows do.
#
# How a row is built: every row starts with the DA-U6 setup
# (debug-area.toml:260-262): `.gotolocation DebugArea`, then wait for world
# 1300. A row that works at a second station moves with its own
# `.gotolocation` in setup or step. Clicks are by name with `@world_click`,
# which stands within 3.5 u of the vendor (interact range is 5 u).
#
# Sell and buyback use the recipes in
# docs/analysis/starter-uat-shops/evidence/store-paths.md (section Recipes).
# That evidence marks both as unverified (N1 until a lab round proves them).
# Inventory slots are read with `client_inventory` and captured, so a row
# never names a slot by hand.
#
# Seed citations sit above each row. Each was re-checked at SS-03a against
# db/resources/. Vendor-row ids (V1 to V7) match the packet, not the seed.
#
# Cash: the packet's "cash unchanged" and "cash back down by 300" clauses
# have no client read that returns naquadah in this repo, so they are human
# clauses. The server's own cash_before and cash_after are on each
# transaction row (vendor/telemetry.rs:17).

schema = 1

[section]
id = "vendors"
system = "Starter-world vendors (shops)"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/starter-uat-shops/README.md#packet-status"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"

# ================================================================ Open

# Template 300 (Basic Equipment Quartermaster): interaction_type 65536,
# buy list 1, sell list 2, repair list 2, recharge list 2
# (entity_templates.sql:1011). Plaza spawn 13001, DebugArea_Vendor, at
# spawnlist_debug_area_plaza.sql:45. Stand point (259, 7.2, -925) is 3.2 u
# from the spawn, as DA-U6 uses.
[[row]]
id = "V1"
title = "The Quartermaster opens its store with buy and sell lists stocked"
expected = "The store window opens on the first right-click. The server logs store_opened for template 300 with buy_count and sell_count of at least 1."
setup = [
  { chat = ".gotolocation DebugArea 259 7.2 -925", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Basic Equipment Quartermaster", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
]
[[row.expect]]
id = "opened-buy"
text = "SigNoz: store_opened for template 300, buy_count at least 1"
source = "signoz"
filter = "scope_name = 'vendor' AND event = 'store_opened' AND vendor_template_id = 300"
field = "buy_count"
op = "gte"
value = 1
[[row.expect]]
id = "opened-sell"
text = "SigNoz: store_opened for template 300, sell_count at least 1"
source = "signoz"
filter = "scope_name = 'vendor' AND event = 'store_opened' AND vendor_template_id = 300"
field = "sell_count"
op = "gte"
value = 1
[[row.expect]]
id = "window"
text = "the store window is open"
source = "human"
question = "In final.png, is the vendor's store window open, with buy and sell tabs?"

# ================================================================ Buy

# Template 1302 (Consumables, munitions vendor): buy list 1300, sell list 2
# (entity_templates_debug_area_plaza.sql:43). Plaza spawn 13006,
# DebugArea_MunitionsVendor, at spawnlist_debug_area_plaza.sql:46; stand at
# (259, 7.2, -923), as DA-U8 uses. Buy list 1300 (item_lists_debug_area_
# plaza.sql:25): special-ammo stacks, designs 9000-9014, quantity 100, price
# 1 (rows 27-41). The buy row is 1-based, as the window lists it: row 1 is
# design 9000 only if the window lists by item_id; the first run confirms it.
[[row]]
id = "V2"
title = "Buy one special-ammo stack from the munitions vendor"
expected = "The stack lands in the bag and the server logs a buy transaction for template 1302 at price 1."
setup = [
  { chat = ".gotolocation DebugArea 259 7.2 -923", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
  { chat = "/gmgivecash 10", tier = "G" },
]
step = [
  { tool = "@world_click", args = { name = "Consumables", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { tool = "client_vendor_buy", args = { row = 1, quantity = 1 }, label = "buy" },
  { wait_ms = 1000 },
]
[[row.expect]]
id = "transaction"
text = "SigNoz: transaction action buy, template 1302, total price 1"
source = "signoz"
filter = "scope_name = 'vendor' AND event = 'transaction' AND vendor_template_id = 1302 AND action = 'buy'"
field = "price"
op = "eq"
value = 1
[[row.expect]]
id = "cash"
text = "the naquadah count dropped by 1"
source = "human"
question = "In final.png, is the naquadah count exactly 1 lower than the count before the buy? Write both numbers in the answer."

# The SGHC 6 SMG is design 21 at price 1000 (item_lists_debug_area_plaza.sql:44,
# item 13018), and list 2 buys it back at 1000 (item_list_items.sql:11). Row
# 18 is design 21 only if the window lists the 19 rows by item_id; CO2 dart
# gun is the 19th. A fresh character starts with less than 1000 naquadah in
# this section, and the row checks that in its human clause. If a fresh
# character starts with 1000 or more, the row is blocked: record the starting
# cash and stop.
[[row]]
id = "V3"
title = "The munitions vendor refuses an SMG the character cannot afford"
expected = "The buy is refused with reason insufficient_cash; nothing is bought and the naquadah count is unchanged."
setup = [
  { chat = ".gotolocation DebugArea 259 7.2 -923", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Consumables", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { tool = "client_vendor_buy", args = { row = 18, quantity = 1, expect_change = false }, label = "buy" },
  { wait_ms = 1000 },
]
[[row.expect]]
id = "refused"
text = "SigNoz: refused with reason insufficient_cash, template 1302"
source = "signoz"
filter = "scope_name = 'vendor' AND event = 'refused' AND vendor_template_id = 1302 AND reason = 'insufficient_cash'"
min_rows = 1
[[row.expect]]
id = "start-cash"
text = "the character started with less than 1000 naquadah"
source = "human"
question = "In final.png or the first client read, was the starting naquadah below 1000? Write the number in the answer."

# ================================================================ Sell

# Template 300 sells to list 2. Sell list 2 buys back design 55 (SI 3 9mm
# Pistol) at 300 (item_list_items.sql:15, item 5) and design 21 at 1000
# (item_list_items.sql:11). The pistol is bought from list 1300 at price 300
# (item_lists_debug_area_plaza.sql:43, item 13017), so the setup can afford it
# with /gmgivecash 300. The bought pistol is captured by design_id 55 from
# client_inventory before the drag, so a starter-kit pistol in the bandolier
# can be picked by mistake: check that the item_id is the bought one.
[[row]]
id = "V4"
title = "Sell the bought pistol to the Quartermaster for 300"
expected = "The pistol leaves the bag, the cash rises by 300, and the server logs a sell transaction for template 300 at price 300."
setup = [
  { chat = "/gmgivecash 300", tier = "G" },
  { chat = ".gotolocation DebugArea 259 7.2 -923", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
  { tool = "@world_click", args = { name = "Consumables", button = "right", expect = "window" }, label = "buy-open" },
  { wait_ms = 2000 },
  { tool = "client_vendor_buy", args = { row = 17, quantity = 1 }, label = "buy-pistol" },
  { wait_ms = 1000 },
  { chat = ".gotolocation DebugArea 259 7.2 -925", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Basic Equipment Quartermaster", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { capture = "tool", tool = "client_inventory", args = { container = 1 }, pointer = "/items[design_id=55]/slot", var = "pistol_slot" },
  { tool = "client_drag_drop", args = { from = { container = "Main", slot = "${pistol_slot}" }, to = { window = "VendorWin" } }, tier = "N1", label = "sell" },
  { wait_ms = 1500 },
]
[[row.expect]]
id = "sell"
text = "SigNoz: transaction action sell, template 300, total price 300"
source = "signoz"
filter = "scope_name = 'vendor' AND event = 'transaction' AND vendor_template_id = 300 AND action = 'sell'"
field = "price"
op = "eq"
value = 300
[[row.expect]]
id = "cash"
text = "the naquadah count rose by 300"
source = "human"
question = "In final.png, does the naquadah count read 300 more than before the sell?"

# Buyback: the pistol sold in V4 comes back at the price sell list 2 paid
# (300), so cash falls by 300. This row needs V4's character and state.
[[row]]
id = "V5"
title = "Buy the pistol back from the Quartermaster's buyback"
expected = "The buyback tab lists the pistol; the buy takes 300 naquadah and the server logs a buyback transaction for template 300 at price 300."
depends_on = ["V4"]
setup = [
  { chat = ".gotolocation DebugArea 259 7.2 -925", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Basic Equipment Quartermaster", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { tool = "client_window_click", args = { text = "Buyback", root = "VendorWin" }, tier = "N1", label = "tab" },
  { wait_ms = 1000 },
  { tool = "client_drag_drop", args = { from = { container = "Buyback", slot = 0 }, to = { container = "Main" } }, tier = "N1", label = "buyback" },
  { wait_ms = 1500 },
]
[[row.expect]]
id = "buyback"
text = "SigNoz: transaction action buyback, template 300, total price 300"
source = "signoz"
filter = "scope_name = 'vendor' AND event = 'transaction' AND vendor_template_id = 300 AND action = 'buyback'"
field = "price"
op = "eq"
value = 300
[[row.expect]]
id = "cash"
text = "the naquadah count dropped by 300"
source = "human"
question = "In final.png, is the naquadah count 300 lower than before the buyback?"

# ================================================================ Refusals

