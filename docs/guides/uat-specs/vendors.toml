  { wait_ms = 3000 },
  { tool = "@world_click", args = { name = "Consumables", button = "right", expect = "window" }, label = "buy-open" },
  { wait_ms = 2000 },
  { tool = "client_lua_eval", args = { chunk = "Vendor_Scrollbar:setProperty('ScrollPosition', '12')" }, tier = "N3", label = "scroll" },
  { wait_ms = 500 },
  { tool = "client_vendor_buy", args = { row = 5, quantity = 1 }, label = "buy-pistol" },
  { wait_ms = 1000 },
  { chat = ".gotolocation DebugArea 259 7.2 -925", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Basic Equipment Quartermaster", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { capture = "tool", tool = "client_inventory", args = { containers = ["Main"] }, pointer = "/cash", var = "cash_before" },
  { capture = "tool", tool = "client_inventory", args = { containers = ["Main"] }, pointer = "/containers[name=Main]/slots[name=SI 3 9mm Pistol]/slot", var = "pistol_slot" },
  { tool = "client_drag_drop", args = { from = { container = "Main", slot = "${pistol_slot}" }, to = { window = "VendorWin" } }, tier = "N1", label = "sell" },
  { wait_ms = 1500 },
