# ================================================================ Distance

# Template 300 at plaza spawn 13001, DebugArea_Vendor, at (262.14, 6.99,
# -925.72) (spawnlist_debug_area_plaza.sql:45). The store opens from the stand
# point (259, 7.2, -925), then the character walks 30 m east to (292.14, 7.2,
# -925.72). The buy is refused by the cell's range check
# (store_ops.rs:162-183: reason out_of_range at :175, the line
# TOO_FAR_TEXT = "You are too far from the vendor." at store_ops.rs:28). The
# range check runs before the price, so the row needs no cash. The walk target
# is 30 m on from the spawn and is unverified: the first lab run confirms it is
# walkable and that the store window stays open after the walk.
[[row]]
id = "V12"
title = "The Quartermaster refuses a purchase from 30 m away"
expected = "The buy is refused with reason out_of_range and the line 'You are too far from the vendor.'. Nothing is bought."
setup = [
  { chat = ".gotolocation DebugArea 259 7.2 -925", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Basic Equipment Quartermaster", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { tool = "client_move_to", args = { point = { x = 292.14, y = 7.2, z = -925.72 } }, tier = "N1", label = "walk" },
  { wait_ms = 3000 },
  { tool = "client_vendor_buy", args = { row = 1, quantity = 1 }, label = "buy" },
