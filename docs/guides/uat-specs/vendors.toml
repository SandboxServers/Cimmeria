# (item_lists_debug_area_plaza.sql:42, item 13016, stack of 5; the name is in
# the list header at line 13). Row 16 buys it; the setup gives 10 naquadah.
[[row]]
id = "V6"
title = "The Quartermaster refuses a Health Slappack, which sell list 2 does not buy"
expected = "The sell is refused with reason not_sellable; the slappack stays in the bag."
setup = [
  { chat = "/gmgivecash 10", tier = "G" },
  { chat = ".gotolocation DebugArea 259 7.2 -923", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
  { tool = "@world_click", args = { name = "Consumables", button = "right", expect = "window" }, label = "buy-open" },
  { wait_ms = 2000 },
  { tool = "client_vendor_buy", args = { row = 16, quantity = 1 }, label = "buy-slappack" },
  { wait_ms = 1000 },
  { chat = ".gotolocation DebugArea 259 7.2 -925", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { name = "Basic Equipment Quartermaster", button = "right", expect = "window" }, label = "click" },
  { wait_ms = 2000 },
  { capture = "tool", tool = "client_inventory", args = { container = 1 }, pointer = "/items[design_id=2893]/slot", var = "slappack_slot" },
  { tool = "client_drag_drop", args = { from = { container = "Main", slot = "${slappack_slot}" }, to = { window = "VendorWin" } }, tier = "N1", label = "sell" },
  { wait_ms = 1500 },
]
[[row.expect]]
