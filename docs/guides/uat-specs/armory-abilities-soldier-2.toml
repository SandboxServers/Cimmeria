[[row]]
id = "Soldier-856"
title = "Takedown (856): press it from the bar"
expected = "The press leaves the client and the client applies the ability."
setup = [
  { tool = "@use_ability", args = { ability_id = 856, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 856 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 856, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 856 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"

