id = "DA-U45"
title = "The Debug Area DHD offers a GM every loaded gate, and nobody dials in"
expected = "As a GM, right-click the Debug Area DHD beside the gate: the dialling window lists the 13 gates on loaded worlds (The Castle, Harset, Tollana, Omega Site, Beta Site E1, Men'fa (Praxis), both Ihpet Craters, Lucia, Agnos, SGC, SGC W1, Dakara E1); dialling Harset opens the gate and walking in loads Harset; /gmdhd 29 is refused like an unknown address."
required_native = "N2"
known_issues = ["DA-06"]
notes = "The DHD (spawn 13800, template 1) stands at (245.4, 8.9, -983.4); the click aims at that point. Dialling from the window needs @window_click_row (L9), so the Harset dial is a human clause; /gmdhd 29 is the native GM dial (N2)."
setup = [
  { chat = ".gotolocation DebugArea 248 9.5 -980", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { point = { x = 245.4, y = 9.5, z = -983.4 }, button = "right", expect = "window" }, label = "dhd" },
  { wait_ms = 2500 },
  { tool = "client_input_key", args = { key = "Escape" }, optional = true },
  { chat = "/gmdhd 29", label = "dial-in", tier = "N2" },
  { wait_ms = 2500 },
]
[[row.expect]]
id = "grant"
text = "SigNoz: the DHD open granted the loaded gates (gm_dial_hub_grant)"
source = "signoz"
filter = "reason = 'gm_dial_hub_grant'"
field = "unenterable_count"
op = "eq"
value = 14
[[row.expect]]
id = "addresses"
text = "the new addresses went to the client (updateStargateAddress) before the window"
source = "packet"
message = "updateStargateAddress"
direction = "to_client"
min_rows = 1
[[row.expect]]
id = "window"
text = "the server opened the dialling window (onDisplayDHD)"
source = "packet"
message = "onDisplayDHD"
direction = "to_client"
[[row.expect]]
id = "dial-in-refused"
text = "/gmdhd 29 is refused like an unknown address"
source = "chat"
since = "dial-in"
contains = "Failed to dial"
[[row.expect]]
id = "outbound-only"
text = "SigNoz: the dial into the Debug Area was refused (dial_hub_is_outbound_only)"
source = "signoz"
filter = "reason = 'dial_hub_is_outbound_only'"
min_rows = 1
[[row.expect]]
id = "list"
text = "the dialling window lists the 13 gates"
source = "human"
question = "In the screenshot taken after the click (evidence dhd-window), does the DHD window list The Castle, Harset, Tollana, Omega Site, Beta Site E1, Men'fa (Praxis), both Ihpet Craters, Lucia, Agnos, SGC, SGC W1 and Dakara E1?"
[[row.expect]]
id = "dial-harset"
text = "dialling Harset from the window opens the gate and walking in loads Harset"
source = "human"
question = "Dial Harset from the DHD window: does the map's gate open about 4 s later, and does walking into it load Harset?"
required = false
[[row.evidence]]
name = "dhd-window"
tool = "lab_screenshot"
at = "dhd"

[[row]]
id = "DA-U46"
title = "A ring trip from the Compound station to the Arena pit"
expected = "Right-click the Compound ring console: the destination picker opens on world 1300's map with the other seven stations (regions 36-42); pick the Arena pit and step on the pad: the Compound rings rise, flash and drop with sound (sequence 10189), you arrive on the pit pad (210, -32.7, -725) as its rings drop (10198), and you can move about 5.5 s later."
required_native = "N3"
known_issues = ["DA-06", "K27"]
notes = "Needs client patches 007 and 010 in the lab client: the launcher's Update installs them from the published content manifest (content-current, 2026-10-05). Without 010 the trip still works but no rig draws. The picker click is stood in for by the stock binding setRingTransporterDestination (N3): the lab cannot click world-map icons yet. Stations: regions 35-42, consoles 13810-13817 (template 3), sequences 10189-10204 (Teleport Out, Teleport In per station, in region order)."
setup = [
  { chat = ".gotolocation DebugArea 229 7.8 -934", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { tool = "@world_click", args = { point = { x = 226.88, y = 7.9, z = -936.68 }, button = "right", expect = "any" }, label = "console" },
  { wait_ms = 2000 },
  { tool = "client_lua_eval", args = { chunk = "return pcall(setRingTransporterDestination, 35, 39)" }, label = "pick", tier = "N3" },
  { wait_ms = 500 },
  { tool = "@move_to", args = { point = { x = 224, y = 7.44, z = -938 }, arrival_m = 1, timeout_ms = 20000 }, label = "pad" },
  { wait_ms = 15000, label = "arrived" },
]
teardown = [{ chat = ".gotolocation DebugArea 251 8 -962", optional = true }]
[[row.expect]]
id = "list"
text = "the console sent the destination list (onRingTransporterList)"
source = "packet"
message = "onRingTransporterList"
direction = "to_client"
[[row.expect]]
id = "pick"
text = "the destination reached the server (setRingTransporterDestination 35 -> 39)"
source = "packet"
message = "setRingTransporterDestination"
direction = "to_server"
[[row.expect]]
id = "sequences"
text = "the client got both ring sequences (Teleport Out at the Compound, Teleport In at the pit)"
source = "packet"
message = "onSequence"
direction = "to_client"
min_rows = 2
[[row.expect]]
id = "not-dropped"
text = "the client's SequenceManager dropped neither sequence"
source = "client_event"
event = "client.sequence.dropped"
since = "pick"
max_rows = 0
timeout_ms = 2000
required = false
[[row.expect]]
id = "sent-log"
text = "SigNoz: the server sent the Compound's Teleport Out (10189) and the pit's Teleport In (10198)"
source = "signoz"
filter = "body CONTAINS 'Sent ring onSequence' AND seq_id IN (10189, 10198)"
min_rows = 2
required = false
[[row.expect]]
id = "still-1300"
text = "you are still in world 1300 after the trip"
source = "tool"
at = "arrived"
tool = "@player_state"
pointer = "/world_id"
op = "eq"
value = 1300
[[row.expect]]
id = "rings"
text = "the rings animate with sound at both pads, and you stand on the pit pad"
source = "human"
question = "Did the Compound rings rise, flash and drop with the ring sound, and are you now on the arena pit pad (on the water plane, K27) after its rings dropped? Is the rig base lit, not black or flat?"
[[row.evidence]]
name = "picker"
tool = "lab_screenshot"
at = "console"
[[row.evidence]]
name = "arrival"
tool = "lab_screenshot"
at = "arrived"
