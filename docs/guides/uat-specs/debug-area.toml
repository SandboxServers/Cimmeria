# Unified UAT, section "Debug Area" (world 1300, every station).
# Guide: docs/guides/unified-uat.md#debug-area (DA-U1 to DA-U46).
# Reference: docs/content/debug-area.md (zones, spawn tables, how each
# station works). Campaign: docs/analysis/debug-area/README.md.
#
# Where it runs: any server with the Debug Area seeded (DA-01 to DA-04,
# SA-01), with the GM lab account and a fresh SGU Soldier per run. A fresh
# character carries the starter kit (SI 3 9mm Pistol in the bandolier, the
# five starter abilities), so every shooting row has a loaded pistol, and
# its access level is the GM account's, so world 1300 lets it in.
#
# How a row is built:
# - Every row starts by moving to its own station with
#   `.gotolocation DebugArea <x> <y> <z>` and waiting for world 1300
#   (`client_wait_for`), so the rows run in any order. The coordinates are
#   the station points in debug-area.md; heights are a little above the
#   floor, so the player settles onto it.
# - Clicks stand within 3.5 u of the NPC (interact range is 5 u) and use
#   `@world_click` by name, which picks the nearest match: three Bankers are
#   "Storage Officer" and two registrars are "Organization Registrar".
#   A row that visits two neighbours walks between them with `@move_to`
#   (N1), so the move is not a GM step.
# - Shooting rows place 592 Pistol Shot on the bar in setup, before any
#   target is selected, so the placement press hits nothing and the graded
#   press in the steps is the bound key (N1).
# - AI rows set `.aggro on` in setup (a GM with `.aggro off` is never
#   acquired) and read the NPC side from SigNoz `npc_ai.aggro` rows, which
#   carry the spawn's `tag` (`DebugArea_*`). The arena keeps cycling for
#   anyone within 150 u (K25): filter on the tag, as these clauses do.
# - Rows that kill an NPC on purpose use `/gmkilltarget <id>` with the id
#   read from `@entity_find`, so they set `required_native = "G"`.
# - Teardown returns to the Z1 arrival (respawner 130's point).
# - The four character rows (DA-U39, DA-U40, DA-U42, DA-U44) make and
#   delete their own character, like castle-cellblock T01/T02, because they
#   test what a brand-new character starts with.
#
# Blocked rows say what they wait for: a non-GM account (DA-U2), the
# store window's buttons (DA-U7) and a seeded account (DA-U44).
#
# Client patches: DA-U42 needs 009-starter-hotbar and DA-U46 needs
# 007-castle-armory-ring and 010-debug-area-rings. All three are in the
# signed content manifest (content-current, published 2026-10-05), so the
# launcher's Update installs them on the lab client.

schema = 1

[section]
id = "debug-area"
system = "Debug Area"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-area/README.md#packets"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"

# ================================================================ Arrival

[[row]]
id = "DA-U1"
title = ".gotolocation DebugArea lands at the Z1 arrival in world 1300"
expected = "The client loads Ihpet_Crater_Light as world 1300; you stand at the Z1 arrival (251, 8, -962) in the south compound; the reply ends in [stargate arrival] (the gate's arrival pin is the Z1 point; [respawner] on a build before DA-07)."
known_issues = ["DA-06"]
notes = "Leaves for Castle first, so the step is always a cross-world move."
setup = [
  { chat = ".gotolocation Castle", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 8", timeout_ms = 60000 } },
  { wait_ms = 3000 },
]
step = [
  { chat = ".gotolocation DebugArea", label = "go" },
  { wait_ms = 20000 },
]
[[row.expect]]
id = "reply"
text = "the reply names world 1300's entry rule"
source = "chat"
since = "go"
matches = 'Moving entity .* to DebugArea \(251, 8, -962\) \[(respawner|stargate arrival)\]'
[[row.expect]]
id = "world-1300"
text = "the client's current world is 1300"
source = "tool"
tool = "@player_state"
pointer = "/world_id"
op = "eq"
value = 1300
[[row.expect]]
id = "wire-world"
text = "setupWorldParameters went to the client (it carries worldId 1300)"
source = "packet"
message = "setupWorldParameters"
direction = "to_client"
[[row.expect]]
id = "minimap"
text = "the minimap and map show the Debug Area, not CombatSim"
source = "human"
question = "In final.png, does the minimap location text name the Debug Area world (not CombatSim), and are you standing on the ground in a walled compound courtyard?"
[[row.expect]]
id = "logged"
text = "SigNoz records the move"
source = "signoz"
filter = "scope_name = 'console.feedback' AND body CONTAINS 'to DebugArea'"
min_rows = 1

[[row]]
id = "DA-U2"
title = "A non-GM never enters world 1300"
expected = "A non-GM headed for world 1300 (login, gate, ring, summon, .gotolocation) lands at their faction's start instead and reads \"The Debug Area is for GMs only. You have been returned to your faction's starting point.\""
blocked = "needs a non-GM lab account (matrix X2); covered by gm_only_worlds.rs, gate_travel/tests/gm_only_world.rs and live_db_a_non_gm_saved_in_the_debug_area_logs_in_at_the_faction_start"
[[row.expect]]
id = "line"
text = "the refusal line arrives once the home world has loaded"
source = "chat"
contains = "The Debug Area is for GMs only."
[[row.expect]]
id = "refused"
text = "SigNoz: WARN gm_only_world_refused names the player and both worlds"
source = "signoz"
filter = "event = 'gm_only_world_refused' AND refused_world = 'DebugArea'"
min_rows = 1

