setup = [
  { chat = "/gmgiveitem 4458 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "Discharge Ribbon Device" }, label = "equip" },
  { tool = "@use_ability", args = { ability_id = 2718, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 2718 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 2718, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 2718 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
