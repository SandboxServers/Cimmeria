# Debug Area armory: Soldier abilities, tree 0 (campaign debug-armory, DR-06).
# Generated by tools/ability_mechanics/debug_armory.py specs abilities; do not edit it by hand.
# Where it runs: the Debug Area (world 1300) with a fresh character per run. Every row
# gives its gear (weapon-requirement audit, README F3), presses the ability from the bar and
# grades the client events. Rows whose weapon the audit found none for are BLOCKED.

schema = 1

[section]
id = "armory-abilities-soldier-0"
system = "Debug Area armory: Soldier abilities, tree 0"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"
finish_intro = false

[[row]]
id = "Soldier-00"
title = "Soldier: the Debug Area, every tree ability, one hostile dummy"
expected = "The character stands in the Debug Area with its tree and a hostile dummy."
setup = [
  { wait_ms = 17000 },
  { chat = ".gotolocation DebugArea 246 6.6 -878", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
  { chat = "/gmgiveallabilities", tier = "G" },
  { tool = "@dummy", args = { disposition = "hostile" } },
]
step = [{ wait_ms = 1000 }]
[[row.expect]]
id = "world-1300"
text = "the character is in world 1300, the Debug Area"
source = "tool"
tool = "@player_state"
pointer = "/world_id"
op = "eq"
value = 1300

[[row]]
id = "Soldier-598"
title = "Quick Burst (598): press it from the bar with SGHC 6 SMG equipped"
expected = "The press leaves the client and the client applies the ability."
setup = [
  { chat = "/gmgiveitem 21 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "SGHC 6 SMG" }, label = "equip" },
  { tool = "@use_ability", args = { ability_id = 598, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 598 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 598, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 598 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"

