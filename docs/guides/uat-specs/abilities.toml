[[row.expect]]
id = "client-cleared"
text = "the client clears it"
source = "client_event"
event = "client.ability.applied"
match_fields = { kind = "state_flag", entity_id = "${dummy_id}", cleared = 64 }
since = "press"
timeout_ms = 8000
[[row.expect]]
id = "wire-flags"
text = "the server broadcast the dummy's state field (set and clear)"
source = "packet"
message = "onStateFieldUpdate"
direction = "to_client"
entity = "${dummy_id}"
min_rows = 2
[[row.expect]]
id = "cc-row"
text = "crowd_control_applied for this cast"
source = "signoz"
filter = "event = 'crowd_control_applied' AND ${cast_key}"

