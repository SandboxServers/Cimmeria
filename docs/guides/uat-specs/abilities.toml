# AB-09a: 856 Takedown (2608 Knockdown 5 s, 919 damage 100/10).

[[row]]
id = "AB-U17"
title = "Takedown locks the dummy's movement, then releases it"
expected = "BSF_MovementLock set, then cleared with refcount 0, on both sides."
notes = "A miss lands nothing (check qr_rolled)."
setup = [
  { chat = "/gmgiveability 856", tier = "G", optional = true },
  { tool = "@dummy", args = { disposition = "hostile" } },
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@use_ability", args = { ability_id = 856, place = true }, label = "place" },
  { wait_ms = 7000 },
  { tool = "@cooldowns_reset", args = { ability_id = 856 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 856, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 1000, label = "locked" },
  { wait_ms = 6000, label = "released" },
]
