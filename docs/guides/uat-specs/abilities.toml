# Unified UAT, section "Ability mechanics" (AB-R0 of the ability-mechanics
# lab UAT plan, docs/analysis/ability-mechanics/lab-uat-and-telemetry.md).
# Guide: docs/guides/unified-uat.md#ability-mechanics (AB-U1 to AB-U25).
#
# Where it runs: the colo (D-AU8), with the GM lab account and a fresh
# Soldier per run; colo rule 6 holds (only the lab characters and what they
# spawn are touched). Every id below was checked against db/resources/ and
# the packets' live-DB tests on 2026-10-04.
#
# How a row is built:
# - Setup gives the ability (`/gmgiveability`, G), places it on the bar
#   (`@use_ability` with `place = true`, N3 the first time) and, because
#   placing also presses it, resets its cooldown and clears what it did.
#   The graded press is the step: the bound hotbar key (`press = "key"`,
#   `fallback = "none"`, N1).
# - The setup press is in the row's window, so every client_event clause
#   reads `since = "press"`. Packet clauses cover the whole row (one tap per
#   row), so they assert only what both presses share.
# - `${cast_id}` is the step press's cast (automated-uat.md, "Client event
#   clauses and `${cast_id}`"). A cast_id is per caster, so every SigNoz
#   clause names the cast by `${cast_key}` (cast_id and its caster), never
#   by cast_id alone.
# - A row that needs several graded presses of a 30 s cooldown is split into
#   lettered rows (AB-U1a to AB-U1d): a cooldown reset between presses is a
#   GM action, and a GM step costs the row its N1 grade.
# - Teardown: `@clear_effects` on the lab character, `@cooldowns_reset`,
#   and `.dummy clear` (or `/gmdespawn` for a spawned mob).
# - Two-player rows (`players = 2`) need lab-account.p2.json (D-AU3: `lab2`).
#   p2's own `/gm*` lines need lab2 to be a GM account.
# - A hostile cast rolls QR, and `.qr` (D-AU2) does not exist: a miss on the
#   graded press FAILs a damage or debuff row. Check `qr_rolled` for the
#   row's cast_id in SigNoz before filing it.

schema = 1

[section]
id = "ability-mechanics"
system = "Ability mechanics"
guide = "docs/guides/unified-uat.md#ability-mechanics"
ledger = "docs/analysis/ability-mechanics/lab-uat-and-telemetry.md#ledger"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"

# ---------------------------------------------------------------- AB-U1
# AB-01: 597 Heal Focus (Self, effect 659 HealFocus 35 %), from every target.

[[row]]
id = "AB-U1a"
title = "Heal Focus with no target restores your own Focus"
expected = "The press leaves the client and restores your own Focus."
known_issues = ["B-15", "AB-E1"]
setup = [
  { chat = "/gmsetfocus 100 0", tier = "G" },
  { tool = "@use_ability", args = { ability_id = 597, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 597 } },
  { chat = "/gmsetfocus 100 0", tier = "G" },
]
step = [
  { tool = "@use_ability", args = { ability_id = 597, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client (B-15)"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 597 }
since = "press"
[[row.expect]]
id = "sent-target"
text = "what was sent next to what the UI had targeted (B-15 evidence, not graded)"
source = "client_event"
required = false
event = "client.ability.sent"
match_fields = { ability_id = 597 }
since = "press"
field = "client_target_id"
op = "exists"
[[row.expect]]
id = "not-dropped"
text = "the client did not drop the press"
source = "client_event"
event = "client.ability.press_dropped"
match_fields = { ability_id = 597 }
since = "press"
max_rows = 0
timeout_ms = 1000
[[row.expect]]
id = "applied"
text = "the client applied a stat update after the press"
source = "client_event"
event = "client.ability.applied"
match_fields = { kind = "stat" }
since = "press"
[[row.expect]]
id = "focus-ui"
text = "the client shows Focus above 100"
source = "tool"
tool = "@player_state"
pointer = "/focus"
op = "gt"
value = 100
[[row.expect]]
id = "focus-server"
text = "the server holds Focus above 100"
source = "server"
tool = "@ability_state"
pointer = "/state/stats[stat_id=8]/cur"
op = "gt"
value = 100
[[row.expect]]
id = "wire-sent"
text = "useAbility reached the server"
source = "packet"
message = "useAbility"
direction = "to_server"
[[row.expect]]
id = "wire-stat"
text = "the server sent the caster a stat update"
source = "packet"
message = "onStatUpdate"
direction = "to_client"
entity = "${player_entity_id}"
[[row.expect]]
id = "resolution"
text = "the cast resolved as a Self ability"
source = "signoz"
filter = "event = 'beneficial_cast' AND ${cast_key}"
field = "resolution"
op = "eq"
value = "self_ability"
[[row.expect]]
id = "heal-row"
text = "heal_focus ran for this cast"
source = "signoz"
filter = "event = 'heal_focus' AND ${cast_key}"

