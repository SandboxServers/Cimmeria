# Unified UAT, section "armory-gear-armor-2" (Debug Area Armory gear, DR-07).
# Written by: python tools/ability_mechanics/debug_armory.py specs gear --out-dir docs/guides/uat-specs
# Generated: do not hand-edit; rerun the command. Campaign: docs/analysis/debug-armory/README.md.
# One file is one run on its own fresh character: at most 30 rows, so its grants fit the 40-slot main bag. Never merge split files into one run.
# Armor rows have no server-side pass line except the optional DEBUG Inventory move persisted clause: the character sheet read and the human clause decide (DR-07).

schema = 1

[section]
id = "armory-gear-armor-2"
system = "Debug Area Armory gear (armor)"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"
finish_intro = false

[[row]]
id = "GA-7269"
title = "Deployment Harness equips into its slot"
expected = "The piece sits in equipment container 10 on the character sheet."
setup = [
  { chat = "/gmgiveitem 7269 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "Deployment Harness" } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@window_read", args = { kind = "character" }, label = "sheet" },
  { tool = "@screenshot" },
]
teardown = [
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sheet"
text = "the character sheet shows Deployment Harness in equipment container 10"
source = "human"
question = "Does the character sheet show Deployment Harness equipped (see the screenshot)?"
[[row.expect]]
id = "moved"
text = "SigNoz: Inventory move persisted for Deployment Harness into container 10"
source = "signoz"
required = false
filter = "body CONTAINS 'Inventory move persisted' AND item_name = 'Deployment Harness' AND target_container_id = 10 AND player_name CONTAINS '${character}'"
min_rows = 1

