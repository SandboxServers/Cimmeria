  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 1638 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is Shriek Zat'ni'katel before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon"
op = "eq"
value = "Shriek Zat'ni'katel"

[[row]]
id = "Archeologist-2848"
title = "Submit to your Lord (2848): press it from the bar with SI 3 9mm Pistol equipped"
expected = "The press leaves the client and the client applies the ability."
setup = [
  { tool = "@item_action", args = { action = "unequip", container = "Bandolier", slot = 1 }, label = "reset-slot1", optional = true },
  { tool = "@window_click", args = { target = "CharacterWin__auto_closebutton__" }, label = "close-sheet", optional = true },
  { chat = "/gmgiveitem 55 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "SI 3 9mm Pistol" }, label = "equip" },
  { tool = "@window_click", args = { target = "InventoryWin__auto_closebutton__" }, label = "close-bag", optional = true },
  { tool = "@key", args = { key = "F1" }, label = "select-slot1" },
  { wait_ms = 1500 },
  { tool = "@use_ability", args = { ability_id = 2848, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 2848 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 2848, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 2848 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is SI 3 9mm Pistol before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon"
op = "eq"
value = "SI 3 9mm Pistol"

