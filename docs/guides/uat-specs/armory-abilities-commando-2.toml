text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is Pump Shotgun before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon"
op = "eq"
value = "Pump Shotgun"

[[row]]
id = "Commando-1354"
title = "Disabling Shot (1354): press it from the bar with SR1 .50-Cal Rifle equipped"
expected = "The press leaves the client and the client applies the ability."
setup = [
  { tool = "@item_action", args = { action = "unequip", container = "Bandolier", slot = 1 }, label = "reset-slot1", optional = true },
  { tool = "@window_click", args = { target = "CharacterWin__auto_closebutton__" }, label = "close-sheet", optional = true },
  { chat = "/gmgiveitem 3287 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "SR1 .50-Cal Rifle" }, label = "equip" },
  { tool = "@window_click", args = { target = "InventoryWin__auto_closebutton__" }, label = "close-bag", optional = true },
  { tool = "@key", args = { key = "F1" }, label = "select-slot1" },
  { wait_ms = 1500 },
  { tool = "@use_ability", args = { ability_id = 1354, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 1354 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 1354, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 1354 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is SR1 .50-Cal Rifle before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon"
op = "eq"
value = "SR1 .50-Cal Rifle"

