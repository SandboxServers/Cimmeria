# Debug Area armory: Commando abilities, tree 2 (campaign debug-armory, DR-06).
# Generated by tools/ability_mechanics/debug_armory.py specs abilities; do not edit it by hand.
# Where it runs: the Debug Area (world 1300) with a fresh character per run. Every row
# gives its gear (weapon-requirement audit, README F3), presses the ability from the bar and
# grades the client events. Rows whose weapon the audit found none for are BLOCKED.

schema = 1

[section]
id = "armory-abilities-commando-2"
system = "Debug Area armory: Commando abilities, tree 2"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Commando"
gender = "male"
first = "Uat"
finish_intro = false

[[row]]
id = "Commando-00"
title = "Commando: the Debug Area, every tree ability, one hostile dummy"
expected = "The character stands in the Debug Area with its tree and a hostile dummy."
setup = [
  { wait_ms = 17000 },
  { chat = ".gotolocation DebugArea 246 6.6 -878", tier = "G" },
  { tool = "client_wait_for", args = { lua_condition = "getCurrentWorldID() == 1300", timeout_ms = 60000 } },
  { wait_ms = 3000 },
  { chat = "/gmgiveallabilities", tier = "G" },
  { tool = "@dummy", args = { disposition = "hostile" } },
]
step = [{ wait_ms = 1000 }]
[[row.expect]]
id = "world-1300"
text = "the character is in world 1300, the Debug Area"
source = "tool"
tool = "@player_state"
pointer = "/world_id"
op = "eq"
value = 1300

[[row]]
id = "Commando-655"
title = "Snap Shot (655): press it from the bar with SR1 .50-Cal Rifle equipped"
expected = "The press leaves the client and the client applies the ability."
setup = [
  { tool = "@item_action", args = { action = "unequip", container = "Bandolier", slot = 1 }, label = "reset-slot1", optional = true },
  { tool = "@window_click", args = { target = "CharacterWin__auto_closebutton__" }, label = "close-sheet", optional = true },
  { chat = "/gmgiveitem 3287 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "SR1 .50-Cal Rifle" }, label = "equip" },
  { tool = "@window_click", args = { target = "InventoryWin__auto_closebutton__" }, label = "close-bag", optional = true },
  { tool = "@key", args = { key = "F1" }, label = "select-slot1" },
  { wait_ms = 1500 },
  { tool = "@use_ability", args = { ability_id = 655, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 655 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 655, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 655 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is SR1 .50-Cal Rifle before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon"
op = "eq"
value = "SR1 .50-Cal Rifle"

