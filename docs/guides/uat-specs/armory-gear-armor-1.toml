min_rows = 1

[[row]]
id = "GA-5317"
title = "Neutronium Ablative Gloves equips into its slot"
expected = "The piece sits in equipment container 8 on the character sheet."
setup = [
  { chat = "/gmgiveitem 5317 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "Neutronium Ablative Gloves" } },
  { tool = "@window_click", args = { target = "InventoryWin__auto_closebutton__" }, label = "close-bag" },
  { wait_ms = 2000 },
]
step = [
  { tool = "@window_read", args = { kind = "character" }, label = "sheet" },
