title = "CO2 Pistol Dartgun fires its ranged ability on a right-click"
expected = "The right-click leaves the client as ability 1086."
setup = [
  { chat = "/gmgiveitem 3584 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "CO2 Pistol Dartgun" } },
  { tool = "@dummy", args = { disposition = "hostile", template_id = 1310 } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@world_click", args = { entity_id = "${dummy_id}", button = "right" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" } },
  { tool = "@cooldowns_reset" },
  { tool = "@dummy", args = { disposition = "clear" } },
]
[[row.expect]]
id = "sent"
text = "the right-click sends ability 1086 (RANGED binding)"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 1086 }
since = "press"

