[section]
id = "armory-gear-weapons-1"
system = "Debug Area Armory gear (weapons)"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"

[[row]]
id = "GW-3128"
title = "Test Weapon fires its ranged ability on a right-click"
expected = "The right-click leaves the client as ability 559."
setup = [
  { chat = "/gmgiveitem 3128 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "Test Weapon" } },
  { tool = "@dummy", args = { disposition = "hostile", template_id = 1310 } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@world_click", args = { entity_id = "${dummy_id}", button = "right" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" } },
  { tool = "@cooldowns_reset" },
  { tool = "@dummy", args = { disposition = "clear" } },
]
[[row.expect]]
id = "sent"
text = "the right-click sends ability 559 (RANGED binding)"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 559 }
since = "press"

