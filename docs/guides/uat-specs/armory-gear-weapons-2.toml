  { tool = "@item_action", args = { action = "equip", name = "Nenz 25S-II Rifle" } },
  { tool = "@dummy", args = { disposition = "hostile", template_id = 1310 } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@world_click", args = { entity_id = "${dummy_id}", button = "right" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" } },
  { tool = "@cooldowns_reset" },
  { tool = "@dummy", args = { disposition = "clear" } },
]
[[row.expect]]
id = "sent"
text = "the right-click sends ability 581 (RANGED binding)"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 581 }
since = "press"

