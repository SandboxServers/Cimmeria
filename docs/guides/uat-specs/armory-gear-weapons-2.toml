schema = 1

[section]
id = "armory-gear-weapons-2"
system = "Debug Area Armory gear (weapons)"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"
finish_intro = false

[[row]]
id = "GW-5009"
title = "GL 24 Grenade Launcher has no ranged binding (F8): the right-click is refused"
expected = "The right-click gets the no-ranged-attack line and the server logs weapon_unbound."
setup = [
  { wait_ms = 10500 },
  { chat = "/gmgiveitem 5009 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "GL 24 Grenade Launcher" } },
  { tool = "@dummy", args = { disposition = "hostile", template_id = 1310 } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@world_click", args = { entity_id = "${dummy_id}", button = "right" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" } },
  { tool = "@cooldowns_reset" },
  { tool = "@dummy", args = { disposition = "clear" } },
]
[[row.expect]]
id = "unbound"
text = "SigNoz: weapon_unbound for item 5009, reason no_ranged_attack (a measured gap, PASS on this line)"
source = "signoz"
filter = "scope_name = 'abilities' AND event = 'weapon_unbound' AND reason = 'no_ranged_attack' AND item_type_id = 5009 AND player_name CONTAINS '${character}'"
min_rows = 1

