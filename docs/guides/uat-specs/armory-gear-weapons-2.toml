# Unified UAT, section "armory-gear-weapons-2" (Debug Area Armory gear, DR-07).
# Written by: python tools/ability_mechanics/debug_armory.py specs gear --out-dir docs/guides/uat-specs
# Generated: do not hand-edit; rerun the command. Campaign: docs/analysis/debug-armory/README.md.
# One file is one run on its own fresh character: at most 30 rows, so its grants fit the 40-slot main bag. Never merge split files into one run.

schema = 1

[section]
id = "armory-gear-weapons-2"
system = "Debug Area Armory gear (weapons)"
guide = "docs/guides/unified-uat.md#debug-area"
ledger = "docs/analysis/debug-armory/README.md"
account = "gm"
character = "fresh"

[section.fresh]
alignment = "sgu"
archetype = "Soldier"
gender = "male"
first = "Uat"
finish_intro = false

[[row]]
id = "GW-5009"
title = "GL 24 Grenade Launcher has no ranged binding (F8): the right-click is refused"
expected = "The right-click gets the no-ranged-attack line and the server logs weapon_unbound."
setup = [
  { wait_ms = 17000 },
  { wait_ms = 10500 },
  { tool = "@item_action", args = { action = "unequip", container = "Bandolier", slot = 1 }, label = "reset-slot1", optional = true },
  { tool = "@window_click", args = { target = "CharacterWin__auto_closebutton__" }, label = "close-sheet", optional = true },
  { chat = "/gmgiveitem 5009 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "GL 24 Grenade Launcher" } },
  { tool = "@window_click", args = { target = "InventoryWin__auto_closebutton__" }, label = "close-bag" },
  { tool = "@key", args = { key = "F1" }, label = "select-slot1" },
  { tool = "@dummy", args = { disposition = "hostile", template_id = 1310 } },
  { wait_ms = 2000 },
]
step = [
  { tool = "@camera", args = { face_entity_id = "${dummy_id}", zoom_to = 400 }, label = "face" },
  { tool = "@camera", args = { yaw_counts = -300, pitch_deg = -15 }, label = "offset" },
  { tool = "@target", args = { entity_id = "${dummy_id}" } },
  { tool = "@world_click", args = { entity_id = "${dummy_id}", button = "right" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
  { tool = "@dummy", args = { disposition = "clear" } },
]
[[row.expect]]
id = "unbound"
text = "SigNoz: weapon_unbound for item 5009, reason no_ranged_attack (a measured gap, PASS on this line)"
source = "signoz"
filter = "scope_name = 'abilities' AND event = 'weapon_unbound' AND reason = 'no_ranged_attack' AND item_type_id = 5009 AND player_name CONTAINS '${character}'"
min_rows = 1
[[row.expect]]
id = "armed"
text = "the active bandolier weapon is item 5009 before the press"
source = "tool"
tool = "@player_state"
pointer = "/ammo/weapon_item_id"
op = "eq"
value = 5009

