id = "Commando-1357"
title = "Execution (1357): press it from the bar with Heavy Combat Knife equipped"
expected = "The press leaves the client and the client applies the ability."
setup = [
  { chat = "/gmgiveitem 3334 1", tier = "G" },
  { tool = "@item_action", args = { action = "equip", name = "Heavy Combat Knife" }, label = "equip" },
  { tool = "@use_ability", args = { ability_id = 1357, place = true }, label = "place" },
  { wait_ms = 3000 },
  { tool = "@cooldowns_reset", args = { ability_id = 1357 } },
]
step = [
  { tool = "@use_ability", args = { ability_id = 1357, press = "key", fallback = "none" }, label = "press" },
  { wait_ms = 3000 },
]
teardown = [
  { tool = "@clear_effects", args = { name = "${character}" }, optional = true },
  { tool = "@cooldowns_reset" },
]
[[row.expect]]
id = "sent"
text = "the press leaves the client"
source = "client_event"
event = "client.ability.sent"
match_fields = { ability_id = 1357 }
since = "press"
[[row.expect]]
id = "applied"
text = "the client applies the ability after the press"
source = "client_event"
event = "client.ability.applied"
since = "press"
