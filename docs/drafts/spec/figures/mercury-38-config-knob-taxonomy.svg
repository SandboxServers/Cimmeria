<text text-anchor="start" x="15" y="-13.5" font-family="Helvetica,sans-Serif" font-size="10.00">The asymmetry is the point. The Mercury wire format is overwhelmingly hard&#45;coded — the only INI key with any wire&#45;adjacent relevance is NetInactivityTimeout (UE3 game layer, not Mercury), and the only runtime&#45;negotiated quantities are the per&#45;session cipher key and the server&#45;advertised tick rate. A server developer searching the INI for &quot;AckTimeout&quot; or &quot;MaxChannels&quot; will find UE3 TcpNetDriver keys that are read at startup but never consulted by the Mercury layer — see §2.2.</text>
