<text text-anchor="start" x="14.88" y="-13.5" font-family="Helvetica,sans-Serif" font-size="10.00">CONSTANT_LENGTH = 49 in the SGW client&#39;s InterfaceElement table. Emitting the stock 36&#45;byte body fails the table check and the client drops the packet silently — see §1.10.6. The 12&#45;byte SGW&#45;only field is a previous&#45;position reference passed verbatim into the client&#39;s PackageAndSendEntityMove::pOrientation → pPrevPos alias (NOT a velocity vector and NOT a rotation); it is zero at world entry because no prior position exists to delta from. The physics byte is 0x01 at world entry.</text>
