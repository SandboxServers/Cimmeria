amily="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="364" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >10</tspan></text><line x1="40" y1="345" x2="40" y2="345" stroke="#000000" stroke-width="1" /><line x1="40" y1="345" x2="40" y2="383" stroke="#000000" stroke-width="1" /><line x1="40" y1="345" x2="40" y2="383" stroke="#000000" stroke-width="1" /><line x1="680" y1="345" x2="680" y2="383" stroke="#000000" stroke-width="1" /><line x1="40" y1="345" x2="40" y2="383" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="365" text-anchor="middle" dominant-baseline="middle" >  BASE-DIRECT — msg_id in 0xC0..0xFC. word_len = args only; channel-implicit entity.</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="402" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >20</tspan></text><line x1="40" y1="383" x2="40" y2="398" stroke="#000000" stroke-width="1" /><line x1="680" y1="383" x2="680" y2="428" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="398" x2="680" y2="428" stroke="#000000" stroke-width="1" /><line x1="40" y1="408" x2="40" y2="453" stroke="#000000" stroke-width="1" /><line x1="680" y1="438" x2="680" y2="453" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="408" x2="680" y2="438" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="472" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monos