<?xml version="1.0" encoding="UTF-8"?><svg xmlns:svg="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.0" width="710" height="346" viewBox="0 0 710 346" >
<!-- cimmeria-bg-injected --><style>.cimmeria-bg{fill:transparent}@media(prefers-color-scheme:dark){.cimmeria-bg{fill:white}}</style><rect class="cimmeria-bg" width="100%" height="100%"/><text x="60" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >0</text><text x="100" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >1</text><text x="140" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >2</text><text x="180" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >3</text><text x="220" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >4</text><text x="260" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >5</text><text x="300" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >6</text><text x="340" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >7</text><text x="380" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >8</text><text x="420" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >9</text><text x="460" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >a</text><text x="500" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >b</text><text x="540" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >c</text><text x="580" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >d</text><text x="620" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >e</text><text x="660" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >f</text><text fill="#fff4d6" x="320" y="35" text-anchor="middle" dominant-baseline="middle" >packet[0] data — flags byte + body of a previously sent reliable packet</text><text fill="#ddffdd" x="640" y="35" text-anchor="middle" dominant-baseline="middle" >packet[0] length  : i16 LE, POSITIVE</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="34" text-anchor="end" >00</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="72" text-anchor="end" >10</text><text fill="#fff4d6" x="320" y="73" text-anchor="middle" dominant-baseline="middle" >packet[1] data — flags byte + body</text><text fill="#ddffdd" x="640" y="73" text-anchor="middle" dominant-baseline="middle" >packet[1] length  : i16 LE, POSITIVE</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="110" text-anchor="end" >20</text><text fill="#fff4d6" x="320" y="111" text-anchor="middle" dominant-baseline="middle" >packet[N] data — flags byte + body of LAST piggybacked packet</text><text font-style="bold" fill="#ffcccc" x="640" y="111" text-anchor="middle" dominant-baseline="middle" >packet[N] length  : i16 LE, ~length (NEGATIVE = terminator)</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="148" text-anchor="end" >30</text><line x1="40" y1="129" x2="40" y2="129" stroke="#000000" stroke-width="1" /><line x1="40" y1="129" x2="40" y2="167" stroke="#000000" stroke-width="1" /><line x1="40" y1="129" x2="40" y2="167" stroke="#000000" stroke-width="1" /><line x1="680" y1="129" x2="680" y2="167" stroke="#000000" stroke-width="1" /><line x1="40" y1="129" x2="40" y2="167" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="149" text-anchor="middle" dominant-baseline="middle" >Receiver pops the i16 LE length; if NEGATIVE, applies ~ to recover positive length and stops after this entry.</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="186" text-anchor="end" >40</text><line x1="40" y1="167" x2="40" y2="182" stroke="#000000" stroke-width="1" /><line x1="680" y1="167" x2="680" y2="212" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="182" x2="680" y2="212" stroke="#000000" stroke-width="1" /><line x1="40" y1="192" x2="40" y2="237" stroke="#000000" stroke-width="1" /><line x1="680" y1="222" x2="680" y2="237" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="192" x2="680" y2="222" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="256" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><line x1="40" y1="237" x2="680" y2="237" stroke="#000000" stroke-width="1" /><line x1="680" y1="237" x2="680" y2="275" stroke="#000000" stroke-width="1" /><line x1="40" y1="237" x2="40" y2="275" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="257" text-anchor="middle" dominant-baseline="middle" >Each embedded packet has its own flags byte and is processed as if received independently — but its own footer carries no acks/seq/fragments.</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="256" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="294" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >10</tspan></text><line x1="40" y1="275" x2="40" y2="290" stroke="#000000" stroke-width="1" /><line x1="680" y1="275" x2="680" y2="320" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="290" x2="680" y2="320" stroke="#000000" stroke-width="1" /><line x1="40" y1="300" x2="40" y2="345" stroke="#000000" stroke-width="1" /><line x1="680" y1="330" x2="680" y2="345" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="300" x2="680" y2="330" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="364" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text></svg>