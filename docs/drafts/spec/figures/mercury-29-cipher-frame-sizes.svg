<?xml version="1.0" encoding="UTF-8"?><svg xmlns:svg="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.0" width="710" height="384" viewBox="0 0 710 384" >
<!-- cimmeria-bg-injected --><style>.cimmeria-bg{fill:transparent}@media(prefers-color-scheme:dark){.cimmeria-bg{fill:white}}</style><rect class="cimmeria-bg" width="100%" height="100%"/><text x="60" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >0</text><text x="100" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >1</text><text x="140" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >2</text><text x="180" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >3</text><text x="220" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >4</text><text x="260" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >5</text><text x="300" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >6</text><text x="340" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >7</text><text x="380" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >8</text><text x="420" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >9</text><text x="460" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >a</text><text x="500" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >b</text><text x="540" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >c</text><text x="580" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >d</text><text x="620" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >e</text><text x="660" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >f</text><text fill="#bdd7ee" x="360" y="35" text-anchor="middle" dominant-baseline="middle" >Mercury plaintext (flags + body + footer) — 21 bytes</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="34" text-anchor="end" >00</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="72" text-anchor="end" >10</text><text fill="#bdd7ee" x="260" y="73" text-anchor="middle" dominant-baseline="middle" >plaintext — 21 bytes</text><text fill="#ffeedd" x="580" y="73" text-anchor="middle" dominant-baseline="middle" >PKCS#7 pad (11 × 0x0B) — 11 B</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="110" text-anchor="end" >20</text><text fill="#ddffdd" x="360" y="111" text-anchor="middle" dominant-baseline="middle" >AES-256-CBC ciphertext over (plaintext+pad) — 32 bytes, same length as padded input</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="148" text-anchor="end" >30</text><text fill="#ddffdd" x="260" y="149" text-anchor="middle" dominant-baseline="middle" >AES-256-CBC ciphertext — 32 B</text><text fill="#ffcc99" x="580" y="149" text-anchor="middle" dominant-baseline="middle" >HMAC-MD5 tag — 16 B (always)</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="186" text-anchor="end" >40</text><line x1="40" y1="167" x2="40" y2="167" stroke="#000000" stroke-width="1" /><line x1="40" y1="167" x2="40" y2="205" stroke="#000000" stroke-width="1" /><line x1="40" y1="167" x2="40" y2="205" stroke="#000000" stroke-width="1" /><line x1="680" y1="167" x2="680" y2="205" stroke="#000000" stroke-width="1" /><line x1="40" y1="167" x2="40" y2="205" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="187" text-anchor="middle" dominant-baseline="middle" >On-wire frame: 32 B ct + 16 B HMAC = 48 B total. Cipher overhead: 27 bytes (11 pad + 16 HMAC) above the 21 B plaintext.</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="224" text-anchor="end" >50</text><line x1="40" y1="205" x2="40" y2="220" stroke="#000000" stroke-width="1" /><line x1="680" y1="205" x2="680" y2="250" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="220" x2="680" y2="250" stroke="#000000" stroke-width="1" /><line x1="40" y1="230" x2="40" y2="275" stroke="#000000" stroke-width="1" /><line x1="680" y1="260" x2="680" y2="275" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="230" x2="680" y2="260" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="294" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><line x1="40" y1="275" x2="680" y2="275" stroke="#000000" stroke-width="1" /><line x1="680" y1="275" x2="680" y2="313" stroke="#000000" stroke-width="1" /><line x1="40" y1="275" x2="40" y2="313" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="295" text-anchor="middle" dominant-baseline="middle" >Minimum overhead: 17 B (1 pad byte + 16 HMAC). Maximum: 32 B (full 16-byte pad block + 16 HMAC). PKCS#7 always pads.</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="294" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="332" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >10</tspan></text><line x1="40" y1="313" x2="40" y2="328" stroke="#000000" stroke-width="1" /><line x1="680" y1="313" x2="680" y2="358" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="328" x2="680" y2="358" stroke="#000000" stroke-width="1" /><line x1="40" y1="338" x2="40" y2="383" stroke="#000000" stroke-width="1" /><line x1="680" y1="368" x2="680" y2="383" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="338" x2="680" y2="368" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="402" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text></svg>