<svg xmlns="http://www.w3.org/2000/svg" width="608" height="576" class="svgbob">
<!-- cimmeria-bg-injected --><style>.cimmeria-bg{fill:transparent}@media(prefers-color-scheme:dark){.cimmeria-bg{fill:white}}</style><rect class="cimmeria-bg" width="100%" height="100%"/>
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}
.svgbob rect.backdrop { fill: transparent !important; } @media (prefers-color-scheme: dark) { .svgbob rect.backdrop { fill: white !important; } }

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

</style>
  <defs>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="608" height="576"></rect>
  <text x="2" y="28" >TX Window (cap = 45 slots)   next_tx_seq advances on send; pruned on ack</text>
  <text x="18" y="60" >sent+acked  |  sent, awaiting ack (in-flight)  |  unsent</text>
  <text x="18" y="108" >... N-3  N-2 | N-1 |  N  | N+1 | N+2 | ... N+44 | N+45 N+46 ...</text>
  <text x="106" y="156" >700ms ACK   next_tx_seq</text>
  <text x="106" y="172" >timeout     (send pointer)</text>
  <text x="18" y="204" >If ack received: remove TxEntry from VecDeque</text>
  <text x="18" y="220" >If timeout &gt; 700ms: retransmit_count++, re-queue for send</text>
  <text x="18" y="236" >If retransmit_count &gt; 20: channel → Disconnected</text>
  <text x="2" y="284" >RX Window (cap = 64 slots)   expected_rx_seq advances on ordered delivery</text>
  <text x="18" y="316" >delivered  |   received (may have gaps)   |  not yet received</text>
  <text x="18" y="364" >... M-2  M-1 |  M  | M+1 | ??? | M+3 |  ... M+63 | M+64 M+65 ...</text>
  <text x="90" y="412" >expected_rx_seq</text>
  <text x="98" y="428" >(delivery pointer)</text>
  <text x="18" y="460" >Seq M+2 shown as ??? = not yet received (gap in delivery)</text>
  <text x="18" y="476" >Out-of-order arrivals stored until gap fills</text>
  <text x="18" y="492" >Each received seq_id generates an ack piggybacked in next outgoing packet</text>
  <text x="2" y="540" >Sequence number arithmetic: wrapping u32 (mod 2^32)</text>
  <text x="2" y="556" >Fragment key: frag_begin (u32); slot index = seq_id - frag_begin</text>
  <g>
    <line x1="8" y1="88" x2="552" y2="88" class="solid"></line>
    <line x1="116" y1="88" x2="116" y2="120" class="solid"></line>
    <line x1="404" y1="88" x2="404" y2="120" class="solid"></line>
  </g>
  <g>
    <line x1="8" y1="120" x2="560" y2="120" class="solid"></line>
  </g>
  <g>
    <line x1="8" y1="344" x2="528" y2="344" class="solid"></line>
    <line x1="108" y1="344" x2="108" y2="376" class="solid"></line>
    <line x1="356" y1="344" x2="356" y2="376" class="solid"></line>
  </g>
  <g>
    <line x1="8" y1="376" x2="528" y2="376" class="solid"></line>
  </g>
</svg>