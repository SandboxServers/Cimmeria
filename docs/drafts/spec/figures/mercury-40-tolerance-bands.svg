<text text-anchor="start" x="31.12" y="-13.5" font-family="Helvetica,sans-Serif" font-size="10.00">The green column is where a reimplementation has real freedom — these are the levers a server author can pull without the client noticing. The pink column is the cliff: each row&#39;s boundary between &quot;tolerated&quot; and &quot;REQUIRED violation&quot; is what §2.4 enforces for that axis. The tolerance always has a floor; nothing in §2.5 is unbounded.</text>
