ont-style="italic" dominant-baseline="middle" x="35" y="160" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><line x1="40" y1="145" x2="680" y2="145" stroke="#000000" stroke-width="1" /><rect x="40" y="145" height="30" width="640" fill="#ddffdd" /><line x1="40" y1="145" x2="680" y2="145" stroke="#000000" stroke-width="1" /><line x1="40" y1="175" x2="680" y2="175" stroke="#000000" stroke-width="1" /><line x1="680" y1="145" x2="680" y2="175" stroke="#000000" stroke-width="1" /><line x1="40" y1="145" x2="40" y2="175" stroke="#000000" stroke-width="1" /><text font-size="12" x="360" y="161" text-anchor="middle" dominant-baseline="middle" >HMAC-MD5 authentication tag  (16 bytes, keyed with session_key, covers ciphertext only)</text></svg>