<!-- cimmeria-bg-injected --><style>.cimmeria-bg{fill:transparent}@media(prefers-color-scheme:dark){.cimmeria-bg{fill:white}}</style><rect class="cimmeria-bg" width="100%" height="100%"/><text x="60" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >0</text><text x="100" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >1</text><text x="140" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >2</text><text x="180" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >3</text><text x="220" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >4</text><text x="260" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >5</text><text x="300" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >6</text><text x="340" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >7</text><text x="380" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >8</text><text x="420" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >9</text><text x="460" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >a</text><text x="500" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >b</text><text x="540" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >c</text><text x="580" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >d</text><text x="620" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >e</text><text x="660" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >f</text><text font-style="bold" fill="#f4cccc" x="80" y="35" text-anchor="middle" dominant-baseline="middle" >Stock BW — uint16 flags, network order</text><text fill="#fff4d6" x="340" y="35" text-anchor="middle" dominant-baseline="middle" >message body</text><text fill="#f4cccc" x="620" y="35" text-anchor="middle" dominant-baseline="middle" >footer (network byte order)</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="34" text-anchor="end" >00</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="72" text-anchor="end" >10</text><line x1="40" y1="53" x2="40" y2="53" stroke="#000000" stroke-width="1" /><line x1="40" y1="53" x2="40" y2="91" stroke="#000000" stroke-width="1" /><line x1="40" y1="53" x2="40" y2="91" stroke="#000000" stroke-width="1" /><line x1="680" y1="53" x2="680" y2="91" stroke="#000000" stroke-width="1" /><line x1="40" y1="53" x2="40" y2="91" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="73" text-anchor="middle" dominant-baseline="middle" >  STOCK BIGWORLD 2.0.1 — 2-byte flags carry low byte (0x01..0x80) AND high byte (FLAG_HAS_CHECKSUM 0x0100, FLAG_CREATE_CHANNEL 0x0200, FLAG_HAS_CUMULATIVE_ACK 0x0400, FLAG_INDEXED_CHANNEL 0x0800). Footer fields little-end-first via BW_HTONS / BW_HTONL.</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="110" text-anchor="end" >20</text><line x1="40" y1="91" x2="40" y2="106" stroke="#000000" stroke-width="1" /><line x1="680" y1="91" x2="680" y2="136" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="106" x2="680" y2="136" stroke="#000000" stroke-width="1" /><line x1="40" y1="116" x2="40" y2="161" stroke="#000000" stroke-width="1" /><line x1="680" y1="146" x2="680" y2="161" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="116" x2="680" y2="146" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="180" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-style="bold" fill="#bdd7ee" x="60" y="181" text-anchor="middle" dominant-baseline="middle" >SGW — uint8 flags</text><text fill="#fff4d6" x="320" y="181" text-anchor="middle" dominant-baseline="middle" >message body</text><text fill="#cce5ff" x="620" y="181" text-anchor="middle" dominant-baseline="middle" >footer (little-endian)</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="180" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="218" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >10</tspan></text><line x1="40" y1="199" x2="40" y2="199" stroke="#000000" stroke-width="1" /><line x1="40" y1="199" x2="40" y2="237" stroke="#000000" stroke-width="1" /><line x1="40" y1="199" x2="40" y2="237" stroke="#000000" stroke-width="1" /><line x1="680" y1="199" x2="680" y2="237" stroke="#000000" stroke-width="1" /><line x1="40" y1="199" x2="40" y2="237" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="219" text-anchor="middle" dominant-baseline="middle" >  SGW — 1-byte flags (low byte only). NO checksum / no create-channel / no cumulative-ack / no indexed-channel — all four high-byte flags absent. Footer fields LITTLE-ENDIAN — emit seq 0x12345678 and verify wire bytes 78 56 34 12.</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="256" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >20</tspan></text><line x1="40" y1="237" x2="40" y2="252" stroke="#000000" stroke-width="1" /><line x1="680" y1="237" x2="680" y2="282" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="252" x2="680" y2="282" stroke="#000000" stroke-width="1" /><line x1="40" y1="262" x2="40" y2="307" stroke="#000000" stroke-width="1" /><line x1="680" y1="292" x2="680" y2="307" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="262" x2="680" y2="292" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="326" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text></svg>