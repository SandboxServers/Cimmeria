<!-- cimmeria-bg-injected --><style>.cimmeria-bg{fill:transparent}@media(prefers-color-scheme:dark){.cimmeria-bg{fill:white}}</style><rect class="cimmeria-bg" width="100%" height="100%"/><style>#container{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#container .actor{stroke:#9370DB;fill:#ECECFF;}#container text.actor>tspan{fill:black;stroke:none;}#container .actor-line{stroke:#9370DB;}#container .messageLine0{stroke-width:1.5;stroke-dasharray:none;stroke:#333;}#container #arrowhead path{fill:#333;stroke:#333;}#container .messageText{fill:#333;stroke:none;}#container .note{stroke:#aaaa33;fill:#fff5ad;}#container .noteText,#container .noteText>tspan{fill:black;stroke:none;}</style><defs><marker id="arrowhead" refX="7.9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M -1 0 L 10 5 L 0 10 z"></path></marker></defs><g><rect x="1256" y="894" fill="#eaeaea" stroke="#666" width="150" height="65" rx="3" ry="3" class="actor actor-bottom"></rect><text x="1331" y="926.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="1331" dy="0">Application</tspan></text></g><g><rect x="909" y="894" fill="#eaeaea" stroke="#666" width="164" height="65" rx="3" ry="3" class="actor actor-bottom"></rect><text x="991" y="926.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="991" dy="0">FragmentAssembler</tspan></text></g><g><rect x="439" y="894" fill="#eaeaea" stroke="#666" width="150" height="65" rx="3" ry="3" class="actor actor-bottom"></rect><text x="514" y="926.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="514" dy="0">Network (UDP)</tspan></text></g><g><rect x="0" y="894" fill="#eaeaea" stroke="#666" width="150" height="65" rx="3" ry="3" class="actor actor-bottom"></rect><text x="75" y="926.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="75" dy="0">Sender</tspan></text></g><g><line x1="1331" y1="65" x2="1331" y2="894" class="actor-line" stroke-width="0.5px" stroke="#999"></line><rect x="1256" y="0" fill="#eaeaea" stroke="#666" width="150" height="65" rx="3" ry="3" class="actor actor-top"></rect><text x="1331" y="32.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="1331" dy="0">Application</tspan></text></g><g><line x1="991" y1="65" x2="991" y2="894" class="actor-line" stroke-width="0.5px" stroke="#999"></line><rect x="909" y="0" fill="#eaeaea" stroke="#666" width="164" height="65" rx="3" ry="3" class="actor actor-top"></rect><text x="991" y="32.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="991" dy="0">FragmentAssembler</tspan></text></g><g><line x1="514" y1="65" x2="514" y2="894" class="actor-line" stroke-width="0.5px" stroke="#999"></line><rect x="439" y="0" fill="#eaeaea" stroke="#666" width="150" height="65" rx="3" ry="3" class="actor actor-top"></rect><text x="514" y="32.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="514" dy="0">Network (UDP)</tspan></text></g><g><line x1="75" y1="65" x2="75" y2="894" class="actor-line" stroke-width="0.5px" stroke="#999"></line><rect x="0" y="0" fill="#eaeaea" stroke="#666" width="150" height="65" rx="3" ry="3" class="actor actor-top"></rect><text x="75" y="32.5" dominant-baseline="central" alignment-baseline="central" class="actor actor-box" style="text-anchor: middle; font-size: 16px; font-weight: 400;"><tspan x="75" dy="0">Sender</tspan></text></g><g><rect x="-61.5" y="75" fill="#EDF2AE" stroke="#666" width="273" height="115" class="note"></rect><text x="75" y="80" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="75">build_fragmented_bundle(bundle)</tspan></text><text x="75" y="99" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="75">FRAGMENT_BODY_SIZE = 1300 bytes</tspan></text><text x="75" y="118" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="75">N = ceil(total / 1300)</tspan></text><text x="75" y="137" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="75">frag_begin = first seq_id</tspan></text><text x="75" y="156" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="75">frag_end = frag_begin + N - 1</tspan></text></g><g><rect x="853" y="334" fill="#EDF2AE" stroke="#666" width="276" height="96" class="note"></rect><text x="991" y="339" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">key = frag_begin = X</tspan></text><text x="991" y="358" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">idx = seq_id - frag_begin = 0</tspan></text><text x="991" y="377" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">total = frag_end - frag_begin + 1 = N</tspan></text><text x="991" y="396" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">store buf[0] = body</tspan></text></g><g><rect x="909" y="536" fill="#EDF2AE" stroke="#666" width="164" height="39" class="note"></rect><text x="991" y="541" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">idx=1, store buf[1]</tspan></text></g><g><rect x="837" y="681" fill="#EDF2AE" stroke="#666" width="308" height="77" class="note"></rect><text x="991" y="686" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">idx=N-1, all slots filled</tspan></text><text x="991" y="705" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">concatenate buf[0..N-1]</tspan></text><text x="991" y="724" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">remove PendingMessage from HashMap</tspan></text></g><g><rect x="753" y="816" fill="#EDF2AE" stroke="#666" width="476" height="58" class="note"></rect><text x="991" y="821" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">Stale cleanup: FRAGMENT_REASSEMBLY_TIMEOUT_MS=30,000ms</tspan></text><text x="991" y="840" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" class="noteText" dy="1em"><tspan x="991">cleanup_stale() called each Nub tick()</tspan></text></g><text x="293" y="205" text-anchor="middle" class="messageText" dy="1em">frag[0] flags=RELIABLE|FRAGMENTED|HAS_SEQ</text><text x="293" y="224" text-anchor="middle" class="messageText" dy="1em">seq_id=frag_begin, frag_begin=X, frag_end=X+N-1</text><text x="293" y="243" text-anchor="middle" class="messageText" dy="1em">body=1300 bytes + acks (only first frag carries acks)</text><line x1="76" y1="276" x2="510" y2="276" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line><text x="751" y="291" text-anchor="middle" class="messageText" dy="1em">process_parsed(seq_id=X, frag_begin=X, frag_end=X+N-1)</text><line x1="515" y1="324" x2="987" y2="324" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line><text x="293" y="445" text-anchor="middle" class="messageText" dy="1em">frag[1] seq_id=X+1, same frag_begin/frag_end</text><line x1="76" y1="478" x2="510" y2="478" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line><text x="751" y="493" text-anchor="middle" class="messageText" dy="1em">process_parsed(seq_id=X+1)</text><line x1="515" y1="526" x2="987" y2="526" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line><text x="293" y="590" text-anchor="middle" class="messageText" dy="1em">frag[N-1] seq_id=X+N-1</text><line x1="76" y1="623" x2="510" y2="623" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line><text x="751" y="638" text-anchor="middle" class="messageText" dy="1em">process_parsed(seq_id=X+N-1)</text><line x1="515" y1="671" x2="987" y2="671" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line><text x="1160" y="773" text-anchor="middle" class="messageText" dy="1em">reassembled body (complete bundle)</text><line x1="992" y1="806" x2="1327" y2="806" class="messageLine0" stroke-width="2" stroke="none" marker-end="url(#arrowhead)" style="fill: none;"></line></svg>