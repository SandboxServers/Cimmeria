<?xml version="1.0" encoding="UTF-8"?><svg xmlns:svg="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.0" width="710" height="454" viewBox="0 0 710 454" >
<!-- cimmeria-bg-injected --><style>.cimmeria-bg{fill:transparent}@media(prefers-color-scheme:dark){.cimmeria-bg{fill:white}}</style><rect class="cimmeria-bg" width="100%" height="100%"/><text x="60" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >0</text><text x="100" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >1</text><text x="140" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >2</text><text x="180" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >3</text><text x="220" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >4</text><text x="260" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >5</text><text x="300" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >6</text><text x="340" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >7</text><text x="380" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >8</text><text x="420" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >9</text><text x="460" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >a</text><text x="500" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >b</text><text x="540" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >c</text><text x="580" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >d</text><text x="620" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >e</text><text x="660" y="8" font-family="Courier New, monospace" font-size="11" dominant-baseline="middle" text-anchor="middle" >f</text><text font-style="bold" fill="#bdd7ee" x="60" y="35" text-anchor="middle" dominant-baseline="middle" >0x36</text><text fill="#ddffdd" x="120" y="35" text-anchor="middle" dominant-baseline="middle" >word_len (u16 LE)</text><text fill="#ddffdd" x="200" y="35" text-anchor="middle" dominant-baseline="middle" >dataId (u16 LE) — per-resource transfer ID</text><text fill="#ddffdd" x="260" y="35" text-anchor="middle" dominant-baseline="middle" >chunkId (u8) — fragment seq #</text><text fill="#ddffdd" x="300" y="35" text-anchor="middle" dominant-baseline="middle" >flags (u8) — INITIAL=0x01 FINAL=0x02 BASE=0x40 ERROR=0x80</text><text fill="#fafafa" x="500" y="35" text-anchor="middle" dominant-baseline="middle" >  →  fragment body follows  →</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="34" text-anchor="end" >00</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="72" text-anchor="end" >10</text><line x1="40" y1="53" x2="40" y2="53" stroke="#000000" stroke-width="1" /><line x1="40" y1="53" x2="40" y2="91" stroke="#000000" stroke-width="1" /><line x1="40" y1="53" x2="40" y2="91" stroke="#000000" stroke-width="1" /><line x1="680" y1="53" x2="680" y2="91" stroke="#000000" stroke-width="1" /><line x1="40" y1="53" x2="40" y2="91" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="73" text-anchor="middle" dominant-baseline="middle" >  Every fragment carries the 4-byte header. BASE_FLAG (0x40) is set in all observed normal traffic.</text><text font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" x="35" y="110" text-anchor="end" >20</text><line x1="40" y1="91" x2="40" y2="106" stroke="#000000" stroke-width="1" /><line x1="680" y1="91" x2="680" y2="136" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="106" x2="680" y2="136" stroke="#000000" stroke-width="1" /><line x1="40" y1="116" x2="40" y2="161" stroke="#000000" stroke-width="1" /><line x1="680" y1="146" x2="680" y2="161" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="116" x2="680" y2="146" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="180" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text fill="#fff4d6" x="60" y="181" text-anchor="middle" dominant-baseline="middle" >msgType=0x00</text><text fill="#fff4d6" x="160" y="181" text-anchor="middle" dominant-baseline="middle" >categoryId (u32 LE)</text><text fill="#fff4d6" x="320" y="181" text-anchor="middle" dominant-baseline="middle" >elementId (u32 LE)</text><text fill="#ffeedd" x="540" y="181" text-anchor="middle" dominant-baseline="middle" >xmlBody — start of XML document (continues into following fragments)</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="180" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="218" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >10</tspan></text><line x1="40" y1="199" x2="40" y2="199" stroke="#000000" stroke-width="1" /><line x1="40" y1="199" x2="40" y2="237" stroke="#000000" stroke-width="1" /><line x1="40" y1="199" x2="40" y2="237" stroke="#000000" stroke-width="1" /><line x1="680" y1="199" x2="680" y2="237" stroke="#000000" stroke-width="1" /><line x1="40" y1="199" x2="40" y2="237" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="219" text-anchor="middle" dominant-baseline="middle" >  FIRST FRAGMENT body — 9-byte cooked-data prefix (msgType=0 MESSAGE_CacheData, categoryId, elementId) then start of XML.</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="256" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >20</tspan></text><line x1="40" y1="237" x2="40" y2="252" stroke="#000000" stroke-width="1" /><line x1="680" y1="237" x2="680" y2="282" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="252" x2="680" y2="282" stroke="#000000" stroke-width="1" /><line x1="40" y1="262" x2="40" y2="307" stroke="#000000" stroke-width="1" /><line x1="680" y1="292" x2="680" y2="307" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="262" x2="680" y2="292" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="326" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text fill="#ffeedd" x="360" y="327" text-anchor="middle" dominant-baseline="middle" >xmlBody continuation — body is purely the next XML chunk; no prefix</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="326" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="364" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >10</tspan></text><line x1="40" y1="345" x2="40" y2="345" stroke="#000000" stroke-width="1" /><line x1="40" y1="345" x2="40" y2="383" stroke="#000000" stroke-width="1" /><line x1="40" y1="345" x2="40" y2="383" stroke="#000000" stroke-width="1" /><line x1="680" y1="345" x2="680" y2="383" stroke="#000000" stroke-width="1" /><line x1="40" y1="345" x2="40" y2="383" stroke="#000000" stroke-width="1" /><text font-size="18" font-family="Palatino, Georgia, Times New Roman, serif" x="360" y="365" text-anchor="middle" dominant-baseline="middle" >  SUBSEQUENT FRAGMENTS — body is XML continuation only. FINAL_FRAGMENT (0x02) triggers reassembly via head-first concat.</text><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="402" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >20</tspan></text><line x1="40" y1="383" x2="40" y2="398" stroke="#000000" stroke-width="1" /><line x1="680" y1="383" x2="680" y2="428" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="398" x2="680" y2="428" stroke="#000000" stroke-width="1" /><line x1="40" y1="408" x2="40" y2="453" stroke="#000000" stroke-width="1" /><line x1="680" y1="438" x2="680" y2="453" stroke="#000000" stroke-width="1" /><line stroke-dasharray="1,1" x1="40" y1="408" x2="680" y2="438" stroke="#000000" stroke-width="1" /><text font-size="11" font-family="Palatino, Georgia, Times New Roman, serif" font-style="italic" dominant-baseline="middle" x="35" y="472" text-anchor="end" >i+<tspan font-size="11" font-family="Courier New, monospace" font-style="normal" dominant-baseline="middle" >00</tspan></text></svg>